<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3ece2">
<meta name="description" content="Quien recibe los avisos de La Positiva: dispositivos y numeros de WhatsApp por rol.">
<title>La Positiva - Quien recibe los avisos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="La Positiva">
<link rel="preload" href="fonts/jost-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/cormorant-500-italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
<style>
  .wrap{max-width:860px;padding-top:calc(36px + var(--sa-t))}
  .intro{margin-bottom:26px}
  .intro h1{font-size:32px;margin:0 0 6px}
  .intro p{color:var(--muted);margin:0;font-size:16px;line-height:1.55}

  .rol{
    background:var(--card);border:1px solid var(--border);
    border-radius:var(--r-lg);padding:20px 20px 22px;margin-bottom:20px;
  }
  .rol > h2{
    margin:0 0 4px;font-size:24px;
  }
  .rol > .quien{color:var(--muted);font-size:15px;margin:0 0 18px;line-height:1.5}

  .canal{margin-top:20px;padding-top:18px;border-top:1px dashed var(--border)}
  .canal:first-of-type{margin-top:0;padding-top:0;border-top:none}
  .canal h3{
    font-family:'Jost',sans-serif;font-style:normal;font-size:13px;
    letter-spacing:.1em;text-transform:uppercase;font-weight:600;
    color:var(--muted-strong);margin:0 0 10px;
  }

  /* --------------------------------------------------------- listados --- */
  .lista{list-style:none;margin:0 0 12px;padding:0}
  .lista li{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:11px 13px;border:1px solid var(--border);border-radius:var(--r-md);
    margin-bottom:8px;background:var(--bg);
  }
  .lista li:last-child{margin-bottom:0}
  .lista .cual{flex:1;min-width:180px}
  .lista .cual b{display:block;font-size:15px;color:var(--ink)}
  .lista .cual span{font-size:13px;color:var(--muted)}
  .lista .yo{
    flex:none;font-size:12px;font-weight:600;letter-spacing:.05em;
    text-transform:uppercase;color:var(--ok);background:var(--ok-soft);
    border:1px solid #bfe0ce;border-radius:var(--r-pill);padding:3px 10px;
  }
  .sacar{
    flex:none;min-height:38px;padding:0 14px;border-radius:var(--r-pill);
    border:1px solid var(--border-strong);background:transparent;
    color:var(--err-ink);font-size:14px;
  }
  .sacar:hover{background:var(--err-bg);border-color:#f0cfc9}

  .vacio{
    margin:0 0 12px;padding:12px 14px;border-radius:var(--r-md);
    background:var(--err-bg);color:var(--err-ink);border:1px solid #f0cfc9;
    font-size:15px;line-height:1.5;
  }
  .vacio.suave{background:var(--warn-soft);color:var(--warn);border-color:#e8d3a8}

  /* ------------------------------------------------------- alta de tel --- */
  .alta{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
  .alta input{
    flex:1 1 190px;min-height:var(--tap);padding:10px 13px;font-size:16px;
    border:1px solid var(--border-strong);border-radius:var(--r-md);
    background:var(--bg);color:var(--ink);font-family:inherit;
  }
  .alta input:focus{outline:2px solid var(--accent);outline-offset:1px}
  .alta button{flex:none;min-height:var(--tap);padding:0 20px;font-size:15px}
  .ayuda{font-size:13px;color:var(--muted);margin:8px 0 0;line-height:1.5}

  .acciones{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .acciones .btn{padding:9px 18px;font-size:15px}

  .aviso{
    margin:0 0 20px;padding:14px 16px;border-radius:var(--r-md);
    font-size:15px;line-height:1.55;
  }
  .aviso.err{background:var(--err-bg);color:var(--err-ink);border:1px solid #f0cfc9}
  .aviso.warn{background:var(--warn-soft);color:var(--warn);border:1px solid #e8d3a8}
  .aviso strong{display:block;margin-bottom:3px;color:var(--ink)}
  .aviso[hidden]{display:none}

  .back-link{
    display:inline-flex;align-items:center;min-height:var(--tap);
    color:var(--muted-strong);font-size:15px;text-decoration:underline;
  }
  .back-link:hover{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <div class="intro">
    <h1>Quien recibe los avisos</h1>
    <p>Cada rol avisa por su cuenta. Aca se ve exactamente que aparatos y que numeros
       estan escuchando, y se saca el que no corresponde.</p>
  </div>

  <div class="aviso err" id="avisoPush" hidden></div>
  <div class="aviso warn" id="avisoWA" hidden></div>

  <div id="roles"></div>

  <a class="back-link" href="./">Volver al inicio</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<script src="config.js" defer></script>
<script src="app.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  'use strict';
  var esc = LP.esc;
  var sb = LP.client();

  /* Los dos roles del sistema. 'Cocina' recibe el pedido nuevo; 'Jonathan',
     el pago confirmado. Son audiencias distintas a proposito: por eso un
     aviso de cocina no le suena al encargado y al reves.                 */
  var ROLES = [
    {
      id: 'Mozo',
      titulo: 'Mozo',
      quien: 'Recibe el aviso cuando una mesa pide algo y necesita que lo aprueben, ' +
             'y cuando la cocina responde. Es el que mas avisos recibe.',
      prueba: { title: 'Prueba de aviso', body: 'Si ves esto, los avisos del mozo funcionan.',
                url: 'mozo.html' },
      wa: 'Hay un pedido esperando aprobacion en La Positiva. (mensaje de prueba)'
    },
    {
      id: 'Cocina',
      titulo: 'Cocina',
      quien: 'Recibe el aviso cuando entra un pedido nuevo. Va a la tablet o al celular ' +
             'que este en la cocina.',
      prueba: { title: 'Prueba de aviso', body: 'Si ves esto, los avisos de cocina funcionan.',
                url: 'cocina.html' },
      wa: 'Entro un pedido nuevo en La Positiva. (mensaje de prueba)'
    },
    {
      id: 'Jonathan',
      titulo: 'Jonathan',
      quien: 'Recibe el aviso cuando la caja confirma un pago. Va solo a sus aparatos, ' +
             'no a los del resto del equipo.',
      prueba: { title: 'Prueba de aviso', body: 'Si ves esto, tus avisos funcionan.',
                url: 'caja.html' },
      wa: 'Se confirmo un pago en La Positiva. (mensaje de prueba)'
    }
  ];

  var cont = document.getElementById('roles');

  /* Se dibuja el esqueleto una sola vez y despues solo se repintan las listas:
     asi el foco no se pierde mientras se escribe un numero.              */
  cont.innerHTML = ROLES.map(function (r) {
    return '<section class="rol" aria-labelledby="h-' + r.id + '">' +
      '<h2 id="h-' + r.id + '">' + esc(r.titulo) + '</h2>' +
      '<p class="quien">' + esc(r.quien) + '</p>' +

      '<div class="canal">' +
        '<h3>Avisos al celular (notificacion)</h3>' +
        '<div data-subs="' + r.id + '"><p class="ayuda">Cargando...</p></div>' +
        '<div class="acciones">' +
          '<button type="button" class="btn btn-secondary" data-probar-push="' + r.id + '">' +
            'Probar la notificacion</button>' +
        '</div>' +
      '</div>' +

      '<div class="canal">' +
        '<h3>Avisos por WhatsApp</h3>' +
        '<div data-wa="' + r.id + '"><p class="ayuda">Cargando...</p></div>' +
        '<form class="alta" data-alta="' + r.id + '">' +
          '<input type="tel" name="telefono" placeholder="+54 9 11 2233 4455" ' +
                 'aria-label="Numero de WhatsApp para ' + esc(r.titulo) + '" required>' +
          '<input type="text" name="nombre" placeholder="Como llamarlo (opcional)" ' +
                 'aria-label="Nombre del numero" maxlength="60">' +
          '<button type="submit" class="btn btn-primary">Agregar</button>' +
        '</form>' +
        '<p class="ayuda">Con codigo de pais y sin espacios ni guiones: <b>+5491122334455</b>.</p>' +
        '<div class="acciones">' +
          '<button type="button" class="btn btn-secondary" data-probar-wa="' + r.id + '">' +
            'Probar el WhatsApp</button>' +
        '</div>' +
      '</div>' +
    '</section>';
  }).join('');

  /* ------------------------------------------------------ dispositivos -- */
  function pintarSubs(rol) {
    var caja = cont.querySelector('[data-subs="' + rol + '"]');
    return LP.listarSubs(sb, rol).then(function (filas) {
      if (filas === null) {
        caja.innerHTML = '<p class="vacio suave">No pudimos leer los dispositivos. ' +
                         'Revisa la conexion.</p>';
        return;
      }
      if (!filas.length) {
        caja.innerHTML = '<p class="vacio">Ningun dispositivo tiene estos avisos activados: ' +
                         'hoy no le llega a nadie.</p>';
        return;
      }
      caja.innerHTML = '<ul class="lista">' + filas.map(function (f) {
        var cuando = new Date(f.created_at);
        var fecha = isNaN(cuando) ? '' : cuando.toLocaleDateString('es-AR') + ' ' +
                    cuando.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
        /* La huella es lo unico que distingue dos aparatos de la misma marca.
           Ademas deja ver de un vistazo que dos filas de roles distintos son
           en realidad EL MISMO aparato registrado dos veces.             */
        var huella = f.huella ? ' &middot; huella ' + esc(f.huella) : '';
        return '<li>' +
          '<span class="cual"><b>' + esc(f.dispositivo) + '</b>' +
            '<span>Activado el ' + esc(fecha) + huella + '</span></span>' +
          (f.esteAparato ? '<span class="yo">Este aparato</span>' : '') +
          '<button type="button" class="sacar" data-sacar-sub="' + f.id + '" ' +
                  'data-rol="' + rol + '">Sacar</button>' +
        '</li>';
      }).join('') + '</ul>';
    });
  }

  /* ---------------------------------------------------------- whatsapp -- */
  function pintarWA(rol) {
    var caja = cont.querySelector('[data-wa="' + rol + '"]');
    return LP.listarWhatsapp(sb, rol).then(function (filas) {
      if (filas === null) {
        caja.innerHTML = '<p class="vacio suave">No pudimos leer los numeros. ' +
                         'Revisa la conexion.</p>';
        return;
      }
      if (!filas.length) {
        caja.innerHTML = '<p class="vacio suave">Todavia no hay ningun numero cargado.</p>';
        return;
      }
      caja.innerHTML = '<ul class="lista">' + filas.map(function (f) {
        return '<li>' +
          '<span class="cual"><b>' + esc(f.telefono) + '</b>' +
            '<span>' + esc(f.nombre || 'Sin nombre') + '</span></span>' +
          '<button type="button" class="sacar" data-sacar-wa="' + f.id + '" ' +
                  'data-rol="' + rol + '">Sacar</button>' +
        '</li>';
      }).join('') + '</ul>';
    });
  }

  /* ------------------------------------------------------------ eventos -- */
  cont.addEventListener('click', function (ev) {
    var b = ev.target.closest('button');
    if (!b) return;

    if (b.dataset.sacarSub) {
      b.disabled = true; b.textContent = 'Sacando...';
      LP.borrarSub(sb, b.dataset.sacarSub).then(function (ok) {
        if (!ok) { b.disabled = false; b.textContent = 'Sacar';
                   LP.toast('No pudimos sacarlo. Proba de nuevo.', 'err'); return; }
        LP.toast('Dispositivo sacado.', 'ok');
        pintarSubs(b.dataset.rol);
      });
      return;
    }

    if (b.dataset.sacarWa) {
      b.disabled = true; b.textContent = 'Sacando...';
      LP.borrarWhatsapp(sb, b.dataset.sacarWa).then(function (ok) {
        if (!ok) { b.disabled = false; b.textContent = 'Sacar';
                   LP.toast('No pudimos sacarlo. Proba de nuevo.', 'err'); return; }
        LP.toast('Numero sacado.', 'ok');
        pintarWA(b.dataset.rol);
      });
      return;
    }

    if (b.dataset.probarPush) {
      var rolP = b.dataset.probarPush;
      var cfgP = buscarRol(rolP);
      b.disabled = true; b.textContent = 'Enviando...';
      LP.avisar(sb, rolP, cfgP.prueba.title, cfgP.prueba.body, null, cfgP.prueba.url, false)
        .then(function (r) {
          b.disabled = false; b.textContent = 'Probar la notificacion';
          if (r.ok) LP.toast('Aviso enviado. Deberia llegar en unos segundos.', 'ok');
          else if (r.config) mostrarAvisoPush(r.motivo);
          else LP.toast(r.motivo || 'No salio el aviso.', 'err');
        });
      return;
    }

    if (b.dataset.probarWa) {
      var rolW = b.dataset.probarWa;
      var cfgW = buscarRol(rolW);
      b.disabled = true; b.textContent = 'Enviando...';
      LP.avisarWhatsapp(sb, { rol: rolW, texto: cfgW.wa }).then(function (r) {
        b.disabled = false; b.textContent = 'Probar el WhatsApp';
        if (r.ok) LP.toast('WhatsApp enviado.', 'ok');
        else if (r.config) mostrarAvisoWA(r.motivo);
        else LP.toast(r.motivo || 'No salio el WhatsApp.', 'err');
      });
      return;
    }
  });

  cont.addEventListener('submit', function (ev) {
    var f = ev.target.closest('[data-alta]');
    if (!f) return;
    ev.preventDefault();

    var rol = f.dataset.alta;
    var tel = f.telefono.value.trim();
    var nom = f.nombre.value.trim();
    var btn = f.querySelector('button');

    btn.disabled = true; btn.textContent = 'Guardando...';
    LP.agregarWhatsapp(sb, rol, tel, nom).then(function (r) {
      btn.disabled = false; btn.textContent = 'Agregar';
      if (!r.ok) { LP.toast(r.motivo, 'err'); return; }
      f.reset();
      LP.toast('Numero agregado.', 'ok');
      pintarWA(rol);
    });
  });

  function buscarRol(id) {
    for (var i = 0; i < ROLES.length; i++) if (ROLES[i].id === id) return ROLES[i];
    return ROLES[0];
  }

  /* Los problemas de configuracion del servidor se muestran una sola vez
     arriba, no como un toast que se va: no se arreglan desde esta pantalla
     y hay que poder leerlos con calma.                                   */
  function mostrarAvisoPush(motivo) {
    var el = document.getElementById('avisoPush');
    el.innerHTML = '<strong>Las notificaciones estan sin configurar en el servidor</strong>' +
                   esc(motivo || '');
    el.hidden = false;
  }
  function mostrarAvisoWA(motivo) {
    var el = document.getElementById('avisoWA');
    el.innerHTML = '<strong>WhatsApp todavia no esta configurado</strong>' +
                   esc(motivo || '');
    el.hidden = false;
  }

  /* ------------------------------------------------------------ inicio -- */
  if (!sb) {
    cont.innerHTML = '<p class="vacio">No hay conexion con el sistema.</p>';
    return;
  }
  ROLES.forEach(function (r) { pintarSubs(r.id); pintarWA(r.id); });
});
</script>
</body>
</html>
