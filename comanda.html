<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14100e">
<meta name="description" content="El mozo toma la comanda en la mesa: elige la mesa, cuanta gente hay y carga los platos de la carta.">
<title>La Positiva - Tomar comanda</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="La Positiva">
<link rel="preload" href="fonts/jost-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/cormorant-500-italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
<!-- El tema (nombre, color, letra y forma) que se edita en diseno.html.
     SIN defer y a proposito: tiene que escribir las variables ANTES del
     primer pintado, o el color viejo se ve un instante y despues salta.
     Si no hay nada guardado no escribe nada y la app queda como siempre. -->
<script src="tema.js"></script>
<style>
  /* ------------------------------------------------------------------------
     TOMAR COMANDA. Es la pantalla que mas se usa en el servicio: el mozo
     parado al lado de la mesa, con el celular en una mano y la libreta en la
     otra. Todo lo que hay aca esta puesto para eso.

     Cuatro decisiones que explican el resto:

     1. PRIMERO LOS PLATOS, DESPUES LA MESA. Antes era al reves y estaba mal.
        Con el salon lleno lo urgente es anotar lo que la mesa acaba de decir,
        antes de olvidarlo; el numero de mesa el mozo lo tiene delante de los
        ojos y lo puede completar diez segundos despues. Por eso el orden es
        que pedis -> cuantos son -> que mesa, y la mesa es obligatoria recien
        al mandar a la cocina, nunca antes.

     2. LA CARTA VA EN LISTA, NO EN FICHAS CON FOTO GRANDE. El mozo sabe que
        es una provoleta: necesita encontrar el nombre y sumarlo, y en fichas
        entran cuatro platos por pantalla contra los quince de la lista. La
        foto esta igual, pero chica y al costado, para MOSTRARSELA AL
        COMENSAL, que es para lo unico que sirve aca.

     3. LA FILA ENTERA SUMA UNO. No hay que apuntarle a un boton chico: se
        toca el plato y se agrega. Es un gesto solo, con el pulgar, sin mirar.

     4. DESLIZAR LA FILA ABRE LA FOTO Y NO AGREGA NADA. El gesto de WhatsApp.
        Es la regla mas importante de las fotos: mostrarle el plato al
        comensal no puede cambiarle el pedido ni por accidente.

     El archivo NO toca styles.css: todo lo propio de esta pantalla vive aca
     adentro, como pide la division de trabajo del proyecto.               */

  .wrap{max-width:1180px}

  /* La cabecera del campo de la nota: la etiqueta a la izquierda y el
     boton de grabar a la derecha, en la misma linea. El boton es
     secundario a proposito: escribir sigue siendo el camino de
     siempre y grabar es el atajo, no al reves. */
  .nota-cabeza{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .nota-cabeza label{margin:0}
  .btn-voz{
    flex:none;min-height:40px;padding:0 14px;border-radius:var(--r-pill);
    border:1px solid var(--accent);background:var(--card);color:var(--accent);
    font:inherit;font-size:15px;font-weight:500;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;
  }
  .btn-voz:active{background:var(--bg)}
  .btn-voz:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* El pie fijo con el total tapa el final de la lista: se le devuelve el
     alto en padding para que el ultimo plato se pueda tocar siempre. */
  body.con-barra .wrap{padding-bottom:calc(112px + var(--sa-b))}

  h2.seccion{
    color:#fff;font-family:var(--font-cuerpo);font-style:normal;
    font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;
    margin:20px 0 10px;display:flex;align-items:center;gap:9px;
  }
  h2.seccion:first-of-type{margin-top:6px}
  h2.seccion .paso{
    display:inline-flex;align-items:center;justify-content:center;
    width:22px;height:22px;border-radius:50%;
    background:var(--gold);color:var(--ink);font-size:13px;font-weight:700;flex:none;
  }

  /* --------------------------------------------------- paso 1: buscador --
     Pegado debajo de la barra de navegacion: el mozo tiene que poder buscar
     un plato sin volver a subir la lista de 156. */
  .buscar{position:relative;margin:0 0 10px}
  .buscar input{
    width:100%;min-height:50px;padding:10px 44px 10px 14px;font-size:16px;
    border:1px solid var(--dark-border);border-radius:var(--r-md);
    background:var(--dark-card);color:#fff;
  }
  .buscar input::placeholder{color:var(--dark-muted)}
  .buscar .limpiar{
    position:absolute;right:5px;top:50%;transform:translateY(-50%);
    width:40px;height:40px;border-radius:50%;color:var(--dark-muted);font-size:17px;
  }
  .buscar .limpiar:hover{color:#fff;background:var(--dark-card-hover)}
  .buscar .limpiar[hidden]{display:none}

  /* ------------------------------------------- paso 1: las 19 categorias --
     La carta tiene 19 categorias y 160 platos. La tira horizontal sola no
     alcanza: para llegar a "Parrilla al carbon" -que esta quinta- o a
     "Vinos tintos" -que esta decimoseptima- el mozo tenia que arrastrar la
     tira sin ver cuanto le faltaba, y el mozo YA SABE donde esta cada cosa.

     Se eligio la HOJA CON LAS 19 EN GRILLA y no "chips mejor marcados", que
     era la otra opcion. La razon: marcar mejor los chips arregla saber DONDE
     ESTAS, pero no arregla LLEGAR -la tira sigue teniendo el mismo largo-, y
     el pedido era llegar en un toque. Con la hoja se ven las 19 de una, sin
     scrollear ninguna, y son dos toques fijos desde cualquier lugar de la
     carta: abrir y elegir. La tira se queda igual para el que va de
     Entradas a Ensaladas, que es el paso de al lado.

     El boton que abre la hoja vive AFUERA de la tira que se arrastra: si
     estuviera adentro se iria de pantalla al tercer chip, que es justo el
     momento en el que se lo necesita. */
  .cats-fila{display:flex;align-items:flex-start;gap:8px;min-width:0}
  .cat-todas{
    flex:none;min-height:var(--tap);min-width:var(--tap);padding:0 12px;
    border-radius:var(--r-pill);
    background:var(--dark-card);border:1px solid var(--gold);color:var(--gold);
    font-size:14px;font-weight:500;white-space:nowrap;
    display:inline-flex;align-items:center;gap:7px;
  }
  .cat-todas svg{flex:none}
  .cat-todas:hover{background:var(--dark-card-hover)}
  .cat-todas:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  .cats{
    display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
    min-width:0;
  }
  .cats::-webkit-scrollbar{display:none}
  .cat-b{
    flex:none;min-height:var(--tap);padding:0 14px;border-radius:var(--r-pill);
    background:var(--dark-card);border:1px solid var(--dark-border);
    color:var(--dark-ink);font-size:14px;white-space:nowrap;
  }
  .cat-b[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:600}

  /* En que categoria estas. Antes era el mismo gris chico que el resto de
     los rotulos y se perdia; ahora es el renglon que contesta "donde estoy",
     con el punto dorado adelante y el numero de platos al lado. */
  .cat-donde{
    display:flex;align-items:center;gap:8px;
    margin:2px 0 9px;color:#fff;font-size:15px;font-weight:500;line-height:1.25;
  }
  .cat-donde::before{
    content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--gold);
  }
  .cat-donde em{font-style:normal;color:var(--dark-muted);font-size:13px;font-weight:400}

  /* La grilla de la hoja. Dos columnas en el celular y tres de 480px en
     adelante: con 19 categorias, dos columnas entran enteras en 812px de
     alto sin scrollear. */
  .cats-grilla{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
  @media (min-width:480px){.cats-grilla{grid-template-columns:repeat(3,minmax(0,1fr))}}
  .cg-b{
    /* 52px y no 56: son diez filas, y con 56 la ultima -"Cervezas (porron /
       lata)"- quedaba medio renglon abajo del borde de la hoja. Sigue arriba
       de los 44px de la regla del tap. */
    display:flex;flex-direction:column;align-items:flex-start;justify-content:center;
    gap:1px;min-height:52px;padding:8px 11px;width:100%;
    background:var(--card);border:1px solid var(--border-strong);
    border-radius:var(--r-md);
    font-family:inherit;font-size:15px;color:var(--ink);text-align:left;cursor:pointer;
    line-height:1.2;
  }
  .cg-b span{font-size:12px;color:var(--muted)}
  .cg-b:hover{border-color:var(--accent)}
  .cg-b[aria-current="true"]{
    background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;
  }
  .cg-b[aria-current="true"] span{color:#fff;opacity:.85}
  /* La que no tiene ningun plato disponible: se ve, se puede abrir, pero
     avisa. Que la cocina marque toda una categoria como agotada es raro pero
     pasa un lunes a la noche, y entrar a una lista vacia se lee como que se
     rompio. */
  .cg-b.vacia{opacity:.62}

  /* La pastilla de accesos rapidos de app.js se esconde mientras el pie con
     el total esta a la vista: son las dos cosas pegadas abajo y apiladas se
     comen 170px de una pantalla de 812px. Mientras hay platos cargados el
     camino es el pie -no se salta a otra pantalla en medio de una comanda- y
     el "Volver" de la barra de arriba sigue estando siempre. */
  body.con-barra .acceso-rapido{display:none}

  /* ------------------------------------------------- paso 1: el estado --
     Que mesa lleva la comanda, si es que ya se eligio. En el flujo nuevo lo
     normal es que todavia NO haya mesa, y decirlo en voz alta es justamente
     lo que evita que se mande sin ella. */
  .barra-mesa{
    position:sticky;top:var(--nav-h);z-index:4;margin:0 0 10px;
    padding:9px 0 10px;background:var(--ink);
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .barra-mesa .quien-mesa{
    display:inline-flex;align-items:center;gap:8px;
    font-family:var(--font-titulos);font-style:var(--font-titulos-estilo);
    font-size:23px;color:#fff;line-height:1;
  }
  .barra-mesa .quien-mesa.sin{
    font-family:var(--font-cuerpo);font-style:normal;
    font-size:15px;color:var(--dark-muted);
  }
  .barra-mesa .pers{
    font-family:var(--font-cuerpo);font-style:normal;font-size:13px;
    color:var(--ink);background:var(--gold);border-radius:var(--r-pill);
    padding:4px 10px;font-weight:600;
  }
  .btn-cambiar{
    margin-left:auto;min-height:var(--tap);padding:0 14px;border-radius:var(--r-pill);
    background:transparent;border:1px solid var(--dark-border);color:var(--dark-ink);font-size:15px;
  }
  .btn-cambiar:hover{border-color:var(--gold);color:#fff}

  /* ---------------------------------------------------- paso 1: la carta --
     En pantalla ancha va en dos columnas: en la tablet del salon sobraba
     medio metro de mesa vacia a la derecha y la lista obligaba a bajar el
     doble. */
  .carta{list-style:none;margin:0;padding:0;display:grid;gap:6px}
  @media (min-width:760px){.carta{grid-template-columns:repeat(2,minmax(0,1fr))}}
  /* El rotulo gris chico de la categoria ya no existe: lo reemplaza
     .cat-donde, que es el renglon que contesta "en que categoria estoy". */

  .plato{
    position:relative;overflow:hidden;
    background:var(--dark-card);border:1px solid var(--dark-border);
    border-radius:var(--r-md);
  }
  .plato.tiene{border-color:var(--gold)}
  .plato.agotado{opacity:.5}

  /* Lo que se mueve al deslizar. Detras queda el cartel de la foto. */
  .pl-desliz{
    position:relative;z-index:1;display:flex;align-items:stretch;
    flex-wrap:wrap;gap:8px;background:var(--dark-card);
    transition:transform .18s ease;touch-action:pan-y;
  }
  .plato.arrastrando .pl-desliz{transition:none}
  .pl-hint{
    position:absolute;top:0;right:0;bottom:0;width:96px;z-index:0;
    display:flex;align-items:center;justify-content:center;gap:6px;
    background:var(--dark-panel);color:var(--gold);font-size:13px;
    opacity:0;pointer-events:none;
  }

  .pl-main{
    flex:1 1 200px;min-width:0;display:flex;align-items:center;gap:8px;
    padding:9px 4px 9px 12px;min-height:56px;text-align:left;color:#fff;
  }
  .pl-main:hover{background:var(--dark-card-hover)}
  .pl-tex{flex:1;min-width:0}
  .pl-tex b{display:block;font-size:16px;font-weight:500;line-height:1.25}
  /* La aclaracion se corta en un renglon. Con la miniatura y el boton de
     foto en la misma fila, dejarla crecer llevaba la fila a 95px de alto y
     la lista pasaba de quince platos por pantalla a seis: justo lo que esta
     pantalla evita. Entera se lee en la foto grande. */
  .pl-tex i{
    display:block;font-style:normal;font-size:13px;color:var(--dark-muted);line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  /* La miniatura, justo a la izquierda del precio. Es para mostrarsela al
     comensal, no para decorar: por eso se ve aunque la fila este agotada. */
  .pl-foto{
    position:relative;flex:none;width:38px;height:38px;border-radius:9px;
    overflow:hidden;background:var(--dark-panel);border:1px solid var(--dark-border);
  }
  .pl-foto img{
    position:relative;z-index:1;width:100%;height:100%;object-fit:cover;display:block;
  }
  .pl-foto .ini{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:var(--font-titulos);font-style:var(--font-titulos-estilo);
    font-size:18px;color:var(--dark-muted);
  }
  .pl-pre{
    flex:none;font-size:14px;color:var(--dark-ink);
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }

  .pl-act{display:flex;align-items:center;gap:2px;padding:6px 6px 6px 0}
  .pl-act .icon-btn{background:var(--dark-panel);border-color:var(--dark-border);color:#fff}
  .pl-act .icon-btn:hover{background:var(--dark-card-hover);border-color:var(--gold)}
  .pl-act .ver-foto{color:var(--gold)}
  .pl-act .ver-foto svg{display:block}
  .pl-q{
    min-width:28px;text-align:center;font-size:17px;font-weight:600;color:var(--gold);
    font-variant-numeric:tabular-nums;
  }
  .pl-no{
    flex:none;padding:0 12px;font-size:13px;color:var(--dark-muted);
    display:flex;align-items:center;
  }

  /* En el celular, la fila que YA tiene algo cargado suma dos botones mas
     (menos y mas) y no entra en un renglon sin dejar el nombre del plato en
     30px. Esa sola fila pasa los botones abajo; las otras 150 siguen
     midiendo un renglon, que es lo que hace rapida a la lista. */
  @media (max-width:559px){
    .plato.tiene .pl-main{flex:1 1 100%}
    .plato.tiene .pl-act{
      flex:1 1 100%;justify-content:flex-end;
      padding:0 8px 8px;gap:4px;
    }
  }

  .nada{
    color:var(--dark-muted);text-align:center;padding:26px 16px;font-size:15px;
    border:1px dashed var(--dark-border);border-radius:var(--r-md);grid-column:1/-1;
  }

  /* --------------------------------------------------------- paso 2: gente --
     Las doce mesas entran juntas: en el celular son tres columnas, en la
     tablet del salon seis. Sin scroll para elegir, que es el punto. */
  .gente-fila{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .npers{
    min-width:var(--tap);min-height:var(--tap);padding:0 14px;border-radius:var(--r-pill);
    background:var(--dark-card);border:1px solid var(--dark-border);color:#fff;font-size:17px;
  }
  .npers:hover{border-color:var(--gold)}
  .npers[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:600}
  .npers.mas{font-size:15px;padding:0 16px}
  .gente-otra{display:flex;align-items:center;gap:8px;margin-top:10px}
  .gente-otra[hidden]{display:none}
  .gente-otra input{
    width:92px;min-height:var(--tap);padding:8px 12px;font-size:17px;text-align:center;
    border:1px solid var(--dark-border);border-radius:var(--r-md);
    background:var(--dark-card);color:#fff;
  }
  .gente-otra label{color:var(--dark-muted);font-size:14px}

  .mesas{
    display:grid;gap:8px;margin:0;padding:0;list-style:none;
    grid-template-columns:repeat(auto-fill,minmax(98px,1fr));
  }
  .mesa{
    width:100%;min-height:78px;padding:9px 8px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    background:var(--dark-card);border:1px solid var(--dark-border);border-radius:var(--r-md);
    color:#fff;text-align:center;
    transition:border-color .16s,background-color .16s,transform .08s;
  }
  .mesa:hover{background:var(--dark-card-hover);border-color:var(--gold)}
  .mesa:active{transform:scale(.98)}
  .mesa[aria-pressed="true"]{
    border-color:var(--accent);background:var(--accent);
    box-shadow:0 0 0 2px rgba(180,71,42,.35);
  }
  .mesa .num{font-family:var(--font-titulos);font-style:var(--font-titulos-estilo);font-size:23px;line-height:1.05}
  .mesa .est{font-size:12px;color:var(--dark-muted);line-height:1.25}
  .mesa[aria-pressed="true"] .est{color:#ffe6dc}
  .mesa .est.ocupada{color:var(--gold)}
  .mesa[aria-pressed="true"] .est.ocupada{color:#fff}

  /* Que dato falta. Se toca dos veces para deseleccionar, asi que este
     renglon es el que contesta "y ahora que me falta". */
  .falta{
    margin:16px 0 0;padding:11px 13px;border-radius:var(--r-md);font-size:14px;line-height:1.5;
    background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-border);
  }
  .falta.listo{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-border)}

  /* --------------------------------------------------------- pie fijo ---- */
  .pie{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    padding:10px max(14px,var(--sa-l)) calc(10px + var(--sa-b)) max(14px,var(--sa-r));
    background:var(--dark-panel);border-top:1px solid var(--dark-border);
    box-shadow:0 -8px 24px rgba(0,0,0,.4);
  }
  .pie[hidden]{display:none}
  .pie-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px}
  /* El total es el boton que abre la comanda: es el area mas grande del pie
     y no le roba ancho al boton que sigue el flujo. */
  .pie-ver{
    flex:1;min-width:0;min-height:var(--tap);padding:0;
    color:#fff;line-height:1.25;text-align:left;
  }
  .pie-ver b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
  .pie-ver span{font-size:13px;color:var(--dark-muted)}
  .pie-ver:hover span{color:var(--gold)}
  .pie .btn{flex:none;min-height:52px;padding:0 20px;font-size:17px}

  /* -------------------------------------------------------- la comanda --- */
  .lin{
    display:flex;align-items:center;gap:10px;padding:10px 0;
    border-bottom:1px solid var(--border);
  }
  .lin:last-of-type{border-bottom:none}
  .lin-tex{flex:1;min-width:0}
  .lin-tex b{display:block;font-size:16px;font-weight:500}
  .lin-tex span{font-size:13px;color:var(--muted)}
  .lin-act{display:flex;align-items:center;gap:2px;flex:none}
  .lin-q{min-width:26px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
  .lin-pre{flex:none;min-width:78px;text-align:right;font-variant-numeric:tabular-nums}

  .total-fila{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-top:14px;padding-top:12px;border-top:2px solid var(--border-strong);
    font-size:21px;font-weight:600;
  }
  .campo{margin-top:14px}
  .campo label{display:block;font-size:13px;color:var(--muted-strong);margin-bottom:5px}
  .campo textarea{
    width:100%;min-height:76px;padding:9px 12px;font-size:16px;
    border:1px solid var(--border-strong);border-radius:var(--r-md);
    background:var(--bg);color:var(--ink);font-family:inherit;resize:vertical;
  }
  .campo textarea:focus{outline:2px solid var(--accent);outline-offset:1px}

  .aviso{
    margin:0 0 12px;padding:10px 13px;border-radius:var(--r-md);font-size:14px;line-height:1.5;
    background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-border);
  }
  .aviso[hidden]{display:none}

  /* ------------------------------------------------------- la foto grande --
     Ojo con esta hoja: NO tiene un solo boton que toque el pedido, y es a
     proposito. Se abre para mostrarle el plato al comensal; al cerrarla la
     comanda tiene que estar exactamente igual que antes de abrirla. */
  .visor-panel{background:var(--ink);color:#fff;max-width:720px}
  .visor-panel .sheet-head h2{color:#fff}
  .visor-panel .close-x{background:var(--dark-card);border-color:var(--dark-border);color:#fff}
  .visor-caja{
    border-radius:var(--r-md);overflow:hidden;background:var(--dark-panel);
    border:1px solid var(--dark-border);
  }
  .visor-caja img{

  .visor-pie b{color:#fff;font-variant-numeric:tabular-nums}

  /* --------------------------------------------------------- se mando ---- */
  .hecho{text-align:center;padding:10px 0 4px}

  /* Celular: las doce mesas, los numeros de gente y el boton tienen que
     entrar en la primera pantalla del paso 2. Los botones NO se achican: se

  }
</style>

             fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
          <rect x="4" y="4" width="7" height="7" rx="1.6"/>
          <rect x="13" y="4" width="7" height="7" rx="1.6"/>

               aria-label="Cu&aacute;ntas personas hay en la mesa">

<!-- La grabadora y las frases de siempre. Va DESPUES de app.js: usa LP. -->
<script src="notas.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  'use strict';
  /* El puesto primero: si esto no es de quien entro, la pantalla se
     reemplaza por el cartel y no se pinta nada mas. */
  if (LP.guardaDeSeccion('comanda.html') === 'no') return;

  var esc = LP.esc, money = LP.money;
  var sb = LP.client();

  /* Quien esta tomando la comanda. Se firma con el nombre real: en la cuenta
     de la mesa despues se lee quien la abrio y quien mando cada ronda. */
  var soy = LP.quienSoy();
  var YO = (soy && soy.nombre) || 'Mozo';

  LP.pantallaSiempreEncendida();

  var conn = new LP.ConnBadge(document.getElementById('conn'));

  /* --------------------------------------------------------- el estado --
     mesaSel y personas arrancan en null a proposito: "nada elegido" tiene
     que ser un estado de verdad, porque tocar dos veces la misma opcion la
     deselecciona y hay que poder volver a no tener nada. */
  var mesaSel = null;        // 'Mesa 7'
  var personas = null;       // null = todavia no dijo cuantos son
  var plano = null;          // lo que devuelve LP.planoDelSalon
  var carrito = Object.create(null);   // id -> qty
  var agotados = {};
  var fotosPropias = {};     // { plato_id: url } de las que cargo el local
  var query = '';
  var catActiva = null;
  var enviando = false;

  var CATS = [];
  /* Cuantos platos tiene cada categoria. Se cuenta una sola vez al arrancar
     -la carta no cambia mientras se toma una comanda- y sirve para el numero
     que la hoja pone al lado de cada nombre: "Postres 21" le dice al mozo si
     lo que busca esta en una lista corta o larga antes de entrar. */
  var CUANTOS = Object.create(null);
  for (var i = 0; i < MENU.length; i++) {
    if (CATS.indexOf(MENU[i].cat) === -1) CATS.push(MENU[i].cat);
    CUANTOS[MENU[i].cat] = (CUANTOS[MENU[i].cat] || 0) + 1;
  }
  catActiva = CATS[0];

  var PLATO = Object.create(null);
  MENU.forEach(function (d) { PLATO[d.id] = d; });

  var notaTexto = '';
  /* Las notas de voz que se grabaron para ESTA comanda. Todavia no
     tienen pedido: el pedido no existe hasta que se manda. Se les pega
     el id despues del insert, en aprobar(). */
  var vozIds = [];

  /* ------------------------------------------------------- el borrador --
     Vive en el celular. Un mozo que carga doce platos y se queda sin
     bateria, o al que el navegador le descarta la pestania mientras atiende
     otra mesa, no puede perder la comanda: al volver esta igual.       */
  var BORRADOR = 'lp_comanda_borrador';
  var BORRADOR_V = 3;        // 3 = el del flujo platos -> personas -> mesa

  function guardarBorrador() {
    try {
      localStorage.setItem(BORRADOR, JSON.stringify({
        v: BORRADOR_V, mesa: mesaSel, personas: personas, items: carrito,
        nota: notaTexto, en: Date.now()
      }));
    } catch (e) {}
  }
  function olvidarBorrador() {
    try { localStorage.removeItem(BORRADOR); } catch (e) {}
  }

  /* Lee el borrador y lo devuelve YA en la forma de hoy, o null.

     El borrador viejo (el de antes de invertir el flujo) SIEMPRE traia
     mesa, porque la mesa se elegia primero y sin ella no se guardaba nada.
     El de ahora puede no tenerla: se anotan los platos y la mesa se pone al
     final. Por eso la condicion de "sirve" dejo de ser "tiene mesa" y paso
     a ser "tiene algo que recuperar", y un borrador viejo entra igual, con
     su mesa puesta.

     Todo lo que entra se revisa dato por dato: platos que ya no estan en la
     carta, cantidades que no son numeros, una mesa que no es texto. Un
     borrador a medio escribir no puede dejar en blanco la pantalla de un
     mozo que tenia media comanda cargada.                              */
  function leerBorrador() {
    var crudo = null;
    try { crudo = localStorage.getItem(BORRADOR); } catch (e) { return null; }
    if (!crudo) return null;

    try {
      var b = JSON.parse(crudo);
      if (!b || typeof b !== 'object') { olvidarBorrador(); return null; }

      // Mas de 8 horas es de otro servicio: no se retoma.
      var en = Number(b.en);
      if (!isFinite(en) || (Date.now() - en) > 8 * 3600 * 1000) { olvidarBorrador(); return null; }

      var items = Object.create(null);
      var cuantos = 0;
      var origen = (b.items && typeof b.items === 'object') ? b.items : {};
      Object.keys(origen).forEach(function (id) {
        if (!PLATO[id]) return;                    // ya no esta en la carta
        var q = Math.round(Number(origen[id]));
        if (!isFinite(q) || q < 1) return;
        items[id] = Math.min(99, q);
        cuantos += items[id];
      });

      var mesa = (typeof b.mesa === 'string' && b.mesa) ? b.mesa : null;

      var pers = null;
      var p = Math.round(Number(b.personas));
      if (isFinite(p) && p >= 1) pers = Math.min(99, p);

      if (!mesa && !cuantos) { olvidarBorrador(); return null; }

      return {
        mesa: mesa, personas: pers, items: items, cuantos: cuantos,
        nota: (typeof b.nota === 'string') ? b.nota.slice(0, 2000) : ''
      };
    } catch (e) {
      // Ilegible: se tira y la pantalla arranca limpia. Nunca rota.
      olvidarBorrador();
      return null;
    }
  }

  /* Una clave por comanda: identifica ESTA comanda aunque se mande dos veces.
     Es la misma defensa que usa la carta del comensal contra el duplicado. */
  var claveEnvio = null;
  function claveDeEnvio() {
    if (claveEnvio) return claveEnvio;
    try { claveEnvio = crypto.randomUUID(); }
    catch (e) { claveEnvio = 'k' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
    return claveEnvio;
  }

  /* ---------------------------------------------------------- los pasos --
     1 = los platos (la pantalla de entrada). 2 = personas y mesa.      */
  var elP1 = document.getElementById('paso1');
  var elP2 = document.getElementById('paso2');
  var volverInicio = document.getElementById('volverInicio');
  var volverPaso1 = document.getElementById('volverPaso1');
  var scrollCarta = 0;

  function irAPaso(n) {
    // Se guarda donde estaba mirando la carta: volver de la mesa y aparecer
    // arriba de todo obliga a buscar de nuevo el plato que iba a agregar.
    if (n === 2 && !elP1.hidden) scrollCarta = window.pageYOffset || 0;

    elP1.hidden = n !== 1;
    elP2.hidden = n !== 2;
    volverInicio.hidden = n !== 1;
    volverPaso1.hidden = n !== 2;
    document.getElementById('sub').textContent = n === 1
      ? 'Anotá lo que piden. La mesa se elige después.'
      : 'Decí cuántos son y en qué mesa. Sin mesa no se manda.';
    LP.navDonde(n === 1 ? 'Tomar comanda' : 'Personas y mesa');

    if (n === 1) { pintarBarraMesa(); pintarCarta(); }
    else { pintarMesas(); pintarGente(); pintarFalta(); }
    pintarPie();
    window.scrollTo(0, n === 1 ? scrollCarta : 0);
  }

  /* El boton de atras del celular vuelve al paso anterior, no se va de la
     pantalla con la comanda a medio cargar. */
  function entrarAMesa() {
    try { history.pushState({ lp: 'mesa' }, ''); } catch (e) {}
    irAPaso(2);
  }
  window.addEventListener('popstate', function () {
    if (LP.isDialogOpen(visor)) { LP.closeDialog(visor); return; }
    if (LP.isDialogOpen(hoja)) { LP.closeDialog(hoja); return; }
    if (!elP2.hidden) irAPaso(1);
  });

  volverPaso1.addEventListener('click', function () {
    // Si hay estado de historia propio, se vuelve por ahi (asi no queda basura).
    if (history.state && history.state.lp === 'mesa') { history.back(); return; }
    irAPaso(1);
  });
  document.getElementById('cambiarMesa').addEventListener('click', function () {
    if (elP2.hidden) entrarAMesa();
  });

  /* ------------------------------------------------------ paso 2: mesas -- */
  var elMesas = document.getElementById('mesas');

  function pintarMesas() {
    if (plano === null) {
      elMesas.innerHTML = '<li class="nada">No pudimos traer las mesas. ' +
        '<button type="button" class="btn btn-secondary" id="reMesas" ' +
        'style="margin-top:12px">Probar de nuevo</button></li>';
      return;
    }
    if (!plano.length) {
      elMesas.innerHTML = '<li class="nada">No hay mesas cargadas en el sistema.</li>';
      return;
    }
    elMesas.innerHTML = plano.map(function (t) {
      var ocupada = t.estado !== 'Libre';
      var sub = t.estado === 'Libre'
        ? (t.mesa.capacidad ? t.mesa.capacidad + ' lugares' : 'Libre')
        : (t.estado === 'Ocupada' && t.cuenta && t.cuenta.rondas
            ? t.cuenta.rondas + (t.cuenta.rondas === 1 ? ' ronda' : ' rondas')
            : t.estado);
      var elegida = mesaSel === t.etiqueta;
      return '<li><button type="button" class="mesa" data-mesa="' + esc(t.etiqueta) + '" ' +
          'aria-pressed="' + (elegida ? 'true' : 'false') + '" ' +
          'aria-label="' + esc(t.etiqueta) + ', ' + esc(sub) +
          (elegida ? '. Elegida: tocá de nuevo para soltarla' : '') + '">' +
          '<span class="num">' + esc(t.mesa.numero) + '</span>' +
          '<span class="est' + (ocupada ? ' ocupada' : '') + '">' + esc(sub) + '</span>' +
        '</button></li>';
    }).join('');
  }

  elMesas.addEventListener('click', function (ev) {
    if (ev.target.closest('#reMesas')) { cargarPlano(); return; }
    var b = ev.target.closest('[data-mesa]');
    if (!b) return;
    elegirMesa(b.dataset.mesa);
  });

  /* Tocar la mesa que YA estaba elegida la suelta. Antes no habia manera de
     deshacer: una vez tocada, quedaba una mesa elegida si o si. */
  function elegirMesa(etiqueta) {
    if (mesaSel === etiqueta) {
      mesaSel = null;
    } else {
      mesaSel = etiqueta;
      // Si la mesa ya tiene gente anotada, ese numero manda: lo cargo alguien
      // que la vio. El mozo lo puede cambiar igual.
      var t = buscarEnPlano(etiqueta);
      if (t && t.cuenta && t.cuenta.sesion && t.cuenta.sesion.comensales) {
        personas = Number(t.cuenta.sesion.comensales) || personas;
        pintarGente();
      }
    }
    pintarMesas();
    pintarFalta();
    pintarPie();
    guardarBorrador();
  }

  function buscarEnPlano(etiqueta) {
    if (!plano) return null;
    for (var i = 0; i < plano.length; i++) {
      if (plano[i].etiqueta === etiqueta) return plano[i];
    }
    return null;
  }

  /* ------------------------------------------------------ paso 2: gente -- */
  var elGente = document.getElementById('gente');
  var elOtra = document.getElementById('genteOtra');
  var elOtraInput = document.getElementById('genteInput');

  function esMuchos() { return personas !== null && personas > 8; }

  function pintarGente() {
    var html = '';
    for (var n = 1; n <= 8; n++) {
      html += '<button type="button" class="npers" data-n="' + n + '" ' +
        'aria-pressed="' + (personas === n ? 'true' : 'false') + '">' + n + '</button>';
    }
    html += '<button type="button" class="npers mas" data-n="mas" ' +
      'aria-pressed="' + (esMuchos() ? 'true' : 'false') + '">9 o m&aacute;s</button>';
    elGente.innerHTML = html;
    elOtra.hidden = !esMuchos();
    if (esMuchos()) elOtraInput.value = personas;
  }

  // Igual que las mesas: tocar de nuevo el numero elegido lo suelta.
  elGente.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-n]');
    if (!b) return;
    if (b.dataset.n === 'mas') {
      if (esMuchos()) {
        personas = null;
        pintarGente();
      } else {
        personas = Math.max(9, Math.min(99, Number(elOtraInput.value) || 9));
        pintarGente();
        elOtraInput.focus();
      }
    } else {
      var n = Number(b.dataset.n);
      personas = (personas === n) ? null : n;
      pintarGente();
    }
    pintarFalta();
    pintarPie();
    guardarBorrador();
  });

  elOtraInput.addEventListener('input', function () {
    var n = Math.round(Number(elOtraInput.value));
    if (isFinite(n) && n >= 1) { personas = Math.min(99, n); guardarBorrador(); }
    pintarFalta();
    pintarPie();
  });

  /* ------------------------------------------------------ paso 2: falta --
     El renglon que contesta "y ahora que me falta". Existe justamente
     porque se puede deseleccionar: hay que poder quedarse sin nada elegido
     y que la pantalla lo diga en voz alta.

     La mesa es lo unico que FRENA. Cuantos son es un dato al lado (va a la
     cuenta de la mesa, no a la comanda): si el mozo no lo sabe, la comanda
     igual tiene que poder salir.                                        */
  var elFalta = document.getElementById('falta');

  function pintarFalta() {
    var gente = personas === null
      ? null
      : personas + (personas === 1 ? ' persona' : ' personas');

    if (!mesaSel) {
      elFalta.className = 'falta';
      elFalta.textContent = gente
        ? 'Falta la mesa. Sin mesa la comanda no se puede mandar a la cocina.'
        : 'Falta la mesa, y decir cuántos son. Sin mesa la comanda no se puede mandar.';
      return;
    }
    elFalta.className = 'falta listo';
    elFalta.textContent = gente
      ? 'Listo para mandar: ' + mesaSel + ', ' + gente + '.'
      : 'Listo para mandar: ' + mesaSel + '. No dijiste cuántos son, pero se puede mandar igual.';
  }

  /* ------------------------------------------------------ paso 1: carta -- */
  var elCats = document.getElementById('cats');
  var elCarta = document.getElementById('carta');
  var elCatTit = document.getElementById('catTit');
  var elBusc = document.getElementById('buscador');
  var elLimpiar = document.getElementById('limpiarBusq');

  function pintarBarraMesa() {
    var chip = document.getElementById('chipMesa');
    if (!mesaSel) {
      chip.className = 'quien-mesa sin';
      chip.textContent = 'Todavía sin mesa';
      return;
    }
    chip.className = 'quien-mesa';
    chip.innerHTML = esc(mesaSel) +
      (personas === null ? '' :
        ' <span class="pers">' + personas + (personas === 1 ? ' persona' : ' personas') + '</span>');
  }

  function pintarCats() {
    elCats.innerHTML = CATS.map(function (c) {
      return '<button type="button" class="cat-b" data-cat="' + esc(c) + '" aria-pressed="' +
        (c === catActiva && !query ? 'true' : 'false') + '">' + esc(c) + '</button>';
    }).join('');
  }

  /* Ir a una categoria. Es el unico camino: lo usan la tira de chips y la
     hoja de las 19, asi que las dos hacen exactamente lo mismo y no hay dos
     versiones del mismo salto que se puedan desincronizar. */
  function irACategoria(cat) {
    if (!cat) return;
    catActiva = cat;
    if (query) { query = ''; elBusc.value = ''; elLimpiar.hidden = true; }
    pintarCats(); pintarCarta();
    /* El chip activo al centro de la tira: asi despues de saltar a "Vinos
       tintos" desde la hoja, la tira queda parada ahi y los vecinos
       -"Vinos blancos", "Cervezas"- quedan a un toque. */
    var act = elCats.querySelector('[aria-pressed="true"]');
    if (act) { try { act.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' }); } catch (e) {} }
  }

  elCats.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-cat]');
    if (!b) return;
    irACategoria(b.dataset.cat);
  });

  /* ------------------------------------------------- la hoja de las 19 ----
     Se abre con el boton de la grilla y con la tecla Escape se cierra sola
     (lo hace LP.openDialog). Al elegir, se cierra y la carta ya esta en la
     categoria nueva: dos toques desde cualquier lugar de los 160 platos. */
  var hojaCats = document.getElementById('hojaCats');
  var elCatsGrilla = document.getElementById('catsGrilla');
  var elCatTodas = document.getElementById('catTodas');
  document.getElementById('catTodasN').textContent = CATS.length;

  function pintarGrillaCats() {
    elCatsGrilla.innerHTML = CATS.map(function (c) {
      /* Cuantos hay y cuantos se pueden pedir. Si la cocina agoto toda la
         categoria, el numero lo dice ANTES de entrar. */
      var total = CUANTOS[c] || 0;
      var hay = 0;
      for (var k = 0; k < MENU.length; k++) {
        if (MENU[k].cat === c && !agotados[MENU[k].id]) hay++;
      }
      var detalle = hay === total
        ? (total + (total === 1 ? ' plato' : ' platos'))
        : (hay === 0 ? 'todo agotado' : hay + ' de ' + total + ' disponibles');
      return '<button type="button" class="cg-b' + (hay === 0 ? ' vacia' : '') +
        '" data-ir="' + esc(c) + '" aria-current="' + (c === catActiva ? 'true' : 'false') + '">' +
        esc(c) + '<span>' + esc(detalle) + '</span></button>';
    }).join('');
  }

  elCatTodas.addEventListener('click', function () {
    pintarGrillaCats();
    LP.openDialog(hojaCats, { focus: '[aria-current="true"]' });
  });
  document.getElementById('hcatX').addEventListener('click', function () {
    LP.closeDialog(hojaCats);
  });
  elCatsGrilla.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-ir]');
    if (!b) return;
    LP.closeDialog(hojaCats);
    irACategoria(b.dataset.ir);
    /* Se sube al principio de la lista: se acaba de cambiar de categoria, y
       quedar a mitad de camino de la anterior es no haber llegado. */
    try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) { window.scrollTo(0, 0); }
  });

  var tBusq = null;
  elBusc.addEventListener('input', function () {
    clearTimeout(tBusq);
    tBusq = setTimeout(function () {
      query = LP.sinTildes(elBusc.value.trim());
      elLimpiar.hidden = !query;
      pintarCats(); pintarCarta();
    }, 150);
  });
  elLimpiar.addEventListener('click', function () {
    elBusc.value = ''; query = ''; elLimpiar.hidden = true;
    pintarCats(); pintarCarta(); elBusc.focus();
  });

  function visibles() {
    if (!query) {
      return MENU.filter(function (d) { return d.cat === catActiva; });
    }
    return MENU.filter(function (d) {
      return LP.sinTildes(d.name + ' ' + (d.note || '') + ' ' + d.cat).indexOf(query) !== -1;
    });
  }

  // El icono de la foto. Va en SVG y no como emoji: el emoji de camara se
  // dibuja distinto en cada telefono y en algunos no se ve.
  var ICONO_FOTO =
    '<svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true" fill="none" ' +
      'stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">' +
      '<rect x="3" y="5.5" width="18" height="13" rx="2.6"/>' +
      '<circle cx="12" cy="12" r="3.1"/></svg>';

  function filaHTML(d) {
    var q = carrito[d.id] || 0;
    var noHay = !!agotados[d.id];
    var url = LP.fotoDePlato(fotosPropias, d);
    var ini = esc((d.name || '?').trim().charAt(0).toUpperCase());

    return '<li class="plato' + (q ? ' tiene' : '') + (noHay ? ' agotado' : '') +
        '" data-fila="' + esc(d.id) + '">' +
      (url ? '<span class="pl-hint" aria-hidden="true">' + ICONO_FOTO + 'Foto</span>' : '') +
      '<div class="pl-desliz">' +
        '<button type="button" class="pl-main" data-act="inc" data-id="' + esc(d.id) + '"' +
          (noHay ? ' disabled' : '') + ' aria-label="Agregar ' + esc(d.name) + '">' +
          '<span class="pl-tex"><b>' + esc(d.name) + '</b>' +
            (d.note ? '<i>' + esc(d.note) + '</i>' : '') +
            (query ? '<i>' + esc(d.cat) + '</i>' : '') +
          '</span>' +
          /* La miniatura, justo a la izquierda del precio. */
          '<span class="pl-foto">' +
            '<span class="ini" aria-hidden="true">' + ini + '</span>' +
            (url ? '<img src="' + esc(url) + '" alt="" loading="lazy" decoding="async">' : '') +
          '</span>' +
          '<span class="pl-pre">' + money(d.price) + '</span>' +
        '</button>' +
        (noHay
          ? '<span class="pl-no">Agotado</span>'
          : '<span class="pl-act">' +
              (url ? '<button type="button" class="icon-btn ver-foto" data-foto="' + esc(d.id) + '" ' +
                       'aria-label="Ver la foto de ' + esc(d.name) + '">' + ICONO_FOTO + '</button>' : '') +
              (q ? '<button type="button" class="icon-btn" data-act="dec" data-id="' + esc(d.id) + '" ' +
                     'aria-label="Sacar uno de ' + esc(d.name) + '">&#8722;</button>' +
                   '<span class="pl-q">' + q + '</span>' : '') +
              '<button type="button" class="icon-btn" data-act="inc" data-id="' + esc(d.id) + '" ' +
                'aria-label="Agregar otro ' + esc(d.name) + '">&#43;</button>' +
            '</span>') +
      '</div>' +
    '</li>';
  }

  function pintarCarta() {
    var items = visibles();
    /* El renglon de "donde estoy". Buscando dice cuantos encontro; parado en
       una categoria dice el nombre y cuantos platos tiene. */
    elCatTit.innerHTML = query
      ? esc(items.length + (items.length === 1 ? ' resultado' : ' resultados'))
      : esc(catActiva) + ' <em>' +
        esc(items.length + (items.length === 1 ? ' plato' : ' platos')) + '</em>';
    elCarta.innerHTML = items.length
      ? items.map(filaHTML).join('')
      : '<li class="nada">No encontramos ese plato. Probá con otra palabra.</li>';
  }

  /* Repinta SOLO la fila tocada: repintar la carta entera le hace perder el
     scroll al mozo justo cuando esta cargando el cuarto plato de la mesa. */
  function repintarFila(id) {
    var d = PLATO[id];
    if (!d) return;
    var fila = null;
    var todas = elCarta.querySelectorAll('[data-fila]');
    for (var k = 0; k < todas.length; k++) {
      if (todas[k].dataset.fila === id) { fila = todas[k]; break; }
    }
    if (!fila) return;
    // Se arma aparte y se reemplaza el nodo: mas simple que parchear a mano.
    var cont = document.createElement('ul');
    cont.innerHTML = filaHTML(d);
    fila.parentNode.replaceChild(cont.firstChild, fila);
  }

  /* Si la foto no carga (el otro deploy caido, sin internet) queda la
     inicial que ya esta debajo. "error" no burbujea: fase de captura. */
  elCarta.addEventListener('error', function (ev) {
    var img = ev.target;
    if (img && img.tagName === 'IMG' && img.parentNode) img.parentNode.removeChild(img);
  }, true);

  elCarta.addEventListener('click', function (ev) {
    /* El click que el navegador dispara al terminar un deslizamiento se
       descarta ACA. Es la regla mas importante de las fotos: mostrar el
       plato NO puede agregarlo al pedido. */
    if (frenarClick) { ev.preventDefault(); ev.stopPropagation(); return; }

    var f = ev.target.closest('[data-foto]');
    if (f) { abrirFoto(f.dataset.foto); return; }

    var b = ev.target.closest('[data-act]');
    if (!b || b.disabled) return;
    cambiarCantidad(b.dataset.id, b.dataset.act === 'inc' ? 1 : -1);
  });

  function cambiarCantidad(id, delta) {
    if (agotados[id] && delta > 0) return;
    if (!PLATO[id]) return;
    var q = Math.max(0, Math.min(99, (carrito[id] || 0) + delta));
    if (q === 0) delete carrito[id]; else carrito[id] = q;
    repintarFila(id);
    pintarPie();
    guardarBorrador();
    if (LP.isDialogOpen(hoja)) pintarHoja();
  }

  /* ------------------------------------------------- deslizar para la foto --
     El gesto de WhatsApp: se corre la fila hacia la izquierda y aparece la
     foto grande. Tres cuidados:

     1. Solo si el gesto es claramente HORIZONTAL. Si no, es scroll de la
        lista y hay que soltarlo enseguida o la carta no se puede recorrer.
     2. touch-action:pan-y en la fila deja el scroll vertical en manos del
        navegador y nos deja a nosotros el horizontal.
     3. Al soltar se frena el click de rebote. Sin esto, deslizar para
        mostrarle el plato al comensal le agregaba el plato al pedido.   */
  var UMBRAL = 56;           // cuanto hay que correr para que abra la foto
  var TOPE = 96;             // hasta donde se deja correr la fila
  var desl = null;
  var frenarClick = false;

  function soltarFila(d) {
    if (!d) return;
    d.fila.classList.remove('arrastrando');
    d.caja.style.transform = '';
    var h = d.fila.querySelector('.pl-hint');
    if (h) h.style.opacity = '';
  }

  elCarta.addEventListener('touchstart', function (ev) {
    desl = null;
    if (ev.touches.length !== 1) return;
    var fila = ev.target.closest('[data-fila]');
    if (!fila || !fila.querySelector('.pl-hint')) return;   // sin foto no hay gesto
    var caja = fila.querySelector('.pl-desliz');
    if (!caja) return;
    desl = {
      fila: fila, caja: caja, dx: 0, activo: false,
      x: ev.touches[0].clientX, y: ev.touches[0].clientY
    };
  }, { passive: true });

  elCarta.addEventListener('touchmove', function (ev) {
    if (!desl || ev.touches.length !== 1) return;
    var dx = ev.touches[0].clientX - desl.x;
    var dy = ev.touches[0].clientY - desl.y;

    if (!desl.activo) {
      if (Math.abs(dy) > Math.abs(dx) || Math.abs(dx) < 12) {
        // Es scroll: se suelta la fila y no se vuelve a tomar hasta el
        // proximo toque.
        if (Math.abs(dy) > 10) { soltarFila(desl); desl = null; }
        return;
      }
      desl.activo = true;
      desl.fila.classList.add('arrastrando');
    }

    if (ev.cancelable) ev.preventDefault();
    desl.dx = Math.max(-TOPE, Math.min(0, dx));
    desl.caja.style.transform = 'translateX(' + desl.dx + 'px)';
    var h = desl.fila.querySelector('.pl-hint');
    if (h) h.style.opacity = String(Math.min(1, Math.abs(desl.dx) / UMBRAL));
  }, { passive: false });

  function finDelGesto(abrir) {
    if (!desl) return;
    var d = desl;
    desl = null;
    soltarFila(d);
    if (!d.activo) return;
    frenarClick = true;
    setTimeout(function () { frenarClick = false; }, 420);
    if (abrir && Math.abs(d.dx) >= UMBRAL) abrirFoto(d.fila.dataset.fila);
  }

  elCarta.addEventListener('touchend', function () { finDelGesto(true); });
  elCarta.addEventListener('touchcancel', function () { finDelGesto(false); });

  /* ------------------------------------------------------- la foto grande --
     Se abre para mostrarle el plato al comensal. NO toca el carrito ni por
     accidente: esta funcion y la hoja que abre no escriben una sola vez en
     `carrito`, y al cerrarla no se repinta nada de la comanda porque no
     cambio nada.                                                         */
  var visor = document.getElementById('visorFoto');

  function abrirFoto(id) {
    var d = PLATO[id];
    if (!d) return;
    var url = LP.fotoDePlato(fotosPropias, d);
    if (!url) { LP.toast('Este plato todavía no tiene foto.', 'err'); return; }

    document.getElementById('vfTit').textContent = d.name;
    var pie = document.getElementById('vfPie');
    pie.innerHTML = (d.note ? esc(d.note) + ' · ' : '') + '<b>' + money(d.price) + '</b>';
    var img = document.getElementById('vfImg');
    img.src = url;
    img.alt = 'Foto de ' + d.name;
    LP.openDialog(visor);
  }
  function cerrarVisor() { LP.closeDialog(visor); }
  document.getElementById('vfX').addEventListener('click', cerrarVisor);
  document.getElementById('vfCerrar').addEventListener('click', cerrarVisor);
  visor.addEventListener('click', function (ev) { if (ev.target === visor) cerrarVisor(); });

  /* ------------------------------------------------------------- el pie -- */
  var pie = document.getElementById('pie');
  var pieAccion = document.getElementById('pieAccion');

  function lineasDelCarrito() {
    var out = [];
    Object.keys(carrito).forEach(function (id) {
      var d = PLATO[id];
      if (d) out.push({ id: id, name: d.name, qty: carrito[id], price: d.price });
    });
    return out;
  }
  function cuantos() {
    var n = 0;
    Object.keys(carrito).forEach(function (id) { n += carrito[id]; });
    return n;
  }
  function totalComanda() {
    var t = 0;
    lineasDelCarrito().forEach(function (l) { t += l.price * l.qty; });
    return t;
  }

  function pintarPie() {
    var n = cuantos();
    var enMesa = !elP2.hidden;
    // En el paso de la mesa el pie se ve siempre: ahi vive "Mandar".
    var mostrar = n > 0 || enMesa;
    pie.hidden = !mostrar;
    document.body.classList.toggle('con-barra', mostrar);
    if (!mostrar) return;

    document.getElementById('pieTotal').textContent = money(totalComanda());
    document.getElementById('pieCuenta').textContent =
      (n === 1 ? '1 plato' : n + ' platos') +
      (mesaSel ? ' · ' + mesaSel : '') + ' · ver la comanda';

    if (enviando) return;                 // no le pises el "Mandando..."

    if (!enMesa) {
      pieAccion.textContent = 'Continuar';
      pieAccion.disabled = false;
    } else if (!n) {
      pieAccion.textContent = 'La comanda está vacía';
      pieAccion.disabled = true;
    } else if (!mesaSel) {
      pieAccion.textContent = 'Elegí la mesa';
      pieAccion.disabled = true;
    } else {
      pieAccion.textContent = 'Mandar a la cocina';
      pieAccion.disabled = false;
    }
  }

  pieAccion.addEventListener('click', function () {
    if (elP2.hidden) { entrarAMesa(); return; }
    mandar(pieAccion);
  });
  document.getElementById('verComanda').addEventListener('click', abrirHoja);

  /* -------------------------------------------------------- la comanda --- */
  var hoja = document.getElementById('hojaComanda');
  var hcCuerpo = document.getElementById('hcCuerpo');
  var hcTit = document.getElementById('hcTit');

  function abrirHoja() {
    pintarHoja();
    LP.openDialog(hoja);
  }
  function cerrarHoja() { LP.closeDialog(hoja); }
  document.getElementById('hcX').addEventListener('click', cerrarHoja);
  hoja.addEventListener('click', function (ev) { if (ev.target === hoja) cerrarHoja(); });

  function pintarHoja() {
    var lineas = lineasDelCarrito();
    hcTit.textContent = mesaSel ? 'La comanda de ' + mesaSel : 'La comanda';
    if (!lineas.length) {
      hcCuerpo.innerHTML = '<p class="estado-vacio">Todavía no cargaste nada.</p>';
      return;
    }

    var donde = mesaSel
      ? esc(mesaSel) + (personas === null ? ' · sin decir cuántos son'
          : ' · ' + personas + (personas === 1 ? ' persona' : ' personas'))
      : 'Sin mesa todavía';

    hcCuerpo.innerHTML =
      '<p class="hs-sub" style="color:var(--muted);margin:0 0 6px;font-size:14px">' +
        donde + '</p>' +
      lineas.map(function (l) {
        return '<div class="lin">' +
          '<div class="lin-act">' +
            '<button type="button" class="icon-btn" data-hact="dec" data-id="' + esc(l.id) + '" ' +
              'aria-label="Sacar uno de ' + esc(l.name) + '">&#8722;</button>' +
            '<span class="lin-q">' + l.qty + '</span>' +
            '<button type="button" class="icon-btn" data-hact="inc" data-id="' + esc(l.id) + '" ' +
              'aria-label="Agregar otro ' + esc(l.name) + '">&#43;</button>' +
          '</div>' +
          '<div class="lin-tex"><b>' + esc(l.name) + '</b>' +
            '<span>' + money(l.price) + ' c/u</span></div>' +
          '<div class="lin-pre">' + money(l.price * l.qty) + '</div>' +
        '</div>';
      }).join('') +
      '<div class="total-fila"><span>Total</span><span>' + money(totalComanda()) + '</span></div>' +
      '<div class="campo">' +
        '<div class="nota-cabeza">' +
          '<label for="hcNota">Algo que dijo la mesa y no está en la carta</label>' +
          (LP.func('f_voz') && LP_VOZ.soportado().grabar
            ? '<button type="button" class="btn-voz" id="hcVoz">' +
              '<span aria-hidden="true">&#127908;</span> Grabar</button>'
            : '') +
        '</div>' +
        '<textarea id="hcNota" placeholder="Sin sal, la carne bien cocida, alergia al maní...">' +
        esc(notaTexto) + '</textarea>' +
        (LP.func('f_notas_frecuentes') ? '<div id="hcFrec"></div>' : '') +
      '</div>' +
      '<div class="acciones">' +
        /* Sin mesa NO hay boton de mandar. La unica salida hacia adelante es
           ir a elegirla: asi no existe el camino que deja una comanda
           huerfana en la cocina. */
        (mesaSel
          ? '<button type="button" class="btn btn-primary" id="hcEnviar">Mandar a la cocina</button>'
          : '<button type="button" class="btn btn-primary" id="hcMesa">Elegir personas y mesa</button>') +
        '<button type="button" class="btn btn-secondary" id="hcSeguir">Seguir cargando</button>' +
      '</div>' +
      '<button type="button" class="btn btn-ghost btn-block" id="hcVaciar" ' +
        'style="margin-top:10px">Vaciar la comanda</button>';

    /* Las frases de siempre se montan recien ahora: el contenedor lo
       acaba de crear el innerHTML de arriba. Envuelto porque un
       problema con las frases no puede dejar sin hoja al mozo. */
    var cajaFrec = document.getElementById('hcFrec');
    var campoNota = document.getElementById('hcNota');
    if (cajaFrec && campoNota && window.LP_NOTAS) {
      try { LP_NOTAS.montar(cajaFrec, campoNota, { sb: sb, quien: YO }); } catch (e) {}
    }
  }

  hcCuerpo.addEventListener('input', function (ev) {
    if (ev.target && ev.target.id === 'hcNota') { notaTexto = ev.target.value; guardarBorrador(); }
  });

  hcCuerpo.addEventListener('click', function (ev) {
    var q = ev.target.closest('[data-hact]');
    if (q) { cambiarCantidad(q.dataset.id, q.dataset.hact === 'inc' ? 1 : -1); return; }
    /* La nota de voz. Lo que vuelve NO se manda a ningun lado: cae en el
       mismo campo de texto, el mozo lo ve y lo puede corregir antes de
       tocar Mandar a la cocina. */
    if (ev.target.closest('#hcVoz')) {
      LP_VOZ.abrir({
        sb: sb, autor: YO, mesa: mesaSel || 'Sin mesa todavía',
        titulo: 'Contame lo que dijo la mesa',
        destino: 'comanda',
        onUsar: function (texto, ids) {
          notaTexto = (notaTexto.trim()
            ? notaTexto.trim().replace(/[,\s]+$/, '') + '. ' : '') + texto;
          notaTexto = notaTexto.slice(0, 500);
          vozIds = vozIds.concat(ids || []);
          guardarBorrador();
          pintarHoja();
          LP.toast('Nota cargada. Leela antes de mandar.', 'ok');
        }
      });
      return;
    }
    if (ev.target.closest('#hcSeguir')) { cerrarHoja(); return; }
    if (ev.target.closest('#hcVaciar')) { vaciar(); return; }
    if (ev.target.closest('#hcMesa')) {
      cerrarHoja();
      if (elP2.hidden) entrarAMesa();
      return;
    }
    if (ev.target.closest('#hcEnviar')) { mandar(ev.target.closest('#hcEnviar')); return; }
    if (ev.target.closest('#hcOtra')) { otraComanda(); return; }
    /* "Seguir cargando en Mesa X": vuelve a los platos con la mesa puesta.
       Quedarse en el paso de la mesa con la comanda ya enviada no sirve
       para nada. */
    if (ev.target.closest('#hcCerrar')) {
      cerrarHoja();
      if (!elP2.hidden) volverPaso1.click();
      return;
    }
  });

  function vaciar() {
    if (!cuantos()) { cerrarHoja(); return; }
    if (!window.confirm('¿Sacamos todo lo que cargaste de esta comanda?')) return;
    carrito = Object.create(null);
    notaTexto = '';
    vozIds = [];
    guardarBorrador();
    pintarCarta(); pintarPie(); pintarHoja();
    LP.toast('Comanda vaciada.', 'ok');
  }

  /* ---------------------------------------------------------- mandarla --- */
  /* El guardado es EXACTAMENTE el de la carta del comensal: mismo insert en
     la misma tabla, con las mismas columnas y la misma linea de cubiertos.
     Lo unico distinto es que despues se aprueba sola: el mozo ES el que la
     esta tomando, no tiene sentido que se la tenga que aprobar a si mismo.

     Si el insert entra y la aprobacion falla, la comanda NO se pierde: queda
     'Por aprobar' en la pantalla de los pedidos, que es donde el mozo la ve
     y la manda con un toque.                                             */
  function liberar(btn, texto) {
    enviando = false;
    if (btn) { btn.disabled = false; btn.textContent = texto; }
    pintarPie();
  }

  function mandar(btn) {
    if (enviando) return;
    var lineas = lineasDelCarrito();
    if (!lineas.length) { LP.toast('La comanda está vacía.', 'err'); return; }

    /* LA MESA ES OBLIGATORIA y se controla ACA, que es el unico lugar por
       el que pasan todos los envios. Una comanda sin mesa llega a la cocina
       y nadie sabe a que mesa sale el plato: es el error mas caro de todos.
       Los botones ya no dejan llegar hasta aca sin mesa; esto es la red. */
    if (!mesaSel) {
      LP.toast('Falta elegir la mesa.', 'err');
      cerrarHoja();
      if (elP2.hidden) entrarAMesa(); else irAPaso(2);
      return;
    }
    if (!sb) { LP.toast('No hay conexión con el sistema.', 'err'); return; }

    enviando = true;
    var textoBtn = btn ? btn.textContent : '';
    if (btn) { btn.disabled = true; btn.textContent = 'Mandando...'; }

    /* Ultima defensa contra lo que se termino: entre que el mozo empezo a
       cargar y toco mandar pudo pasar media hora. */
    LP.agotadosEnElCarrito(sb, lineas.map(function (l) { return { id: l.id }; }))
      .then(function (faltan) {
        if (faltan.length) {
          liberar(btn, textoBtn);
          LP.toast((faltan.length === 1 ? 'Se terminó: ' : 'Se terminaron: ') +
                   faltan.join(', ') + '. Sacalo de la comanda.', 'err');
          LP.platosAgotados(sb).then(function (m) {
            agotados = m || {}; pintarCarta(); if (LP.isDialogOpen(hoja)) pintarHoja();
          });
          return;
        }
        seguir(lineas, btn, textoBtn);
      });
  }

  function seguir(lineas, btn, textoBtn) {
    var payload = {
      mesa: mesaSel,
      modo: 'Salón',
      cliente: null,
      lines: lineas.map(function (l) {
        return { id: l.id, name: l.name, qty: l.qty, price: l.price };
      }),
      total: lineas.reduce(function (t, l) { return t + l.price * l.qty; }, 0),
      estado: 'Por aprobar',
      pagado: false,
      metodo_pago: null,
      clave_envio: claveDeEnvio()
    };

    var sinCubierto = false;

    LP.sesionDeMesa(sb, payload.mesa).then(function (ses) {
      if (!ses) {
        console.warn('[La Positiva] la comanda entra sin cuenta de mesa');
        return insertar();
      }
      payload.sesion_id = ses.id;
      // Cuanta gente hay. Que falle no frena la comanda: es un dato al lado.
      // Si el mozo no lo dijo, no se pisa lo que ya hubiera anotado.
      if (personas !== null) LP.guardarComensales(sb, ses.id, personas);
      return LP.cubiertoParaSesion(sb, ses.id).then(function (linea) {
        if (linea) {
          payload.lines.push(linea);
          payload.total = Number(payload.total) + linea.price * linea.qty;
        }
        return insertar();
      });
    });

    function insertar() {
      return sb.from(LP.TABLE).insert(payload).select().single().then(function (res) {
        /* Otro celular de la misma mesa metio el cubierto primero: se saca la
           linea, se rehace el total y se reintenta una sola vez. */
        if (res.error && res.error.code === '23505' &&
            /un_cubierto_por_sesion/.test(res.error.message || '') && !sinCubierto) {
          sinCubierto = true;
          payload.lines = payload.lines.filter(function (l) { return !l.cubierto; });
          payload.total = payload.lines.reduce(function (t, l) {
            return t + LP.importeDeLinea(l);
          }, 0);
          return insertar();
        }
        if (res.error || !res.data) {
          liberar(btn, textoBtn);
          LP.humanError(res.error);
          LP.toast('No pudimos mandar la comanda. Probá de nuevo.', 'err');
          return;
        }
        aprobar(res.data);
      }, function (e) {
        liberar(btn, textoBtn);
        LP.humanError(e);
        LP.toast('No pudimos mandar la comanda. Probá de nuevo.', 'err');
      });
    }
  }

  function aprobar(pedido) {
    /* Las notas de voz recien ahora saben a que pedido pertenecen. Va
       suelto y sin esperar: si falla, la nota de voz queda igual en la
       base y el texto ya viajo adentro de la comanda, que es lo que
       hace falta para cocinar. */
    if (vozIds.length) { LP.ligarVozAPedido(sb, vozIds, pedido.id); vozIds = []; }
    LP.aprobarPedido(sb, pedido.id, YO, notaTexto).then(function (r) {
      enviando = false;
      claveEnvio = null;
      carrito = Object.create(null);
      notaTexto = '';
      olvidarBorrador();
      pintarCarta(); pintarPie();
      /* Primero se escribe el resultado y DESPUES se abre: al reves, la hoja
         se abriria con el contenido viejo y el foco quedaria en un boton
         que desaparece medio segundo despues. La hoja puede estar cerrada
         porque ahora tambien se manda desde el pie. */
      pantallaHecho(pedido, r.ok);
      if (!LP.isDialogOpen(hoja)) LP.openDialog(hoja);
    });
  }

  function pantallaHecho(pedido, aprobada) {
    hcTit.textContent = 'Comanda enviada';
    hcCuerpo.innerHTML =
      '<div class="hecho">' +
        '<div class="tilde" aria-hidden="true">&#10003;</div>' +
        '<h3>' + esc(pedido.mesa) + ' · ' + money(pedido.total) + '</h3>' +
        '<p>' + (aprobada
          ? 'Ya está en la cocina. Pedido #' + esc(pedido.id) + '.'
          : 'Quedó cargada (pedido #' + esc(pedido.id) + ') pero no pudimos mandarla a la ' +
            'cocina. Entrá a <b>Los pedidos</b> y tocá "Enviar a cocina".') + '</p>' +
      '</div>' +
      '<div class="acciones">' +
        '<button type="button" class="btn btn-primary" id="hcOtra">Tomar otra comanda</button>' +
        '<a class="btn btn-secondary" href="mozo.html">Ver los pedidos</a>' +
      '</div>' +
      '<button type="button" class="btn btn-ghost btn-block" id="hcCerrar" ' +
        'style="margin-top:10px">Seguir cargando en ' + esc(pedido.mesa) + '</button>';
    if (!aprobada) LP.toast('La comanda quedó para aprobar.', 'err');
    else LP.toast('Comanda enviada a la cocina.', 'ok');
  }

  function otraComanda() {
    cerrarHoja();
    mesaSel = null;
    personas = null;
    carrito = Object.create(null);
    notaTexto = '';
    vozIds = [];
    olvidarBorrador();
    pintarMesas(); pintarGente(); pintarFalta(); pintarBarraMesa(); pintarCarta();
    if (history.state && history.state.lp === 'mesa') history.back();
    else irAPaso(1);
    cargarPlano();
  }

  /* ------------------------------------------------------------- carga --- */
  function cargarPlano() {
    elMesas.innerHTML = '<li class="nada">Cargando las mesas...</li>';
    return LP.planoDelSalon(sb).then(function (p) {
      plano = p;
      conn.set(p === null ? (navigator.onLine ? 'retry' : 'off') : (navigator.onLine ? 'live' : 'off'));
      pintarMesas();
      pintarFalta();
    });
  }

  function avisoDeAgotados() {
    var ids = Object.keys(agotados || {});
    var caja = document.getElementById('avisoAgotados');
    if (!ids.length) { caja.hidden = true; return; }
    var nombres = ids.map(function (id) {
      return (PLATO[id] && PLATO[id].name) || id;
    });
    caja.hidden = false;
    caja.textContent = 'Hoy no hay: ' + nombres.slice(0, 6).join(', ') +
      (nombres.length > 6 ? ' y ' + (nombres.length - 6) + ' más.' : '.');
  }

  function arrancar() {
    if (!sb) {
      conn.set('off');
      elMesas.innerHTML = '<li class="nada">No hay conexión con el sistema. ' +
        'No se puede tomar la comanda desde acá.</li>';
      return;
    }

    cargarPlano();

    // Los precios de verdad (los que toco el duenio) pisan a los de la carta.
    LP.preciosDePlatos(sb).then(function (m) {
      LP.aplicarPrecios(MENU, m || {});
      pintarCarta(); pintarPie(); if (LP.isDialogOpen(hoja)) pintarHoja();
    });

    LP.platosAgotados(sb).then(function (m) {
      agotados = m || {};
      avisoDeAgotados();
      pintarCarta();
    });

    /* Las fotos que cargo el local. Es la MISMA fuente que usan la carta del
       comensal y la pantalla de la carta: LP.fotoDePlato decide sola si
       corresponde la propia o la que venia en menu-data.js. */
    LP.fotosDePlatos(sb).then(function (m) {
      fotosPropias = m || {};
      pintarCarta();
    });

    /* En vivo: si la cocina apaga un plato mientras el mozo esta cargando,
       la carta de su celular se entera sin recargar.

       Y lo mismo con los PRECIOS. La duenia cambia un precio desde su
       pantalla y esta comanda, que puede llevar media hora abierta en el
       celular del mozo, seguia con el numero viejo: la carta del comensal
       (pedir.html) ya escuchaba esta tabla y esta no.

       Ojo con lo que NO hace: no toca ningun pedido ya mandado. El precio
       viaja adentro de lines[].price cuando se manda la comanda y ahi queda
       congelado. Si la mesa pidio el bife a $35.000 y despues sube, se le
       cobran $35.000. El cambio es para lo que se pida de ahora en mas.  */
    var canal = sb.channel('comanda-' + Date.now())
      .on('postgres_changes', { event: '*', schema: 'public', table: LP.AGOTADOS_TABLE },
          function () {
            LP.platosAgotados(sb).then(function (m) {
              agotados = m || {}; avisoDeAgotados(); pintarCarta();
            });
          })
      .on('postgres_changes', { event: '*', schema: 'public', table: LP.PRECIOS_TABLE },
          function () {
            LP.preciosDePlatos(sb).then(function (m) {
              LP.aplicarPrecios(MENU, m || {});
              /* Se repintan tambien el pie y la hoja del carrito: el boton no
                 puede decir un total y la comanda entrar con otro. */
              pintarCarta(); pintarPie();
              if (LP.isDialogOpen(hoja)) pintarHoja();
            });
          })
      .on('postgres_changes', { event: '*', schema: 'public', table: LP.FOTOS_TABLE },
          function () {
            LP.fotosDePlatos(sb).then(function (m) {
              fotosPropias = m || {}; pintarCarta();
            });
          });
    canal.subscribe();
    LP.onCleanup(function () { try { sb.removeChannel(canal); } catch (e) {} });
  }

  /* --------------------------------------------------------- el arranque -
     La pantalla de entrada es LA CARTA. Antes era elegir la mesa; se dio
     vuelta porque con el salon lleno lo que no puede esperar es anotar lo
     que la mesa acaba de decir.                                         */
  pintarCats();
  pintarGente();
  pintarCarta();
  pintarBarraMesa();
  LP.navDonde('Tomar comanda');

  /* Retomar lo que habia quedado a medias. Todo el bloque va en try: si el
     borrador viniera roto, el mozo se queda sin lo anotado -que ya estaba
     perdido igual- pero NUNCA con una pantalla en blanco. */
  try {
    var guardado = leerBorrador();
    if (guardado) {
      mesaSel = guardado.mesa;
      personas = guardado.personas;
      carrito = guardado.items;
      notaTexto = guardado.nota;
      pintarGente(); pintarCarta(); pintarBarraMesa(); pintarFalta();
      guardarBorrador();          // lo reescribe ya en la forma de hoy
      if (guardado.cuantos) {
        LP.toast('Retomamos la comanda' + (mesaSel ? ' de ' + mesaSel : '') + '.', 'ok');
      }
    }
  } catch (e) {
    olvidarBorrador();
    carrito = Object.create(null);
    mesaSel = null; personas = null; notaTexto = '';
    pintarGente(); pintarCarta(); pintarBarraMesa();
  }

  pintarPie();
  arrancar();
});
</script>
