<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3ece2">
<meta name="description" content="Activacion de los avisos de pago en el celular del encargado de La Positiva.">
<title>La Positiva - Avisos de Jonathan</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="La Positiva">
<link rel="preload" href="fonts/jost-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/cormorant-500-italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
<style>
  .wrap{max-width:520px;padding-top:calc(40px + var(--sa-t));text-align:center}
  .avatar{
    width:78px;height:78px;border-radius:50%;
    background:var(--card);border:1px solid var(--border-strong);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 18px;color:var(--accent);
  }
  h1{font-size:30px;margin:0 0 6px}
  p.lead{color:var(--muted);margin:0 0 26px;font-size:16px;line-height:1.55}

  .status{
    margin-top:18px;padding:14px 16px;border-radius:var(--r-md);
    font-size:15px;line-height:1.5;text-align:left;
  }
  .status.ok{background:var(--ok-soft);color:var(--ok);border:1px solid #bfe0ce}
  .status.warn{background:var(--warn-soft);color:var(--warn);border:1px solid #e8d3a8}
  .status.err{background:var(--err-bg);color:var(--err-ink);border:1px solid #f0cfc9}
  .status strong{display:block;margin-bottom:4px}

  .guide{
    margin-top:20px;text-align:left;background:var(--card);
    border:1px solid var(--border);border-radius:var(--r-md);padding:16px 18px;
  }
  .guide h2{
    font-family:'Jost',sans-serif;font-style:normal;font-size:14px;
    letter-spacing:.1em;text-transform:uppercase;font-weight:600;
    color:var(--muted-strong);margin:0 0 10px;
  }
  .guide ol{margin:0;padding-left:20px}
  .guide li{margin-bottom:8px;font-size:15px;line-height:1.5}
  .guide li:last-child{margin-bottom:0}

  .back-link{
    display:inline-flex;align-items:center;min-height:var(--tap);
    margin-top:22px;color:var(--muted-strong);font-size:15px;text-decoration:underline;
  }
  .back-link:hover{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <div class="avatar" aria-hidden="true">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
      <path d="M13.7 21a2 2 0 0 1-3.4 0"></path>
    </svg>
  </div>

  <h1>Hola, Jonathan</h1>
  <p class="lead">Activa los avisos en este celular. Cuando la caja confirme un pago te va a
     llegar una notificacion aca, aunque tengas la pantalla apagada.</p>

  <button type="button" class="btn btn-primary btn-block" id="activarBtn" disabled>Comprobando...</button>
  <button type="button" class="btn btn-secondary btn-block" id="testBtn" style="margin-top:10px" hidden>
    Probar notificacion
  </button>

  <div id="statusBox" role="status" aria-live="polite"></div>
  <div id="guideBox"></div>

  <a class="back-link" href="./">Volver al inicio</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<script src="config.js" defer></script>
<script src="app.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  'use strict';
  var esc = LP.esc;
  var sb = LP.client();

  var EMPLEADO = 'Jonathan';

  var btn = document.getElementById('activarBtn');
  var testBtn = document.getElementById('testBtn');
  var box = document.getElementById('statusBox');
  var guide = document.getElementById('guideBox');

  function setStatus(kind, title, text) {
    box.innerHTML = '<div class="status ' + kind + '"><strong>' + esc(title) + '</strong>' +
                    esc(text) + '</div>';
  }
  function clearStatus() { box.innerHTML = ''; }

  function setGuide(title, steps) {
    if (!steps || !steps.length) { guide.innerHTML = ''; return; }
    guide.innerHTML = '<div class="guide"><h2>' + esc(title) + '</h2><ol>' +
      steps.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ol></div>';
  }

  function setBtn(label, disabled) {
    btn.textContent = label;
    btn.disabled = !!disabled;
  }

  /* ------------------------------------------------------- estado real --
     La deteccion de plataforma, la suscripcion y el guardado sin duplicar
     viven en app.js: los comparte con el panel de cocina. Asi la clave
     VAPID publica queda en un solo lugar.                               */
  function refresh() {
    LP.estadoPush().then(function (st) {
      if (st === 'no-soportado') {
        setBtn('No disponible en este navegador', true);
        setStatus('err', 'Este navegador no puede recibir avisos',
          'Necesitas Chrome en Android, o Safari en iPhone con la app agregada a la pantalla de inicio.');
        guideForPlatform();
      } else if (st === 'ios-sin-instalar') {
        setBtn('Primero agrega la app al inicio', true);
        setStatus('warn', 'Falta un paso en el iPhone',
          'En iPhone los avisos solo funcionan si abris esta pagina como app instalada.');
        guideForPlatform();
      } else if (st === 'denegado') {
        setBtn('Permiso bloqueado', true);
        setStatus('err', 'Bloqueaste los avisos en este celular',
          'Hay que volver a habilitarlos desde los ajustes del navegador.');
        guideForBlocked();
      } else if (st === 'activo') {
        markActive();
        // El permiso ya esta dado, asi que esto no vuelve a preguntar nada:
        // solo se asegura de que la fila siga existiendo en la base.
        LP.suscribirPush(sb, EMPLEADO);
      } else {
        offerActivate();
      }
    });
  }

  function offerActivate() {
    setBtn('Activar notificaciones', false);
    testBtn.hidden = true;
    clearStatus();
    guideForPlatform();
  }

  function markActive() {
    setBtn('Notificaciones activadas', true);
    btn.classList.remove('btn-primary');
    btn.classList.add('btn-secondary');
    testBtn.hidden = false;
    setStatus('ok', 'Listo, los avisos estan activos',
      'Cuando la caja confirme un pago te va a llegar la notificacion a este celular.');
    guide.innerHTML = '';
  }

  function guideForPlatform() {
    if (LP.esIOS() && !LP.esInstalada()) {
      setGuide('Como activarlo en iPhone', [
        'Toca el boton Compartir en la barra de Safari.',
        'Elegi "Agregar a pantalla de inicio" y confirma.',
        'Cerra Safari y abri La Positiva desde el icono nuevo.',
        'Ahi si toca "Activar notificaciones" y permiti los avisos.'
      ]);
    } else if (!LP.esIOS()) {
      setGuide('Como activarlo en Android', [
        'Toca "Activar notificaciones".',
        'Cuando Chrome pregunte, elegi "Permitir".',
        'Listo: podes probar con el boton "Probar notificacion".'
      ]);
    } else {
      guide.innerHTML = '';
    }
  }

  function guideForBlocked() {
    if (LP.esIOS()) {
      setGuide('Como desbloquear los avisos en iPhone', [
        'Abri Ajustes del iPhone.',
        'Entra en Notificaciones y busca La Positiva.',
        'Activa "Permitir notificaciones".',
        'Volve a abrir la app y toca "Activar notificaciones".'
      ]);
    } else {
      setGuide('Como desbloquear los avisos en Android', [
        'Toca el candado que esta al lado de la direccion web.',
        'Entra en Permisos o Configuracion del sitio.',
        'Cambia Notificaciones a "Permitir".',
        'Recarga esta pagina y volve a intentar.'
      ]);
    }
  }

  /* ---------------------------------------------------------- activar -- */
  btn.addEventListener('click', function () {
    if (btn.disabled) return;
    setBtn('Activando...', true);
    clearStatus();

    LP.suscribirPush(sb, EMPLEADO).then(function (st) {
      if (st === 'activo') {
        markActive();
      } else if (st === 'denegado') {
        setBtn('Permiso bloqueado', true);
        setStatus('err', 'No diste permiso',
          'Sin el permiso de notificaciones no te podemos avisar.');
        guideForBlocked();
      } else if (st === 'sin-decidir') {
        setBtn('Activar notificaciones', false);
        setStatus('warn', 'Quedo sin decidir',
          'Toca de nuevo "Activar notificaciones" y elegi Permitir.');
      } else if (st === 'no-guardado') {
        setBtn('Reintentar', false);
        setStatus('err', 'No pudimos guardar la activacion',
          'El celular quedo listo, pero no se registro en el sistema. Proba de nuevo.');
      } else {
        setBtn('Reintentar', false);
        setStatus('err', 'No se pudo activar',
          'Algo fallo al activar los avisos. Revisa la conexion y proba de nuevo.');
      }
    });
  });

  /* ------------------------------------------------------------ prueba -- */
  testBtn.addEventListener('click', function () {
    if (testBtn.disabled) return;
    testBtn.disabled = true;
    testBtn.textContent = 'Enviando...';

    var restore = function () {
      testBtn.disabled = false;
      testBtn.textContent = 'Probar notificacion';
    };

    if (!sb) { restore(); LP.toast('Sin conexion con el sistema.', 'err'); return; }

    sb.functions.invoke('notify-empleado', {
      body: {
        empleado: EMPLEADO,
        title: 'Prueba de aviso',
        body: 'Si ves esto, los avisos funcionan.',
        pedidoId: null
      }
    }).then(function (res) {
      restore();
      if (res.error || (res.data && res.data.ok === false)) {
        LP.humanError(res.error || res.data);
        LP.toast('No salio la notificacion de prueba. Proba activar de nuevo.', 'err');
      } else {
        LP.toast('Aviso de prueba enviado. Deberia llegarte en unos segundos.', 'ok');
      }
    }, function (e) {
      restore();
      LP.humanError(e);
      LP.toast('No se pudo enviar la prueba.', 'err');
    });
  });

  /* ------------------------------------------------------------ inicio -- */
  refresh();
});
</script>
</body>
</html>
