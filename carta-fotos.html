<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3ece2">
<meta name="description" content="Carga las fotos de los platos de La Positiva desde el celular.">
<title>La Positiva - La carta</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="La Positiva">
<link rel="preload" href="fonts/jost-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/cormorant-500-italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
<!-- El tema (nombre, color, letra y forma) que se edita en diseno.html.
     SIN defer y a proposito: tiene que escribir las variables ANTES del
     primer pintado, o el color viejo se ve un instante y despues salta.
     Si no hay nada guardado no escribe nada y la app queda como siempre. -->
<script src="tema.js"></script>
<style>
  .wrap{max-width:900px;padding-top:calc(26px + var(--sa-t))}
  @media (min-width:1180px){.wrap{max-width:1320px}}

  /* --------------------------------------------------------- filtros ---
     Dos alturas, y en este orden: arriba el buscador y el "que mostrar";
     abajo las categorias en una fila ancha. Antes las categorias eran un
     desplegable angosto a la derecha del buscador, donde las veinte entraban
     apretadas y habia que abrirlo para ver cuales habia.

     Se pega debajo de la barra de navegacion, no arriba de todo: el boton de
     volver esta siempre ahi. */
  .filtros{
    position:sticky;top:var(--nav-h);z-index:20;background:var(--bg);
    padding:12px 0;margin-bottom:14px;
    display:flex;flex-direction:column;gap:10px;
    border-bottom:1px solid var(--border);
  }
  .filtros-arriba{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .filtros input,.filtros select{
    min-height:var(--tap);padding:9px 12px;font-size:16px;
    border:1px solid var(--border-strong);border-radius:var(--r-md);
    background:var(--card);color:var(--ink);font-family:inherit;
  }
  .filtros input{flex:1 1 220px;min-width:0}
  .filtros select{flex:0 1 200px;min-width:0}
  .filtros input:focus,.filtros select:focus{outline:2px solid var(--accent);outline-offset:1px}

  /* La fila ancha de categorias. Se desplaza de costado y cada una respira:
     44px de alto y aire adentro, para tocarlas con el pulgar. */
  .cats{
    display:flex;gap:8px;overflow-x:auto;padding:1px 0 3px;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  .cats::-webkit-scrollbar{display:none}
  .cat-b{
    flex:none;min-height:var(--tap);padding:0 17px;border-radius:var(--r-pill);
    background:var(--card);border:1px solid var(--border-strong);
    color:var(--muted-strong);font-size:15px;white-space:nowrap;
    font-family:inherit;cursor:pointer;
  }
  .cat-b[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
  @media (hover:hover){.cat-b:hover{border-color:var(--accent);color:var(--ink)}}
  .cat-b[aria-pressed="true"]:hover{color:#fff}

  .cuenta{font-size:14px;color:var(--muted);margin:0 0 12px}

  /* --------------------------------------------------------- listado --- */
  .platos{list-style:none;margin:0;padding:0;display:grid;gap:12px}
  @media (min-width:700px){.platos{grid-template-columns:repeat(2,minmax(0,1fr))}}
  /* Tres por fila en la notebook: la carta tiene 156 platos y en dos columnas
     eran 15.000px de scroll con media pantalla vacia al costado. */
  @media (min-width:1180px){.platos{grid-template-columns:repeat(3,minmax(0,1fr))}}

  .plato{
    display:flex;gap:13px;align-items:flex-start;
    background:var(--card);border:1px solid var(--border);
    border-radius:var(--r-md);padding:12px;
  }
  .miniatura{
    position:relative;flex:none;width:86px;height:86px;border-radius:var(--r-md);
    overflow:hidden;background:var(--bg);border:1px solid var(--border);
  }
  /* En el celular la foto cede ancho: al lado van el precio y el boton de
     cambiarlo, y esos dos tienen que entrar en el mismo renglon. */
  @media (max-width:420px){
    .plato{gap:10px;padding:11px}
    .miniatura{width:72px;height:72px}
  }
  .miniatura img{width:100%;height:100%;object-fit:cover;display:block}
  .miniatura .sinfoto{
    display:flex;align-items:center;justify-content:center;height:100%;
    font-size:12px;color:var(--muted);text-align:center;padding:6px;line-height:1.3;
  }
  /* Marca la que cargo el local, para distinguirla de la que venia en la carta. */
  .miniatura .propia{
    position:absolute;left:0;right:0;bottom:0;
    background:rgba(20,16,14,.78);color:#fff;
    font-size:10px;letter-spacing:.06em;text-transform:uppercase;
    text-align:center;padding:3px 2px;font-weight:600;
  }

  .datos{flex:1;min-width:0}
  .datos b{display:block;font-size:16px;color:var(--ink);line-height:1.3}
  .datos .cat{font-size:13px;color:var(--muted);margin-top:2px}

  /* El input file real se oculta pero sigue siendo enfocable con teclado. */
  .subir input[type=file]{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip-path:inset(50%);white-space:nowrap;
  }
  .subir{position:relative;display:inline-flex}
  /* Una sola pildora para todo lo que se toca en la tarjeta: el interruptor
     Disponible / Agotado, Cargar foto y Quitar (.peligro).
     "Cambiar precio" tiene su propio estilo mas abajo: es plata. */
  .pill{
    display:inline-flex;align-items:center;justify-content:center;
    min-height:var(--tap);padding:0 15px;border-radius:var(--r-pill);
    font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;
    border:1px solid var(--border-strong);background:transparent;color:var(--muted-strong);
  }

  /* Disponible / Agotado. El estado se lee sin pensar: lo que HAY va en
     verde y marcado con un tilde; lo que se termino queda transparente,
     sin relleno, como algo apagado. */
  .pill.si{
    background:var(--ok-soft);border-color:var(--ok-border);color:var(--ok);font-weight:600;
  }
  .pill.si::before{content:"✓";margin-right:7px;font-weight:700}
  .pill.no{background:transparent;border-color:var(--border-strong);color:var(--muted-strong)}

  /* El mismo cartelito, pero para el que solo mira: se lee igual y no
     invita a tocarlo. Es hijo directo de .acciones; el de "Cargar foto"
     vive adentro de un <label> y ese si se toca. */
  .acciones > span.pill{cursor:default}

  .pill.peligro{color:var(--err-ink)}
  @media (hover:hover){
    .pill:hover{border-color:var(--accent);color:var(--ink)}
    .pill.si:hover{border-color:var(--ok);color:var(--ok)}
    .pill.peligro:hover{background:var(--err-bg);border-color:var(--err-border)}
  }
  .subir input:disabled + span{opacity:.7;cursor:progress}
  .subir input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}

  .estado{font-size:13px;margin-top:7px;line-height:1.45}
  .estado.err{color:var(--err-ink)}
  .estado.ok{color:var(--ok)}
  .estado:empty{display:none}

  /* El interruptor de si hay o no hay. Es la accion que mas se usa de esta
     pantalla -al empezar el turno se apagan tres o cuatro platos-, asi que
     va primero y se lee sin pensar. */
  /* El precio, grande y a la vista: es lo que mas se cambia de esta
     pantalla despues de apagar platos. Un solo boton lo abre a editar. */
  .precio-linea{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:5px 0 0}
  .precio-num{font-size:19px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
  .precio-carta{font-size:12px;color:var(--muted)}
  .precio-edit .preview{flex-basis:100%}
  .precio-carta s{color:var(--muted)}

  /* Cambiar precio en rojo y Guardar en verde, los dos grandes. Son las dos
     acciones de plata de esta pantalla y tienen que verse de lejos y no
     confundirse entre si. Antes guardar era naranja -el mismo color que
     todos los demas botones de la app- y cancelar un enlace chiquito. */
  .pill.precio{
    min-height:46px;padding:0 15px;font-size:15px;font-weight:600;
    background:var(--err-bg);border-color:var(--err-border);color:var(--err-ink);
  }
  @media (hover:hover){
    .pill.precio:hover{border-color:var(--err);color:var(--err-ink);background:#fbdcd6}
  }

  .precio-edit{
    display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;
    padding:12px;border:1px dashed var(--border-strong);border-radius:var(--r-md);
    background:var(--bg);
  }
  .precio-edit[hidden]{display:none}
  .precio-edit .pesos{font-size:17px;color:var(--muted-strong)}
  .precio-edit input{
    width:auto;flex:1 1 100px;min-width:0;max-width:150px;
    min-height:46px;padding:0 12px;font-size:19px;
    border:1px solid var(--border-strong);border-radius:var(--r-md);
    background:#fff;color:var(--ink);font-family:inherit;
    font-variant-numeric:tabular-nums;
  }
  .precio-edit input:focus{outline:2px solid var(--accent);outline-offset:1px}
  .precio-edit .btn{flex:none;min-height:46px;padding:0 20px;font-size:16px;font-weight:600}
  .volver-carta{
    background:none;border:0;padding:0 4px;min-height:var(--tap);
    color:var(--muted-strong);text-decoration:underline;font-size:13px;
    cursor:pointer;font-family:inherit;
  }


  /* Agotado: apagado pero LEGIBLE. Es justo el plato que hay que encontrar
     para volver a prenderlo, asi que el texto se queda en --muted-strong
     (6.85:1) y no se le baja la opacidad a la tarjeta entera. */
  .plato.agotado{background:var(--bg);border-style:dashed}
  .plato.agotado .miniatura{filter:grayscale(1);opacity:.55}
  .plato.agotado .datos b,.plato.agotado .precio-num{color:var(--muted-strong)}
  .plato.agotado .cat{color:var(--muted)}

  .vacio{padding:30px 10px;text-align:center;color:var(--muted)}

</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>La carta</h1>
      <p class="sub">Marc&aacute; lo que est&aacute; agotado, cambi&aacute; precios y sac&aacute; las fotos. Se ve en la mesa al instante.</p>
    </div>
    <div class="head-right">
      <a class="soy" href="./" data-quien hidden></a>
      <a class="back-link" href="./" id="volver">Volver al inicio</a>
    </div>
  </header>

  <div class="filtros">
    <div class="filtros-arriba">
      <input type="search" id="buscar" placeholder="Buscar un plato" aria-label="Buscar un plato">
      <select id="soloSin" aria-label="Mostrar">
        <option value="">Todos los platos</option>
        <option value="propias">Con foto propia</option>
        <option value="sin">Sin foto propia</option>
        <option value="agotados">Los agotados</option>
      </select>
    </div>
    <!-- Las categorias abajo, en una fila ancha. Antes eran un desplegable
         angosto al lado del buscador. -->
    <div class="cats" id="cats" role="group" aria-label="Categor&iacute;as de la carta"></div>
  </div>
  <p class="cuenta" id="cuenta" role="status" aria-live="polite"></p>

  <ul class="platos" id="lista"></ul>
  <div class="vacio" id="vacio" hidden>No hay platos que coincidan con la búsqueda.</div>

  <a class="back-link" href="./">Volver al inicio</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<script src="config.js" defer></script>
<script src="menu-data.js" defer></script>
<script src="app.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  'use strict';
  var esc = LP.esc, money = LP.money;
  /* Entran todos: la cocina marca lo que se termino todo el tiempo. Lo
     que NO entra en todas las manos son los precios, y eso se decide
     mas abajo con LP.puedeEditar('carta.precios'). */
  if (LP.guardaDeSeccion('carta-fotos.html') === 'no') return;

  var sb = LP.client();

  var lista = document.getElementById('lista');
  var vacio = document.getElementById('vacio');
  var cuenta = document.getElementById('cuenta');
  var inBuscar = document.getElementById('buscar');
  var elCats = document.getElementById('cats');
  var selSin = document.getElementById('soloSin');
  var catActiva = '';                    // '' = todas las categorias

  var propias = {};          // { plato_id: url } de las cargadas por el local
  var agotados = {};         // { plato_id: true } de los que hoy no hay
  var precios = {};          // { plato_id: precio } solo los cambiados
  var soy = LP.quienSoy();
  var YO = (soy && soy.nombre) || 'Carta';

  /* -------------------------------------------------------- categorias -- */
  var cats = [];
  MENU.forEach(function (p) { if (cats.indexOf(p.cat) === -1) cats.push(p.cat); });

  /* Una pastilla por categoria, en la fila ancha de abajo de los filtros.
     El '' del principio es "Todas". */
  function pintarCats() {
    elCats.innerHTML = [''].concat(cats).map(function (c) {
      return '<button type="button" class="cat-b" data-cat="' + esc(c) + '" ' +
        'aria-pressed="' + (c === catActiva ? 'true' : 'false') + '">' +
        (c ? esc(c) : 'Todas') + '</button>';
    }).join('');
  }

  elCats.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-cat]');
    if (!b) return;
    catActiva = b.dataset.cat;
    pintarCats();
    pintar();
    try { b.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' }); } catch (e) {}
  });

  /* ---------------------------------------------------------- filtrado -- */
  function normalizar(t) {
    // Sin acentos: buscar "milanesa" tiene que encontrar "Milanesas de ternera".
    return String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  }

  function filtrados() {
    var q = normalizar(inBuscar.value.trim());
    var cat = catActiva;
    var modo = selSin.value;
    return MENU.filter(function (p) {
      if (cat && p.cat !== cat) return false;
      if (modo === 'propias' && !propias[p.id]) return false;
      if (modo === 'sin' && propias[p.id]) return false;
      if (modo === 'agotados' && !agotados[p.id]) return false;
      if (q && normalizar(p.name + ' ' + (p.note || '')).indexOf(q) === -1) return false;
      return true;
    });
  }

  /* ----------------------------------------------------------- pintado -- */
  function actualizarCuenta(items) {
    items = items || filtrados();
    var conPropia = MENU.filter(function (p) { return propias[p.id]; }).length;
    var sinStock = MENU.filter(function (p) { return agotados[p.id]; }).length;
    cuenta.textContent = items.length + ' de ' + MENU.length + ' platos · ' +
                         conPropia + ' con foto propia' +
                         (sinStock ? ' · ' + sinStock + ' agotados' : '');
  }

  function pintar() {
    var items = filtrados();
    actualizarCuenta(items);
    vacio.hidden = items.length > 0;
    // El vacio dice por que: no es lo mismo no encontrar lo buscado que no
    // tener ninguno que se haya terminado.
    if (!items.length) {
      var q = normalizar(inBuscar.value);
      vacio.textContent = q ? 'No hay platos que coincidan con la b\u00fasqueda.'
        : (selSin.value === 'agotados' ? 'Ning\u00fan plato est\u00e1 agotado hoy.'
        : (selSin.value === 'sin' ? 'Todos los platos tienen foto propia.'
        : (selSin.value === 'propias' ? 'Todav\u00eda no hay platos con foto propia.'
        : 'No hay platos en esta categor\u00eda.')));
    }
    lista.innerHTML = items.map(function (p) { return filaHTML(p); }).join('');
  }

  function platoPorId(id) {
    for (var i = 0; i < MENU.length; i++) if (MENU[i].id === id) return MENU[i];
    return null;
  }

  /* Tocar UN plato rehace SOLO su fila. Antes se rehacian los 156 <li>: se
     cerraba el precio que alguien estaba escribiendo en otro plato, se borraba
     un error que todavia no habia leido y se volvian a pedir todas las fotos. */
  function repintarUno(id) {
    var li = lista.querySelector('[data-plato="' + id + '"]');
    var p = platoPorId(id);
    if (!li || !p) { pintar(); return; }
    li.outerHTML = filaHTML(p);
    actualizarCuenta();
  }

  function filaHTML(p) {
    var propia = propias[p.id];
    var noHay = !!agotados[p.id];
    var url = LP.fotoDePlato(propias, p);
    var mini = url
      ? '<img src="' + esc(url) + '" alt="" loading="lazy" decoding="async">'
      : '<div class="sinfoto">Sin foto</div>';

    return '<li class="plato' + (noHay ? ' agotado' : '') + '" data-plato="' + esc(p.id) + '">' +
        '<div class="miniatura">' + mini +
          (propia ? '<span class="propia">Propia</span>' : '') +
        '</div>' +
        '<div class="datos">' +
          '<b>' + esc(p.name) + '</b>' +
          '<div class="cat">' + esc(p.cat) + (p.note ? ' · ' + esc(p.note) : '') + '</div>' +
          precioHTML(p) +
          '<div class="acciones">' +
            /* Disponible / Agotado. Dice el estado de AHORA y al tocarlo lo
               da vuelta; el aria-label aclara cual de las dos cosas hace.

               El que no lo puede marcar igual tiene que VERLO: la caja
               necesita saber que un plato se termino para no mandar a
               nadie a pedirlo. Por eso no desaparece: deja de ser boton
               y queda como cartelito. */
            (LP.puedeEditar('carta.agotados')
              ? '<button type="button" class="pill ' + (noHay ? 'no' : 'si') + '" ' +
                  'aria-pressed="' + (noHay ? 'true' : 'false') + '" data-stock="' + esc(p.id) + '" ' +
                  'aria-label="' + esc(p.name) + ': ' + (noHay ? 'agotado' : 'disponible') +
                    '. Tocá para marcar que ' + (noHay ? 'hay' : 'se agotó') + '">' +
                  (noHay ? 'Agotado' : 'Disponible') + '</button>'
              : '<span class="pill ' + (noHay ? 'no' : 'si') + '">' +
                  (noHay ? 'Agotado' : 'Disponible') + '</span>') +
            (!LP.puedeEditar('carta.fotos') ? '' :
              '<label class="subir">' +
                '<input type="file" accept="image/*" data-subir="' + esc(p.id) + '">' +
                '<span class="pill">' + (propia ? 'Cambiar foto' : 'Cargar foto') + '</span>' +
              '</label>' +
              (propia ? '<button type="button" class="pill peligro" data-quitar="' + esc(p.id) + '">' +
                        'Quitar la foto</button>' : '')) +
          '</div>' +
          '<p class="estado" role="status" aria-live="polite" data-estado="' + esc(p.id) + '"></p>' +
        '</div>' +
      '</li>';
  }

  /* El precio vigente, y si se cambio, el de la carta impresa tachado al
     lado y la manera de volver. Editar es un solo boton que abre un campo
     numerico ahi mismo: sin pantalla nueva, sin decimales. */
  function precioHTML(p) {
    var cambiado = Object.prototype.hasOwnProperty.call(precios, p.id);
    /* Los precios son plata y no son de todos los puestos. El que no los
       puede tocar los VE -necesita saber cuanto sale un plato para
       contestarle a la mesa- pero sin el boton de cambiarlos.        */
    var puedeTocar = LP.puedeEditar('carta.precios');
    var vigente = cambiado ? precios[p.id] : (p.precioCarta !== undefined ? p.precioCarta : p.price);
    var carta = p.precioCarta !== undefined ? p.precioCarta : p.price;
    return '<div class="precio-linea">' +
        '<span class="precio-num">' + money(vigente) + '</span>' +
        (cambiado
          ? '<span class="precio-carta">antes <s>' + money(carta) + '</s></span>'
          : '') +
        (puedeTocar
          ? '<button type="button" class="pill precio" data-editar-precio="' + esc(p.id) + '">' +
            'Cambiar precio</button>'
          : '') +
      '</div>' +
      (!puedeTocar ? '' :
      '<div class="precio-edit" data-edit="' + esc(p.id) + '" hidden>' +
        '<span class="pesos">$</span>' +
        '<input type="text" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" ' +
          'aria-label="Precio nuevo de ' + esc(p.name) + '" ' +
          'value="' + esc(String(Math.round(vigente))) + '" data-precio-input="' + esc(p.id) + '">' +
        '<button type="button" class="btn btn-ok" data-guardar-precio="' + esc(p.id) + '">' +
          'Guardar</button>' +
        '<button type="button" class="btn btn-secondary" data-cancelar-precio="' + esc(p.id) + '">' +
          'Cancelar</button>' +
        /* Lo que va a quedar, ya formateado, mientras escribe: un cero de mas
           o de menos se ve ANTES de tocar Guardar. */
        '<span class="precio-carta preview" data-preview="' + esc(p.id) + '">' +
          'Queda en ' + money(vigente) + '</span>' +
        (cambiado
          ? '<button type="button" class="volver-carta" data-volver-precio="' + esc(p.id) + '">' +
            'Volver a ' + money(carta) + '</button>'
          : '') +
      '</div>');
  }

  function decir(platoId, texto, clase) {
    var el = lista.querySelector('[data-estado="' + platoId + '"]');
    if (!el) return;
    el.textContent = texto || '';
    el.className = 'estado' + (clase ? ' ' + clase : '');
  }

  /* ------------------------------------------------------------ subir -- */
  lista.addEventListener('change', function (ev) {
    var input = ev.target.closest('[data-subir]');
    if (!input || !input.files || !input.files.length) return;

    var platoId = input.dataset.subir;
    var file = input.files[0];
    input.value = '';                       // permite reintentar el mismo archivo

    // Freno al doble toque: una foto grande tarda unos segundos y si eligen
    // otra mientras tanto salian dos subidas y una quedaba huerfana.
    input.disabled = true;
    var rotulo = input.nextSibling, textoOriginal = rotulo.textContent;
    rotulo.textContent = 'Subiendo...';
    decir(platoId, 'Preparando la foto...', '');

    LP.subirFotoPlato(sb, platoId, file, YO).then(function (r) {
      if (!r.ok) {
        input.disabled = false; rotulo.textContent = textoOriginal;
        decir(platoId, r.motivo, 'err'); return;
      }
      propias[platoId] = r.url;
      repintarUno(platoId);
      decir(platoId, 'Foto guardada.', 'ok');
      LP.toast('Foto actualizada.', 'ok');
    });
  });

  /* ------------------------------------------------------------ precio -- */
  // Enter guarda y Escape cancela: en el celu el teclado numerico muestra
  // "Ir" y antes no hacia nada.
  lista.addEventListener('keydown', function (ev) {
    var inp = ev.target.closest('[data-precio-input]');
    if (!inp) return;
    var id = inp.dataset.precioInput;
    if (ev.key === 'Enter') {
      ev.preventDefault();
      var g = lista.querySelector('[data-guardar-precio="' + id + '"]');
      if (g) g.click();
    } else if (ev.key === 'Escape') {
      var c = lista.querySelector('[data-cancelar-precio="' + id + '"]');
      if (c) c.click();
    }
  });
  lista.addEventListener('input', function (ev) {
    var inp = ev.target.closest('[data-precio-input]');
    if (!inp) return;
    var n = Math.round(Number(String(inp.value).replace(/[^0-9]/g, '')));
    var prev = lista.querySelector('[data-preview="' + inp.dataset.precioInput + '"]');
    if (prev) prev.textContent = isFinite(n) && n > 0 ? 'Queda en ' + money(n) : 'Pon\u00e9 un n\u00famero';
  });

  lista.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-editar-precio], [data-guardar-precio], [data-volver-precio], [data-cancelar-precio]');
    if (!b || b.disabled) return;
    var d = b.dataset;

    if (d.cancelarPrecio) {
      var cajaC = lista.querySelector('[data-edit="' + d.cancelarPrecio + '"]');
      if (cajaC) cajaC.hidden = true;
      return;
    }

    if (d.editarPrecio) {
      var caja = lista.querySelector('[data-edit="' + d.editarPrecio + '"]');
      if (!caja) return;
      caja.hidden = !caja.hidden;
      if (!caja.hidden) {
        var inp = caja.querySelector('input');
        inp.focus(); inp.select();
      }
      return;
    }

    if (d.guardarPrecio) {
      var id = d.guardarPrecio;
      var input = lista.querySelector('[data-precio-input="' + id + '"]');
      // Solo digitos: "34.000" y "34000" valen lo mismo, "34,5" no existe.
      var n = Math.round(Number(String(input.value).replace(/[^0-9]/g, '')));
      if (!isFinite(n) || n <= 0) {
        decir(id, 'Pon\u00e9 un n\u00famero mayor que cero, sin centavos.', 'err');
        input.focus();
        return;
      }
      /* Si escribio el mismo precio de la carta, no hay nada que cambiar: se
         borra el cambio si lo habia, en vez de guardar uno igual. */
      var platoG = platoPorId(id);
      var deLaCarta = platoG && platoG.precioCarta !== undefined ? platoG.precioCarta : null;
      if (deLaCarta !== null && n === deLaCarta) {
        b.disabled = true;
        b.textContent = 'Guardando...';
        LP.quitarPrecio(sb, id).then(function (ok) {
          b.disabled = false;
          b.textContent = 'Guardar';
          if (!ok) { decir(id, 'No pudimos guardar el precio. Prob\u00e1 de nuevo.', 'err'); return; }
          delete precios[id];
          repintarUno(id);
          LP.toast('Sigue en ' + money(n) + ', el de la carta.', 'ok');
        });
        return;
      }
      b.disabled = true;
      b.textContent = 'Guardando...';
      LP.guardarPrecio(sb, id, n, YO).then(function (ok) {
        b.disabled = false;
        b.textContent = 'Guardar';
        if (!ok) { decir(id, 'No pudimos guardar el precio. Prob\u00e1 de nuevo.', 'err'); return; }
        precios[id] = n;
        repintarUno(id);
        LP.toast('Precio guardado: ' + money(n) + '. Ya se ve en la mesa.', 'ok');
      });
      return;
    }

    if (d.volverPrecio) {
      var idV = d.volverPrecio;
      b.disabled = true;
      LP.quitarPrecio(sb, idV).then(function (ok) {
        b.disabled = false;
        if (!ok) { decir(idV, 'No pudimos volver al precio de la carta.', 'err'); return; }
        delete precios[idV];
        repintarUno(idV);
        LP.toast('Vuelve al precio de la carta impresa.', 'ok');
      });
    }
  });

  /* ------------------------------------------------------- hay / no hay -- */
  lista.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-stock]');
    if (!b) return;
    var platoId = b.dataset.stock;
    var plato = platoPorId(platoId);
    if (!plato) return;

    var apagar = !agotados[platoId];
    b.disabled = true;
    b.textContent = 'Marcando...';

    var accion = apagar ? LP.agotarPlato(sb, plato, YO)
                        : LP.reponerPlato(sb, platoId);

    accion.then(function (ok) {
      b.disabled = false;
      if (!ok) {
        // Vuelve a decir lo que sigue siendo cierto: no cambio nada.
        b.textContent = apagar ? 'Disponible' : 'Agotado';
        decir(platoId, 'No pudimos cambiarlo. Probá de nuevo.', 'err');
        return;
      }
      if (apagar) agotados[platoId] = true; else delete agotados[platoId];
      repintarUno(platoId);
      LP.toast(apagar ? plato.name + ': agotado por hoy.'
                      : plato.name + ': vuelve a estar disponible.', 'ok');
    });
  });

  /* ------------------------------------------------------------ quitar -- */
  lista.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-quitar]');
    if (!b) return;
    var platoId = b.dataset.quitar;
    b.disabled = true;
    decir(platoId, 'Quitando...', '');

    LP.borrarFotoPlato(sb, platoId).then(function (ok) {
      if (!ok) { b.disabled = false; decir(platoId, 'No pudimos quitarla.', 'err'); return; }
      delete propias[platoId];
      repintarUno(platoId);
      LP.toast('Volvió la foto original de la carta.', 'ok');
    });
  });

  inBuscar.addEventListener('input', pintar);
  selSin.addEventListener('change', pintar);

  /* ------------------------------------------------------------ inicio -- */
  if (!sb) {
    lista.innerHTML = '';
    vacio.hidden = false;
    vacio.textContent = 'No hay conexión con el sistema.';
    return;
  }

  pintarCats();
  pintar();                                  // dibuja ya, con las fotos de la carta
  LP.fotosDePlatos(sb).then(function (mapa) {
    propias = mapa || {};
    pintar();                                // y repinta cuando llegan las propias
  });
  LP.platosAgotados(sb).then(function (mapa) {
    agotados = mapa || {};
    pintar();
  });
  LP.preciosDePlatos(sb).then(function (mapa) {
    precios = mapa || {};
    LP.aplicarPrecios(MENU, precios);   // deja precioCarta guardado en cada plato
    pintar();
  });

  /* En vivo: esta pantalla la tienen abierta la cocina y la duenia al mismo
     tiempo. Si ella cambia un precio o alguien marca un plato agotado, el
     otro lo tiene que ver sin recargar a mano. Los pedidos ya mandados no se
     tocan: el precio quedo congelado adentro de cada comanda. */
  var canalCarta = sb.channel('carta-fotos-' + Date.now())
    .on('postgres_changes', { event: '*', schema: 'public', table: LP.PRECIOS_TABLE },
        function () {
          LP.preciosDePlatos(sb).then(function (mapa) {
            precios = mapa || {};
            LP.aplicarPrecios(MENU, precios);
            pintar();
          });
        })
    .on('postgres_changes', { event: '*', schema: 'public', table: LP.AGOTADOS_TABLE },
        function () {
          LP.platosAgotados(sb).then(function (mapa) {
            agotados = mapa || {};
            pintar();
          });
        });
  canalCarta.subscribe();
  LP.onCleanup(function () { try { sb.removeChannel(canalCarta); } catch (e) {} });
});
</script>
</body>
</html>
