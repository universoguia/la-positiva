<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3ece2">
<meta name="description" content="Carga las fotos de los platos de La Positiva desde el celular.">
<title>La Positiva - Fotos de la carta</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="La Positiva">
<link rel="preload" href="fonts/jost-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/cormorant-500-italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
<style>
  .wrap{max-width:900px;padding-top:calc(30px + var(--sa-t))}
  .intro h1{font-size:30px;margin:0 0 6px}
  .intro p{color:var(--muted);margin:0 0 20px;font-size:16px;line-height:1.55}

  /* --------------------------------------------------------- filtros --- */
  .filtros{
    position:sticky;top:0;z-index:20;background:var(--bg);
    padding:12px 0;margin-bottom:14px;
    display:flex;gap:8px;flex-wrap:wrap;align-items:center;
    border-bottom:1px solid var(--border);
  }
  .filtros input,.filtros select{
    min-height:var(--tap);padding:9px 12px;font-size:16px;
    border:1px solid var(--border-strong);border-radius:var(--r-md);
    background:var(--card);color:var(--ink);font-family:inherit;
  }
  .filtros input{flex:1 1 190px;min-width:0}
  .filtros select{flex:0 1 200px}
  .filtros input:focus,.filtros select:focus{outline:2px solid var(--accent);outline-offset:1px}
  .cuenta{font-size:14px;color:var(--muted);flex:none;width:100%}

  /* --------------------------------------------------------- listado --- */
  .platos{list-style:none;margin:0;padding:0;display:grid;gap:12px}
  @media (min-width:700px){.platos{grid-template-columns:repeat(2,minmax(0,1fr))}}

  .plato{
    display:flex;gap:13px;align-items:flex-start;
    background:var(--card);border:1px solid var(--border);
    border-radius:var(--r-md);padding:12px;
  }
  .miniatura{
    position:relative;flex:none;width:86px;height:86px;border-radius:var(--r-md);
    overflow:hidden;background:var(--bg);border:1px solid var(--border);
  }
  .miniatura img{width:100%;height:100%;object-fit:cover;display:block}
  .miniatura .sinfoto{
    display:flex;align-items:center;justify-content:center;height:100%;
    font-size:12px;color:var(--muted);text-align:center;padding:6px;line-height:1.3;
  }
  /* Marca la que cargo el local, para distinguirla de la que venia en la carta. */
  .miniatura .propia{
    position:absolute;left:0;right:0;bottom:0;
    background:rgba(20,16,14,.78);color:#fff;
    font-size:10px;letter-spacing:.06em;text-transform:uppercase;
    text-align:center;padding:3px 2px;font-weight:600;
  }

  .datos{flex:1;min-width:0}
  .datos b{display:block;font-size:16px;color:var(--ink);line-height:1.3}
  .datos .cat{font-size:13px;color:var(--muted);margin-top:2px}
  .datos .acciones{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}

  /* El input file real se oculta pero sigue siendo enfocable con teclado. */
  .subir input[type=file]{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip-path:inset(50%);white-space:nowrap;
  }
  .subir{position:relative;display:inline-flex}
  .subir span,.quitar{
    display:inline-flex;align-items:center;justify-content:center;
    min-height:40px;padding:0 15px;border-radius:var(--r-pill);
    font-size:14px;cursor:pointer;border:1px solid transparent;
  }
  .subir span{background:var(--ink);color:#fff}
  .subir:hover span{background:var(--accent)}
  .subir input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
  .quitar{background:transparent;border-color:var(--border-strong);color:var(--err-ink)}
  .quitar:hover{background:var(--err-bg);border-color:#f0cfc9}

  .estado{font-size:13px;margin-top:7px;line-height:1.45}
  .estado.err{color:var(--err-ink)}
  .estado.ok{color:var(--ok)}
  .estado:empty{display:none}

  .vacio{padding:30px 10px;text-align:center;color:var(--muted)}

  .back-link{
    display:inline-flex;align-items:center;min-height:var(--tap);margin-top:24px;
    color:var(--muted-strong);font-size:15px;text-decoration:underline;
  }
  .back-link:hover{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <div class="intro">
    <h1>Fotos de la carta</h1>
    <p>Saca la foto con el celular o eleg&iacute;la de la galer&iacute;a. Se guarda al toque
       y el cliente la ve en la carta, sin publicar nada.</p>
  </div>

  <div class="filtros">
    <input type="search" id="buscar" placeholder="Buscar un plato" aria-label="Buscar un plato">
    <select id="categoria" aria-label="Filtrar por categoria"></select>
    <select id="soloSin" aria-label="Filtrar por estado de la foto">
      <option value="">Todos los platos</option>
      <option value="propias">Solo los que ya tienen foto propia</option>
      <option value="sin">Solo los que faltan</option>
    </select>
    <p class="cuenta" id="cuenta"></p>
  </div>

  <ul class="platos" id="lista"></ul>
  <div class="vacio" id="vacio" hidden>No hay platos que coincidan con la busqueda.</div>

  <a class="back-link" href="./">Volver al inicio</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<script src="config.js" defer></script>
<script src="menu-data.js" defer></script>
<script src="app.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  'use strict';
  var esc = LP.esc;
  var sb = LP.client();

  var lista = document.getElementById('lista');
  var vacio = document.getElementById('vacio');
  var cuenta = document.getElementById('cuenta');
  var inBuscar = document.getElementById('buscar');
  var selCat = document.getElementById('categoria');
  var selSin = document.getElementById('soloSin');

  var propias = {};          // { plato_id: url } de las cargadas por el local

  /* -------------------------------------------------------- categorias -- */
  var cats = [];
  MENU.forEach(function (p) { if (cats.indexOf(p.cat) === -1) cats.push(p.cat); });
  selCat.innerHTML = '<option value="">Todas las categorias</option>' +
    cats.map(function (c) { return '<option value="' + esc(c) + '">' + esc(c) + '</option>'; }).join('');

  /* ---------------------------------------------------------- filtrado -- */
  function normalizar(t) {
    // Sin acentos: buscar "milanesa" tiene que encontrar "Milanesas de ternera".
    return String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  }

  function filtrados() {
    var q = normalizar(inBuscar.value.trim());
    var cat = selCat.value;
    var modo = selSin.value;
    return MENU.filter(function (p) {
      if (cat && p.cat !== cat) return false;
      if (modo === 'propias' && !propias[p.id]) return false;
      if (modo === 'sin' && propias[p.id]) return false;
      if (q && normalizar(p.name + ' ' + (p.note || '')).indexOf(q) === -1) return false;
      return true;
    });
  }

  /* ----------------------------------------------------------- pintado -- */
  function pintar() {
    var items = filtrados();
    var conPropia = MENU.filter(function (p) { return propias[p.id]; }).length;
    cuenta.textContent = items.length + ' de ' + MENU.length + ' platos · ' +
                         conPropia + ' con foto propia';

    vacio.hidden = items.length > 0;
    lista.innerHTML = items.map(function (p) { return filaHTML(p); }).join('');
  }

  function filaHTML(p) {
    var propia = propias[p.id];
    var url = LP.fotoDePlato(propias, p);
    var mini = url
      ? '<img src="' + esc(url) + '" alt="" loading="lazy" decoding="async">'
      : '<div class="sinfoto">Sin foto</div>';

    return '<li class="plato" data-plato="' + esc(p.id) + '">' +
        '<div class="miniatura">' + mini +
          (propia ? '<span class="propia">Propia</span>' : '') +
        '</div>' +
        '<div class="datos">' +
          '<b>' + esc(p.name) + '</b>' +
          '<div class="cat">' + esc(p.cat) + (p.note ? ' · ' + esc(p.note) : '') + '</div>' +
          '<div class="acciones">' +
            '<label class="subir">' +
              '<input type="file" accept="image/*" data-subir="' + esc(p.id) + '">' +
              '<span>' + (propia ? 'Cambiar foto' : 'Cargar foto') + '</span>' +
            '</label>' +
            (propia ? '<button type="button" class="quitar" data-quitar="' + esc(p.id) + '">' +
                      'Quitar</button>' : '') +
          '</div>' +
          '<p class="estado" data-estado="' + esc(p.id) + '"></p>' +
        '</div>' +
      '</li>';
  }

  function decir(platoId, texto, clase) {
    var el = lista.querySelector('[data-estado="' + platoId + '"]');
    if (!el) return;
    el.textContent = texto || '';
    el.className = 'estado' + (clase ? ' ' + clase : '');
  }

  /* ------------------------------------------------------------ subir -- */
  lista.addEventListener('change', function (ev) {
    var input = ev.target.closest('[data-subir]');
    if (!input || !input.files || !input.files.length) return;

    var platoId = input.dataset.subir;
    var file = input.files[0];
    input.value = '';                       // permite reintentar el mismo archivo

    decir(platoId, 'Preparando la foto...', '');

    LP.subirFotoPlato(sb, platoId, file, 'Carta').then(function (r) {
      if (!r.ok) { decir(platoId, r.motivo, 'err'); return; }
      propias[platoId] = r.url;
      pintar();
      decir(platoId, 'Foto guardada.', 'ok');
      LP.toast('Foto actualizada.', 'ok');
    });
  });

  /* ------------------------------------------------------------ quitar -- */
  lista.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-quitar]');
    if (!b) return;
    var platoId = b.dataset.quitar;
    b.disabled = true;
    decir(platoId, 'Quitando...', '');

    LP.borrarFotoPlato(sb, platoId).then(function (ok) {
      if (!ok) { b.disabled = false; decir(platoId, 'No pudimos quitarla.', 'err'); return; }
      delete propias[platoId];
      pintar();
      LP.toast('Volvio la foto original de la carta.', 'ok');
    });
  });

  inBuscar.addEventListener('input', pintar);
  selCat.addEventListener('change', pintar);
  selSin.addEventListener('change', pintar);

  /* ------------------------------------------------------------ inicio -- */
  if (!sb) {
    lista.innerHTML = '';
    vacio.hidden = false;
    vacio.textContent = 'No hay conexion con el sistema.';
    return;
  }

  pintar();                                  // dibuja ya, con las fotos de la carta
  LP.fotosDePlatos(sb).then(function (mapa) {
    propias = mapa || {};
    pintar();                                // y repinta cuando llegan las propias
  });
});
</script>
</body>
</html>
