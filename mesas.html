<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3ece2">
<meta name="description" content="Las mesas con la cuenta abierta en La Positiva, con todas sus rondas.">
<title>La Positiva - Mesas abiertas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="La Positiva">
<link rel="preload" href="fonts/jost-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/cormorant-500-italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
<style>
  .wrap{max-width:1000px;padding-top:calc(26px + var(--sa-t))}
  header.top{
    display:flex;justify-content:space-between;align-items:flex-start;
    gap:12px;flex-wrap:wrap;margin-bottom:8px;
  }
  header.top h1{margin:0;font-size:30px}
  header.top .sub{color:var(--muted);font-size:15px;margin:2px 0 0}
  .head-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

  .resumen{
    display:flex;gap:22px;flex-wrap:wrap;margin:16px 0 20px;
    padding:14px 18px;background:var(--card);
    border:1px solid var(--border);border-radius:var(--r-md);
  }
  .resumen div span{display:block;font-size:13px;color:var(--muted)}
  .resumen div b{font-size:22px;color:var(--ink)}

  /* align-items:start evita que una mesa libre se estire a lo alto solo
     porque al lado hay una con seis rondas. */
  .mesas{list-style:none;margin:0;padding:0;display:grid;gap:14px;align-items:start}
  @media (min-width:760px){.mesas{grid-template-columns:repeat(2,minmax(0,1fr))}}

  .mesa{
    background:var(--card);border:1px solid var(--border);
    border-radius:var(--r-lg);padding:16px 18px 18px;
  }
  .mesa.debe{border-color:#e0bc7a}
  /* La que ya pago y falta levantar: es la unica que se puede volver a vender,
     asi que se ve distinta de las que estan comiendo. */
  .mesa.limpiar{border-color:var(--ok);background:var(--ok-soft)}
  .chip.limpiar{background:var(--ok-bg);color:var(--ok);border:1px solid #bfe0ce}
  .mesa-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .mesa-top h2{margin:0;font-size:23px}
  .mesa-top .desde{font-size:13px;color:var(--muted);margin-top:2px}
  .chip{
    flex:none;font-size:12px;font-weight:600;letter-spacing:.05em;
    text-transform:uppercase;border-radius:var(--r-pill);padding:4px 11px;
  }
  .chip.ok{background:var(--ok-soft);color:var(--ok);border:1px solid #bfe0ce}
  .chip.debe{background:var(--warn-soft);color:var(--warn);border:1px solid #e8d3a8}
  .chip.espera{background:var(--border);color:var(--muted-strong)}
  .chip.reservada{background:var(--warn-soft);color:var(--warn);border:1px solid #e8d3a8}

  /* La mesa libre es la que NO necesita a nadie: se dibuja apagada a
     proposito, para que lo que si pide atencion salte a la vista. */
  .mesa.libre{
    background:transparent;border-style:dashed;border-color:var(--border-strong);
    text-align:center;padding:18px 16px 14px;
  }
  .mesa.libre h2{color:var(--muted-strong)}
  .mesa.libre .cabe{display:block;font-size:13px;color:var(--muted);margin:2px 0 12px}
  .mesa.reservada{border-color:var(--warn);background:var(--warn-soft)}

  /* Reservar se usa una vez cada tanto; sentar, todo el tiempo. Por eso una
     es boton y la otra es texto. Igual respeta los 44px de alto minimo. */
  .apartar{
    display:inline-flex;align-items:center;justify-content:center;
    min-height:var(--tap);width:100%;margin-top:2px;font-size:14px;
    color:var(--muted-strong);text-decoration:underline;cursor:pointer;
    background:none;border:0;font-family:inherit;
  }
  .apartar:hover{color:var(--ink)}
  .abrio{font-size:12px;color:var(--muted);margin-top:3px}

  .rondas{list-style:none;margin:14px 0 0;padding:0}
  .ronda{
    padding:9px 0;border-top:1px dashed var(--border);
    display:flex;justify-content:space-between;gap:12px;align-items:baseline;
  }
  .ronda .que{flex:1;min-width:0;font-size:15px;line-height:1.45}
  .ronda .que b{display:block;font-size:13px;color:var(--muted);font-weight:500}
  .ronda .cuanto{flex:none;font-weight:600}
  .ronda .badge{font-size:11px;padding:2px 8px;margin-left:6px}

  .totales{
    margin-top:14px;padding-top:13px;border-top:1px solid var(--border-strong);
    display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  }
  .totales .etq{font-size:14px;color:var(--muted-strong)}
  .totales .num{font-size:25px;font-weight:600}
  .totales .num.debe{color:var(--warn)}

  .acciones{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .acciones .btn{padding:10px 18px;font-size:15px}

  .estado-vacio{
    text-align:center;color:var(--muted);padding:48px 20px;
    background:var(--card);border:1px dashed var(--border-strong);
    border-radius:var(--r-lg);
  }
  .estado-vacio h3{color:var(--ink);font-size:20px;margin:0 0 6px}
  .estado-vacio p{margin:0;line-height:1.55}

  .back-link{
    display:inline-flex;align-items:center;min-height:var(--tap);margin-top:24px;
    color:var(--muted-strong);font-size:15px;text-decoration:underline;
  }
  .back-link:hover{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>El sal&oacute;n</h1>
      <p class="sub">Todas las mesas y c&oacute;mo est&aacute; cada una, ahora.</p>
    </div>
    <div class="head-right">
      <span class="conn conn-retry" id="conn" role="status" aria-live="polite">
        <span class="dot" aria-hidden="true"></span><span>Conectando...</span>
      </span>
      <a class="btn btn-secondary" href="cocina.html" style="padding:8px 16px;font-size:15px">
        Panel de cocina
      </a>
    </div>
  </header>

  <div class="resumen" id="resumen" hidden>
    <div><span>Libres</span><b id="rLibres">0</b></div>
    <div><span>Ocupadas</span><b id="rOcupadas">0</b></div>
    <div><span>Para limpiar</span><b id="rLimpiar">0</b></div>
    <div><span>Falta cobrar</span><b id="rDebe">$0</b></div>
  </div>

  <ul class="mesas" id="lista"></ul>
  <div id="estado"></div>

  <a class="back-link" href="./">Volver al inicio</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<script src="config.js" defer></script>
<script src="app.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  'use strict';
  var esc = LP.esc, money = LP.money;
  var sb = LP.client();

  var lista = document.getElementById('lista');
  var estado = document.getElementById('estado');
  var resumen = document.getElementById('resumen');
  var conn = new LP.ConnBadge(document.getElementById('conn'));

  /* Las claves tienen que ser los estados REALES: con las viejas, un pedido
     'Por aprobar' o 'En cocina' salia sin color. */
  var BADGE = { 'Por aprobar': 'b-nuevo', 'En cocina': 'b-nuevo',
                Cocinando: 'b-cocinando', Listo: 'b-listo',
                Entregado: 'b-entregado', Rechazado: 'b-entregado' };

  var soy = LP.quienSoy();
  var YO = (soy && soy.nombre) || 'Salon';

  var plano = [];                       // las doce mesas, con o sin cuenta
  var cargado = false;
  var cerrando = Object.create(null);
  var tocando = Object.create(null);    // mesas con una accion en vuelo

  function cuentaDe(sesionId) {
    for (var i = 0; i < plano.length; i++) {
      if (plano[i].cuenta && String(plano[i].cuenta.sesion.id) === String(sesionId)) {
        return plano[i].cuenta;
      }
    }
    return null;
  }

  /* ---------------------------------------------------------- pintado -- */
  function pintar() {
    if (!plano.length) {
      lista.innerHTML = '';
      resumen.hidden = true;
      estado.innerHTML = '<div class="estado-vacio"><h3>No hay mesas cargadas</h3>' +
        '<p>Todavia no estan cargadas las mesas del local.</p></div>';
      return;
    }
    estado.innerHTML = '';
    resumen.hidden = false;

    var libres = 0, ocupadas = 0, limpiar = 0, debe = 0;
    plano.forEach(function (t) {
      if (t.estado === 'Libre') libres++;
      else if (t.estado === 'Limpieza') limpiar++;
      else if (t.estado !== 'Reservada') ocupadas++;
      if (t.cuenta) debe += t.cuenta.debe;
    });

    document.getElementById('rLibres').textContent = libres;
    document.getElementById('rOcupadas').textContent = ocupadas;
    document.getElementById('rLimpiar').textContent = limpiar;
    document.getElementById('rDebe').textContent = money(debe);

    /* El orden es la prioridad del mozo, no el numero de mesa: primero lo que
       se puede volver a vender (para limpiar), despues lo que falta cobrar, y
       las libres al final, que no piden nada.                            */
    var peso = { Limpieza: 0, Ocupada: 1, Reservada: 2, Libre: 3 };
    var orden = plano.slice().sort(function (a, b) {
      var pa = peso[a.estado] === undefined ? 1 : peso[a.estado];
      var pb = peso[b.estado] === undefined ? 1 : peso[b.estado];
      if (pa !== pb) return pa - pb;
      if (pa === 1) {
        var da = a.cuenta && a.cuenta.debe > 0 ? 0 : 1;
        var db = b.cuenta && b.cuenta.debe > 0 ? 0 : 1;
        if (da !== db) return da - db;
      }
      return (a.mesa.orden || a.mesa.numero || 0) - (b.mesa.orden || b.mesa.numero || 0);
    });

    lista.innerHTML = orden.map(tileHTML).join('');
  }

  function tileHTML(t) {
    if (t.estado === 'Libre') return libreHTML(t);
    if (t.estado === 'Reservada') return reservadaHTML(t);
    return mesaHTML(t.cuenta, t.estado === 'Limpieza');
  }

  function libreHTML(t) {
    return '<li class="mesa libre">' +
        '<h2>' + esc(t.etiqueta) + '</h2>' +
        '<span class="cabe">Libre' +
          (t.mesa.capacidad ? ' · ' + t.mesa.capacidad + ' personas' : '') + '</span>' +
        '<button type="button" class="btn btn-primary" style="width:100%" ' +
          'data-sentar="' + esc(t.etiqueta) + '">Sentar</button>' +
        '<button type="button" class="apartar" data-reservar="' + esc(t.etiqueta) + '">' +
          'Reservar</button>' +
      '</li>';
  }

  function reservadaHTML(t) {
    var ses = t.cuenta.sesion;
    return '<li class="mesa reservada" data-sesion="' + esc(ses.id) + '">' +
        '<div class="mesa-top">' +
          '<div>' +
            '<h2>' + esc(t.etiqueta) + '</h2>' +
            '<div class="desde">Apartada ' + esc(LP.timeAgo(ses.abierta_en)) + '</div>' +
            (ses.abierta_por
              ? '<div class="abrio">La aparto ' + esc(ses.abierta_por) + '</div>' : '') +
          '</div>' +
          '<span class="chip reservada">Reservada</span>' +
        '</div>' +
        '<div class="acciones">' +
          '<button type="button" class="btn btn-primary" data-ocupar="' + esc(ses.id) + '">' +
            'Llegaron</button>' +
          '<button type="button" class="btn btn-secondary" data-cerrar="' + esc(ses.id) + '">' +
            'Liberar</button>' +
        '</div>' +
      '</li>';
  }

  function mesaHTML(m, limpiar) {
    var debe = m.debe > 0;
    // Pago todo y falta levantar: es la mesa que hay que ir a limpiar YA,
    // porque es la unica que se puede volver a vender.
    limpiar = !!limpiar && !debe;
    /* Sentada y todavia sin pedir. Antes no existia -la mesa nacia con su
       primer pedido-; ahora el mozo la abre cuando llegan.               */
    var sinPedir = m.rondas === 0;
    var rondas = m.pedidos.map(function (p, i) {
      var items = (p.lines || []).map(function (l) {
        return l.qty + '× ' + l.name;
      }).join(', ');
      return '<li class="ronda">' +
          '<span class="que"><b>Ronda ' + (i + 1) + ' · ' + esc(LP.timeAgo(p.created_at)) +
            '</b>' + esc(items || 'Sin detalle') +
            '<span class="badge ' + (BADGE[p.estado] || '') + '">' + esc(p.estado) + '</span>' +
          '</span>' +
          '<span class="cuanto">' + money(p.total) + '</span>' +
        '</li>';
    }).join('');

    return '<li class="mesa' + (limpiar ? ' limpiar' : (debe ? ' debe' : '')) +
      '" data-sesion="' + m.sesion.id + '">' +
        '<div class="mesa-top">' +
          '<div>' +
            '<h2>' + esc(m.mesa) + '</h2>' +
            '<div class="desde">Abierta ' + esc(LP.timeAgo(m.sesion.abierta_en)) +
              (sinPedir ? '' : ' · ' + m.rondas +
                              (m.rondas === 1 ? ' ronda' : ' rondas')) + '</div>' +
            (m.sesion.abierta_por
              ? '<div class="abrio">La abrio ' + esc(m.sesion.abierta_por) + '</div>' : '') +
          '</div>' +
          '<span class="chip ' +
            (limpiar ? 'limpiar' : (debe ? 'debe' : (sinPedir ? 'espera' : 'ok'))) + '">' +
            (limpiar ? 'Para limpiar'
                     : (debe ? 'Falta cobrar' : (sinPedir ? 'Sin pedir' : 'Todo pago'))) +
          '</span>' +
        '</div>' +
        (sinPedir ? '' :
          '<ul class="rondas">' + rondas + '</ul>' +
          '<div class="totales">' +
            '<span class="etq">Total de la mesa' +
              (m.pagado > 0 && debe ? ' · pago ' + money(m.pagado) : '') + '</span>' +
            '<span class="num' + (debe ? ' debe' : '') + '">' +
              money(debe ? m.debe : m.total) + '</span>' +
          '</div>') +
        '<div class="acciones">' +
          '<button type="button" class="btn btn-primary" data-cerrar="' + m.sesion.id + '">' +
            (limpiar ? 'Mesa limpia, liberar'
                     : (sinPedir ? 'Se fueron, liberar' : 'Cerrar la mesa')) + '</button>' +
          /* El QR solo donde hay algo que cobrar: en el resto era un boton de
             mas, repetido en cada tarjeta. */
          (debe ? '<a class="btn btn-secondary" href="cobrar.html">Cobrar con QR</a>' : '') +
        '</div>' +
      '</li>';
  }

  /* ------------------------------------------------ sentar y reservar -- */
  lista.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-sentar], [data-reservar]');
    if (!b) return;
    var reservar = b.hasAttribute('data-reservar');
    var etiqueta = reservar ? b.dataset.reservar : b.dataset.sentar;
    if (tocando[etiqueta]) return;

    tocando[etiqueta] = true;
    b.disabled = true;
    var antes = b.textContent;
    b.textContent = reservar ? 'Apartando...' : 'Abriendo...';

    var accion = reservar ? LP.reservarMesa(sb, etiqueta, YO)
                          : LP.abrirMesa(sb, etiqueta, YO);

    accion.then(function (r) {
      delete tocando[etiqueta];
      if (!r || !r.ok) {
        b.disabled = false;
        b.textContent = antes;
        /* Que otro la haya abierto primero no es una falla: es el indice de
           la base impidiendo dos cuentas en la misma mesa. Se dice con todas
           las letras y se repinta, asi el mozo ve el estado real en lugar de
           pensar que no anduvo el boton.                                 */
        LP.toast((r && r.motivo) || 'No pudimos abrir la mesa.', 'err');
        cargar(true);
        return;
      }
      LP.toast(reservar ? etiqueta + ' queda apartada.'
                        : etiqueta + ' abierta. Ya puede pedir.', 'ok');
      cargar(true);
    });
  });

  /* --------------------------------------------------------- llegaron -- */
  lista.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-ocupar]');
    if (!b) return;
    var id = b.dataset.ocupar;
    if (tocando[id]) return;

    tocando[id] = true;
    b.disabled = true;
    b.textContent = 'Sentando...';

    LP.estadoDeMesa(sb, id, 'Ocupada').then(function (ok) {
      delete tocando[id];
      if (!ok) {
        b.disabled = false;
        b.textContent = 'Llegaron';
        LP.toast('No pudimos sentarlos. Proba de nuevo.', 'err');
        return;
      }
      cargar(true);
    });
  });

  /* ----------------------------------------------------------- cerrar -- */
  lista.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-cerrar]');
    if (!b) return;
    var id = b.dataset.cerrar;
    if (cerrando[id]) return;

    var m = cuentaDe(id);
    if (!m) return;

    /* Cerrar con saldo pendiente es una decision del local -a veces se cobra
       en efectivo y no se marco-, pero no puede pasar de largo sin querer. */
    if (m.debe > 0) {
      var ok = window.confirm('A ' + m.mesa + ' le falta cobrar ' + money(m.debe) +
        '.\n\nSi la cerras igual, la cuenta queda cerrada con ese saldo. Continuar?');
      if (!ok) return;
    }

    cerrando[id] = true;
    b.disabled = true;
    b.textContent = 'Cerrando...';

    var textoBoton = b.textContent;
    LP.cerrarSesion(sb, id, YO).then(function (hecho) {
      delete cerrando[id];

      /* La mesa todavia tiene comida en curso. No se cierra a la primera:
         casi siempre es un error, y si no lo es, se confirma y se fuerza. */
      if (hecho && hecho.bloqueado) {
        b.disabled = false;
        b.textContent = textoBoton;
        var igual = window.confirm(
          m.mesa + ' todavia tiene ' + hecho.enCurso +
          (hecho.enCurso === 1 ? ' pedido sin terminar' : ' pedidos sin terminar') +
          '.\n\nSi la cerras igual, esos pedidos quedan colgando de una cuenta ' +
          'cerrada. Cerrar de todos modos?');
        if (!igual) return;
        cerrando[id] = true;
        b.disabled = true;
        b.textContent = 'Cerrando...';
        LP.cerrarSesion(sb, id, YO, true).then(function () {
          delete cerrando[id];
          LP.toast(m.mesa + ' cerrada.', 'ok');
          cargar(true);
        });
        return;
      }

      if (!hecho) {
        b.disabled = false;
        b.textContent = textoBoton;
        LP.toast('No pudimos cerrarla. Puede que ya la haya cerrado otro.', 'err');
        cargar(true);
        return;
      }
      LP.toast(m.mesa + ' cerrada. El proximo pedido abre una cuenta nueva.', 'ok');
      cargar(true);
    });
  });

  /* ------------------------------------------------------------ carga -- */
  var enVuelo = false;
  function cargar(silencioso) {
    if (enVuelo) return Promise.resolve();
    if (!sb) {
      estado.innerHTML = '<div class="estado-vacio"><h3>No hay conexion con el sistema</h3></div>';
      return Promise.resolve();
    }
    enVuelo = true;
    return LP.planoDelSalon(sb).then(function (datos) {
      enVuelo = false;
      if (datos === null) {
        conn.set(navigator.onLine ? 'retry' : 'off');
        if (!cargado) {
          /* Ojo con tocar esto: si un error de conexion cayera en el camino
             normal, la pantalla pintaria las doce mesas libres, que es el
             peor error posible aca. Por eso planoDelSalon devuelve null. */
          estado.innerHTML = '<div class="estado-vacio"><h3>No pudimos cargar las mesas</h3>' +
            '<p>Revisa la conexion del local.</p></div>';
        } else if (!silencioso) {
          LP.toast('No pudimos actualizar. Seguimos intentando.', 'err');
        }
        return;
      }
      conn.set(navigator.onLine ? 'live' : 'off');
      plano = datos;
      cargado = true;
      pintar();
    });
  }

  /* Realtime sobre pedidos y sesiones: una ronda nueva cambia el total de la
     mesa, y otro empleado puede cerrarla desde su telefono.             */
  var canal = null;
  function suscribir() {
    if (!sb) return;
    var mio = sb.channel('mesas-' + Date.now())
      .on('postgres_changes', { event: '*', schema: 'public', table: LP.TABLE },
          function () { cargar(true); })
      .on('postgres_changes', { event: '*', schema: 'public', table: LP.SESIONES_TABLE },
          function () { cargar(true); });
    canal = mio;
    mio.subscribe(function (st) {
      if (canal !== mio) return;
      if (st === 'SUBSCRIBED') conn.set(navigator.onLine ? 'live' : 'off');
    });
  }

  LP.onCleanup(function () {
    if (canal && sb) { try { sb.removeChannel(canal); } catch (e) {} }
  });

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) cargar(true);
  });

  cargar().then(suscribir);
  // Refresca los "hace X min" sin volver a consultar.
  setInterval(function () { if (cargado && !document.hidden) pintar(); }, 30000);
});
</script>
</body>
</html>
