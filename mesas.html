<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3ece2">
<meta name="description" content="El plano del salon de La Positiva: como esta cada mesa, en vivo.">
<title>La Positiva - El salon</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="La Positiva">
<link rel="preload" href="fonts/jost-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/cormorant-500-italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
<style>
  .wrap{max-width:760px;padding-top:calc(18px + var(--sa-t));padding-bottom:40px}


  /* ------------------------------------------------------- las plantas -- */
  .plantas{display:flex;gap:8px;margin-bottom:12px}
  .planta-btn{
    flex:1;min-height:var(--tap);padding:0 14px;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--card);border:1px solid var(--border-strong);
    border-radius:var(--r-pill);font-size:15px;font-family:inherit;
    color:var(--muted-strong);cursor:pointer;
    transition:background .18s ease,border-color .18s ease,color .18s ease;
  }
  .planta-btn[aria-pressed="true"]{
    background:var(--ink);border-color:var(--ink);color:var(--gold);font-weight:500;
  }
  /* Cuantas mesas de ESA planta piden algo: para no subir la escalera al pepe. */
  .planta-btn .pide{
    min-width:21px;height:21px;padding:0 6px;border-radius:var(--r-pill);
    display:inline-flex;align-items:center;justify-content:center;
    background:var(--warn);color:#fff;font-size:12px;font-weight:600;
  }
  .planta-btn[aria-pressed="true"] .pide{background:var(--gold);color:var(--ink)}
  .planta-btn .pide[hidden]{display:none}

  /* ---------------------------------------------------------- el plano -- */
  /* Papel de plano: fondo claro, no la tarjeta crema de siempre. */
  .plano-caja{
    background:#faf6ef;border:1px solid var(--border);
    border-radius:var(--r-lg);padding:10px 10px 12px;
  }
  .plano{display:block;width:100%;height:auto;touch-action:manipulation}

  /* --- el papel: grilla fina y cotas, como un plano de verdad --------- */
  .grilla-l{stroke:#e3d8c6;stroke-width:.18}
  .cota{stroke:#c9b99f;stroke-width:.25}
  .cota-tick{stroke:#c9b99f;stroke-width:.4}
  .cota-txt{
    fill:#b3a189;font-size:2.6px;font-family:'Jost',sans-serif;
    text-anchor:middle;letter-spacing:.4px;
  }
  .esquina{stroke:#c9b99f;stroke-width:.45;fill:none}
  .rotulo{
    fill:var(--ink);font-family:'Jost',sans-serif;font-weight:600;
    font-size:5px;letter-spacing:1.6px;text-transform:uppercase;
  }
  .rotulo-sub{
    fill:#b3a189;font-family:'Jost',sans-serif;font-size:2.7px;
    letter-spacing:.9px;text-transform:uppercase;
  }

  /* El salon dibujado: paredes y muebles. No son datos, son el lugar. */
  .pared{fill:#fffdf9;stroke:var(--ink);stroke-width:.9}
  .mueble{fill:#ded0ba;stroke:#c4b298;stroke-width:.25}
  .mueble-txt{
    fill:#8c7a63;font-size:3.4px;font-family:'Jost',sans-serif;
    text-anchor:middle;letter-spacing:.5px;text-transform:uppercase;
  }
  /* Las sillas: son lo que hace que un rectangulo se lea como una mesa. */
  .silla{fill:#d8c7ad;stroke:#bda98b;stroke-width:.2}

  /* Las mesas. La transicion hace que un cambio de estado se VEA cambiar,
     que es lo que convierte el plano en algo vivo y no en una foto. */
  .mesa-g{cursor:pointer}
  .mesa-f{
    stroke-width:1.1;
    transition:fill .3s ease,stroke .3s ease,opacity .3s ease;
  }
  .mesa-n{
    font-family:'Jost',sans-serif;font-weight:600;font-size:6px;
    text-anchor:middle;dominant-baseline:central;
    transition:fill .3s ease;pointer-events:none;
  }
  .mesa-i{
    font-family:'Jost',sans-serif;font-size:4px;text-anchor:middle;   /* ~12px a 375 */
    fill:var(--muted);pointer-events:none;
  }

  /* La madera dice "aca hay una mesa"; el borde dice como esta.
     Se separan a proposito: si el estado fuera el color de la tapa, el plano
     se volveria un semaforo y dejaria de parecer el salon. */
  .e-libre .mesa-f{fill:var(--wood-pale);stroke:#c4b298;stroke-dasharray:2.2 1.8;stroke-width:.8}
  .e-libre .mesa-n{fill:var(--muted)}
  .e-libre .mesa-i{fill:var(--muted-soft)}

  .e-ocupada .mesa-f{fill:var(--wood);stroke:var(--wood-dark);stroke-width:.9}
  .e-ocupada .mesa-n{fill:#fdf6ea}
  .e-ocupada .mesa-i{fill:#fdf6ea}

  .e-debe .mesa-f{fill:var(--wood);stroke:var(--warn);stroke-width:1.7}
  .e-debe .mesa-n{fill:#fdf6ea}
  .e-debe .mesa-i{fill:#fdf6ea}

  .e-reservada .mesa-f{fill:var(--wood-pale);stroke:var(--warn);stroke-dasharray:2.6 1.8;stroke-width:1.2}
  .e-reservada .mesa-n{fill:var(--warn)}
  .e-reservada .mesa-i{fill:var(--warn)}

  .e-limpieza .mesa-f{fill:var(--wood);stroke:var(--ok);stroke-width:1.7}
  .e-limpieza .mesa-n{fill:#fdf6ea}
  .e-limpieza .mesa-i{fill:#fdf6ea}

  .mesa-g:hover .mesa-f{stroke-width:2.2}
  .mesa-g:focus-visible{outline:none}
  .mesa-g:focus-visible .mesa-f{stroke:var(--accent);stroke-width:2}

  /* Late suave: la que ya pago y hay que levantar es la unica que se puede
     volver a vender, asi que es la unica que llama. */
  @keyframes latir{0%,100%{opacity:1}50%{opacity:.55}}
  .pulso{animation:latir 2.4s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){.pulso{animation:none}}

  .leyenda{
    display:flex;gap:10px 12px;flex-wrap:wrap;margin-top:12px;
    padding-top:11px;border-top:1px dashed var(--border);
  }
  .leyenda span{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);white-space:nowrap}
  .leyenda i{width:13px;height:13px;border-radius:4px;border:1.5px solid;flex:none}
  .l-libre{background:var(--wood-pale);border-color:#c4b298;border-style:dashed}
  .l-ocupada{background:var(--wood);border-color:var(--wood-dark)}
  .l-debe{background:var(--wood);border-color:var(--warn)}
  .l-limpieza{background:var(--wood);border-color:var(--ok)}

  /* ----------------------------------------------------------- la hoja -- */
  .hoja-sub{font-size:14px;color:var(--muted);margin:-6px 0 14px}
  .hoja-et{font-size:14px;color:var(--muted-strong);margin:0 0 8px;font-weight:500}



  .abrio{font-size:12px;color:var(--muted);margin:3px 0 0}

  .rondas{list-style:none;margin:14px 0 0;padding:0}
  .ronda{
    padding:10px 0;border-top:1px dashed var(--border);
    display:flex;justify-content:space-between;gap:12px;align-items:flex-start;
  }
  .ronda .que{flex:1;min-width:0;font-size:15px;line-height:1.45}
  .ronda .que b{display:block;font-size:13px;color:var(--muted);font-weight:500}
  .ronda .cuanto{flex:none;font-weight:600;text-align:right}
  .ronda .cuanto s{color:var(--muted);font-weight:400;display:block;font-size:13px}

  .platos{list-style:none;margin:4px 0 0;padding:0}
  .platos li{font-size:15px;line-height:1.5}
  .platos li.fuera{color:var(--muted)}
  .platos li.fuera .nom{text-decoration:line-through}
  .marca-fuera{
    font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
    background:var(--err-bg);color:var(--err-ink);border-radius:var(--r-pill);
    padding:2px 8px;margin-left:6px;white-space:nowrap;
  }
  .porque{display:block;font-size:12px;color:var(--muted);margin:1px 0 2px}
  .sacar-btn{
    display:inline-flex;align-items:center;justify-content:center;
    min-height:var(--tap);padding:0 14px;margin-top:6px;
    font-size:14px;font-family:inherit;cursor:pointer;
    background:none;border:1px solid var(--border-strong);border-radius:var(--r-pill);
    color:var(--muted-strong);
  }
  .sacar-btn:hover{border-color:var(--err);color:var(--err-ink)}
  .reponer{
    display:inline-flex;align-items:center;min-height:var(--tap);
    font-size:13px;color:var(--muted-strong);text-decoration:underline;
    background:none;border:0;cursor:pointer;font-family:inherit;padding:0;
  }
  .reponer:hover{color:var(--ink)}

  .totales{
    margin-top:14px;padding-top:13px;border-top:1px solid var(--border-strong);
    display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  }
  .totales .etq{font-size:14px;color:var(--muted-strong)}
  .totales .num{font-size:25px;font-weight:600}
  .totales .num.debe{color:var(--warn)}


  .cab-cuenta{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .cab-cuenta .desde{font-size:14px;color:var(--muted)}


</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>El sal&oacute;n</h1>
      <p class="sub">Toc&aacute; una mesa para ver su cuenta</p>
    </div>
    <div class="head-right">
      <span class="conn conn-retry" id="conn" role="status" aria-live="polite">
        <span class="dot" aria-hidden="true"></span><span>Conectando...</span>
      </span>
      <!-- Se saco el boton a la cocina: el mozo no trabaja ahi, y a lo suyo
           llega desde la portada. En su lugar va quien sos, que es lo que
           faltaba en todas las pantallas. -->
      <a class="soy" href="./" data-quien hidden></a>
    </div>
  </header>

  <div class="cifras" id="resumen" hidden>
    <div class="cifra"><span>Libres</span><b id="rLibres">0</b></div>
    <div class="cifra"><span>Ocupadas</span><b id="rOcupadas">0</b></div>
    <div class="cifra"><span>Para limpiar</span><b id="rLimpiar">0</b></div>
    <div class="cifra" id="cifraDebe"><span>Falta cobrar</span><b id="rDebe">$0</b></div>
  </div>

  <div class="plantas" id="plantas" hidden role="group" aria-label="Planta del local"></div>

  <div class="plano-caja" id="planoCaja" hidden>
    <svg class="plano" id="plano" viewBox="-8 -8 116 150" role="group"
         aria-label="Plano del sal&oacute;n: cada mesa es un bot&oacute;n"></svg>
    <div class="leyenda">
      <span><i class="l-libre"></i>Libre</span>
      <span><i class="l-ocupada"></i>Ocupada</span>
      <span><i class="l-debe"></i>Falta cobrar</span>
      <span><i class="l-limpieza"></i>Para limpiar</span>
    </div>
  </div>

  <div id="estado"></div>

  <a class="back-link" href="./">Volver al inicio</a>
</div>

<!-- Una sola hoja para todo: la cuenta de la mesa y los dos pasos de sacar un
     plato. Tres vistas, una sola ventana, con flecha para volver. -->
<div class="sheet" id="hoja" hidden role="dialog" aria-modal="true" aria-labelledby="hojaTit">
  <div class="sheet-panel">
    <div class="sheet-head">
      <button type="button" class="close-x" id="hojaBack" aria-label="Volver" hidden>&#8592;</button>
      <h2 id="hojaTit">Mesa</h2>
      <button type="button" class="close-x" id="hojaX" aria-label="Cerrar">&#10005;</button>
    </div>
    <p class="hoja-sub" id="hojaSub"></p>
    <div id="hojaCuerpo"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<script src="config.js" defer></script>
<script src="app.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  'use strict';
  var esc = LP.esc, money = LP.money;
  var sb = LP.client();

  var svg = document.getElementById('plano');
  var planoCaja = document.getElementById('planoCaja');
  var plantasBar = document.getElementById('plantas');
  var estado = document.getElementById('estado');
  var resumen = document.getElementById('resumen');
  var conn = new LP.ConnBadge(document.getElementById('conn'));

  var puedoSacar = LP.puedeSacar();
  var soy = LP.quienSoy();
  var YO = (soy && soy.nombre) || 'Salon';

  var plano = [];                       // las mesas, con o sin cuenta
  var cargado = false;
  var plantaActiva = null;              // 'Baja' | 'Alta'
  var mesaAbierta = null;               // etiqueta de la mesa abierta en la hoja
  var vista = 'mesa';                   // 'mesa' | 'que' | 'porque'
  var sacando = null;                   // pedido elegido para sacar
  var enVuelo = Object.create(null);    // acciones en curso, por clave

  /* ------------------------------------------------------- el edificio --
     Paredes y muebles fijos. Van dibujados y no en la base a proposito: la
     barra y la escalera no cambian durante el servicio, no son datos.
     Las mesas si, porque cambian de estado todo el tiempo.              */
  var EDIFICIO = {
    Baja:
      '<rect class="pared" x="3" y="3" width="94" height="124" rx="1.5"/>' +
      '<rect class="mueble" x="8" y="8" width="46" height="9" rx="1"/>' +
      '<text class="mueble-txt" x="31" y="14.3">Barra</text>' +
      '<rect class="mueble" x="60" y="8" width="32" height="14" rx="1"/>' +
      '<text class="mueble-txt" x="76" y="16.4">Cocina</text>' +
      '<rect class="mueble" x="86" y="88" width="7" height="26" rx="1"/>' +
      '<text class="mueble-txt" x="89.5" y="101" transform="rotate(-90 89.5 101)">Escalera</text>' +
      '<rect class="mueble" x="8" y="112" width="18" height="10" rx="1"/>' +
      '<text class="mueble-txt" x="17" y="117.9">Ba&#241;os</text>',
    Alta:
      '<rect class="pared" x="3" y="3" width="94" height="124" rx="1.5"/>' +
      '<rect class="mueble" x="8" y="8" width="80" height="6" rx="1"/>' +
      '<text class="mueble-txt" x="48" y="12.2">Ventanal a la calle</text>' +
      '<rect class="mueble" x="86" y="88" width="7" height="26" rx="1"/>' +
      '<text class="mueble-txt" x="89.5" y="101" transform="rotate(-90 89.5 101)">Escalera</text>'
  };

  /* --- el papel ----------------------------------------------------------
     La grilla, las cotas y las marcas de esquina no dicen nada del servicio:
     son las que hacen que esto se lea como el plano del local y no como una
     botonera. Van una sola vez y no dependen de los datos.              */
  function papel(planta) {
    var g = '';
    var i;
    // grilla fina cada 10
    for (i = 10; i < 100; i += 10) {
      g += '<line class="grilla-l" x1="' + i + '" y1="0" x2="' + i + '" y2="130"/>';
    }
    for (i = 10; i < 130; i += 10) {
      g += '<line class="grilla-l" x1="0" y1="' + i + '" x2="100" y2="' + i + '"/>';
    }

    // cotas arriba y a la izquierda, con sus marquitas
    var cotas =
      '<line class="cota" x1="3" y1="-3.5" x2="97" y2="-3.5"/>' +
      '<line class="cota-tick" x1="3" y1="-5" x2="3" y2="-2"/>' +
      '<line class="cota-tick" x1="50" y1="-5" x2="50" y2="-2"/>' +
      '<line class="cota-tick" x1="97" y1="-5" x2="97" y2="-2"/>' +
      '<line class="cota" x1="-3.5" y1="3" x2="-3.5" y2="127"/>' +
      '<line class="cota-tick" x1="-5" y1="3" x2="-2" y2="3"/>' +
      '<line class="cota-tick" x1="-5" y1="65" x2="-2" y2="65"/>' +
      '<line class="cota-tick" x1="-5" y1="127" x2="-2" y2="127"/>';

    // marcas de esquina, como en los planos impresos
    var e = '';
    [[3, 3, 1, 1], [97, 3, -1, 1], [3, 127, 1, -1], [97, 127, -1, -1]]
      .forEach(function (c) {
        e += '<path class="esquina" d="M' + (c[0] + c[2] * 7) + ' ' + c[1] +
             ' H' + c[0] + ' V' + (c[1] + c[3] * 7) + '"/>';
      });

    var rot =
      '<text class="rotulo" x="3" y="136">Planta ' + esc(planta.toLowerCase()) + '</text>' +
      '<text class="rotulo-sub" x="97" y="136" text-anchor="end">La Positiva &middot; sal&oacute;n</text>';

    return g + cotas + e + rot;
  }

  /* Las sillas alrededor de la mesa. Son lo que hace que un rectangulo se
     lea como una mesa y no como un boton: salen de la capacidad, que ya
     estaba en la base.                                                  */
  function sillas(m, x, y, an, al) {
    var cap = Math.min(Number(m.capacidad) || 0, 12);
    if (!cap) return '';
    var r = 1.9, sep = 2.4, out = '';

    if (m.forma === 'redonda') {
      for (var k = 0; k < cap; k++) {
        var ang = (Math.PI * 2 * k) / cap - Math.PI / 2;
        out += '<circle class="silla" r="' + r +
          '" cx="' + (x + Math.cos(ang) * (an / 2 + sep)).toFixed(2) +
          '" cy="' + (y + Math.sin(ang) * (al / 2 + sep)).toFixed(2) + '"/>';
      }
      return out;
    }

    /* Cuadrada: se reparten arriba y abajo primero -que es como se sienta la
       gente en una mesa larga- y el resto a los costados. */
    var arriba = Math.ceil(cap / 2), costados = cap - arriba;
    var porLado = Math.ceil(arriba / 2);
    var i;
    for (i = 0; i < porLado; i++) {
      out += '<circle class="silla" r="' + r + '" cx="' +
        (x - an / 2 + (an * (i + 0.5)) / porLado).toFixed(2) +
        '" cy="' + (y - al / 2 - sep).toFixed(2) + '"/>';
    }
    var abajo = arriba - porLado;
    for (i = 0; i < abajo; i++) {
      out += '<circle class="silla" r="' + r + '" cx="' +
        (x - an / 2 + (an * (i + 0.5)) / abajo).toFixed(2) +
        '" cy="' + (y + al / 2 + sep).toFixed(2) + '"/>';
    }
    var izq = Math.ceil(costados / 2), der = costados - izq;
    for (i = 0; i < izq; i++) {
      out += '<circle class="silla" r="' + r + '" cx="' + (x - an / 2 - sep).toFixed(2) +
        '" cy="' + (y - al / 2 + (al * (i + 0.5)) / izq).toFixed(2) + '"/>';
    }
    for (i = 0; i < der; i++) {
      out += '<circle class="silla" r="' + r + '" cx="' + (x + an / 2 + sep).toFixed(2) +
        '" cy="' + (y - al / 2 + (al * (i + 0.5)) / der).toFixed(2) + '"/>';
    }
    return out;
  }

  /* --------------------------------------------------------- utilidades -- */
  function mesaPorEtiqueta(et) {
    for (var i = 0; i < plano.length; i++) if (plano[i].etiqueta === et) return plano[i];
    return null;
  }

  function pedidoPorId(id) {
    for (var i = 0; i < plano.length; i++) {
      var c = plano[i].cuenta;
      if (!c) continue;
      for (var j = 0; j < c.pedidos.length; j++) {
        if (String(c.pedidos[j].id) === String(id)) return c.pedidos[j];
      }
    }
    return null;
  }

  // Una mesa "pide algo" si se puede volver a vender o si hay que cobrarle.
  function pideAlgo(t) {
    if (t.estado === 'Limpieza') return true;
    return !!(t.cuenta && t.cuenta.debe > 0);
  }

  function claseDe(t) {
    if (t.estado === 'Libre') return 'e-libre';
    if (t.estado === 'Reservada') return 'e-reservada';
    if (t.estado === 'Limpieza') return 'e-limpieza';
    return (t.cuenta && t.cuenta.debe > 0) ? 'e-debe' : 'e-ocupada';
  }

  function textoEstado(t) {
    if (t.estado === 'Libre') return 'libre';
    if (t.estado === 'Reservada') return 'reservada';
    if (t.estado === 'Limpieza') return 'pago todo, hay que levantarla';
    if (t.cuenta && t.cuenta.debe > 0) return 'falta cobrar ' + money(t.cuenta.debe);
    return 'ocupada';
  }

  /* ---------------------------------------------------------- pintado --- */
  function pintar() {
    if (!plano.length) {
      planoCaja.hidden = true;
      plantasBar.hidden = true;
      resumen.hidden = true;
      estado.innerHTML = '<div class="estado-vacio"><h3>No hay mesas cargadas</h3>' +
        '<p>Todavia no estan cargadas las mesas del local.</p></div>';
      return;
    }
    estado.innerHTML = '';
    resumen.hidden = false;
    planoCaja.hidden = false;

    var libres = 0, ocupadas = 0, limpiar = 0, debe = 0;
    plano.forEach(function (t) {
      if (t.estado === 'Libre') libres++;
      else if (t.estado === 'Limpieza') limpiar++;
      else if (t.estado !== 'Reservada') ocupadas++;
      if (t.cuenta) debe += t.cuenta.debe;
    });
    document.getElementById('rLibres').textContent = libres;
    document.getElementById('rOcupadas').textContent = ocupadas;
    document.getElementById('rLimpiar').textContent = limpiar;
    document.getElementById('rDebe').textContent = money(debe);
    // Con deuda, la cifra se pone ambar, igual que el total de la hoja.
    document.getElementById('cifraDebe').className = 'cifra' + (debe > 0 ? ' alerta' : '');

    pintarPlantas();
    pintarPlano();

    /* Si la hoja esta abierta mostrando una mesa, se repinta con lo nuevo:
       asi un pago que entra por realtime se ve sin cerrar y volver a abrir.
       Solo en la vista 'mesa': no se le puede mover el piso a alguien que
       esta a mitad de elegir por que saca un plato. */
    if (mesaAbierta && vista === 'mesa') verMesa(mesaAbierta);
  }

  function plantasDelLocal() {
    var vistas = [], orden = { Baja: 0, Alta: 1 };
    plano.forEach(function (t) {
      var p = t.mesa.planta || 'Baja';
      if (vistas.indexOf(p) === -1) vistas.push(p);
    });
    /* Ojo con el `|| 9` de siempre: Baja vale 0, y 0 || 9 da 9. Con eso la
       planta alta quedaba primera y era la que se abria al entrar. */
    vistas.sort(function (a, b) {
      var pa = orden[a] === undefined ? 9 : orden[a];
      var pb = orden[b] === undefined ? 9 : orden[b];
      return pa - pb;
    });
    return vistas;
  }

  function pintarPlantas() {
    var plantas = plantasDelLocal();
    if (plantas.indexOf(plantaActiva) === -1) plantaActiva = plantas[0] || null;

    // Con una sola planta el selector no aporta nada: no se dibuja.
    plantasBar.hidden = plantas.length < 2;
    if (plantasBar.hidden) return;

    plantasBar.innerHTML = plantas.map(function (p) {
      var pide = 0;
      plano.forEach(function (t) {
        if ((t.mesa.planta || 'Baja') === p && pideAlgo(t)) pide++;
      });
      return '<button type="button" class="planta-btn" data-planta="' + esc(p) + '" ' +
          'aria-pressed="' + (p === plantaActiva) + '">' +
          '<span>Planta ' + esc(p.toLowerCase()) + '</span>' +
          '<span class="pide"' + (pide ? '' : ' hidden') + '>' + pide + '</span>' +
        '</button>';
    }).join('');
  }

  function pintarPlano() {
    var deLaPlanta = plano.filter(function (t) {
      return (t.mesa.planta || 'Baja') === plantaActiva;
    });
    svg.innerHTML = papel(plantaActiva || 'Baja') +
      (EDIFICIO[plantaActiva] || EDIFICIO.Baja) +
      deLaPlanta.map(mesaSVG).join('');
  }

  function mesaSVG(t) {
    var m = t.mesa;
    var x = Number(m.x), y = Number(m.y);
    var an = Number(m.ancho), al = Number(m.alto);
    var redonda = m.forma === 'redonda';
    var late = t.estado === 'Limpieza' ? ' pulso' : '';

    /* La forma se dibuja centrada en (x,y): mover una mesa de lugar es
       cambiar dos numeros en la base y nada mas. */
    var figura = redonda
      ? '<ellipse class="mesa-f' + late + '" cx="' + x + '" cy="' + y +
          '" rx="' + (an / 2) + '" ry="' + (al / 2) + '"/>'
      : '<rect class="mesa-f' + late + '" x="' + (x - an / 2) + '" y="' + (y - al / 2) +
          '" width="' + an + '" height="' + al + '" rx="2.5"/>';

    var pie = t.estado === 'Libre'
      ? (m.capacidad ? m.capacidad + ' pers.' : '')
      : (t.cuenta && t.cuenta.debe > 0 ? money(t.cuenta.debe)
         : (t.estado === 'Limpieza' ? 'levantar'
            : (t.estado === 'Reservada' ? 'reservada' : 'ocupada')));

    return '<g class="mesa-g ' + claseDe(t) + '" data-mesa="' + esc(t.etiqueta) + '" ' +
        'role="button" tabindex="0" ' +
        'aria-label="' + esc(t.etiqueta + ', ' + textoEstado(t)) + '">' +
        sillas(m, x, y, an, al) +
        figura +
        '<text class="mesa-n" x="' + x + '" y="' + (y - (pie ? 1.6 : 0)) + '">' +
          esc(m.numero) + '</text>' +
        (pie ? '<text class="mesa-i" x="' + x + '" y="' + (y + al / 2 - 3.2) + '">' +
               esc(pie) + '</text>' : '') +
      '</g>';
  }

  /* ------------------------------------------------------------ la hoja -- */
  var hoja = document.getElementById('hoja');
  var hojaTit = document.getElementById('hojaTit');
  var hojaSub = document.getElementById('hojaSub');
  var hojaCuerpo = document.getElementById('hojaCuerpo');
  var hojaBack = document.getElementById('hojaBack');

  /* La hoja pasa por el helper de app.js: foco adentro al abrir, Tab no se
     escapa a la pagina tapada, y al cerrar el foco vuelve a la mesa. */
  function cerrarHoja() {
    LP.closeDialog(hoja);
    hojaCuerpo.innerHTML = '';
    mesaAbierta = null;
    sacando = null;
    vista = 'mesa';
    hojaBack.hidden = true;
  }

  function verMesa(etiqueta) {
    var t = mesaPorEtiqueta(etiqueta);
    if (!t) { cerrarHoja(); return; }
    mesaAbierta = etiqueta;
    vista = 'mesa';
    sacando = null;
    hojaBack.hidden = true;
    if (!LP.isDialogOpen(hoja)) LP.openDialog(hoja, { persistent: true, focus: '#hojaX' });

    hojaTit.textContent = t.etiqueta;
    hojaSub.textContent = textoEstado(t) +
      (t.mesa.capacidad ? ' · ' + t.mesa.capacidad + ' personas' : '');

    if (t.estado === 'Libre') { hojaCuerpo.innerHTML = cuerpoLibre(t); return; }
    if (t.estado === 'Reservada') { hojaCuerpo.innerHTML = cuerpoReservada(t); return; }
    hojaCuerpo.innerHTML = cuerpoCuenta(t);
  }

  function cuerpoLibre(t) {
    return '<div class="acciones" style="margin-top:4px">' +
        '<button type="button" class="btn btn-primary" data-sentar="' +
          esc(t.etiqueta) + '">Sentar</button>' +
        '<button type="button" class="btn btn-secondary" data-reservar="' +
          esc(t.etiqueta) + '">Reservar</button>' +
      '</div>';
  }

  function cuerpoReservada(t) {
    var ses = t.cuenta.sesion;
    return (ses.abierta_por
        ? '<p class="abrio">La aparto ' + esc(ses.abierta_por) + ' ' +
          esc(LP.timeAgo(ses.abierta_en)) + '</p>'
        : '') +
      '<div class="acciones">' +
        '<button type="button" class="btn btn-primary" data-ocupar="' + esc(ses.id) + '">' +
          'Llegaron</button>' +
        '<button type="button" class="btn btn-secondary" data-cerrar="' + esc(ses.id) + '">' +
          'Liberar</button>' +
      '</div>';
  }

  function cuerpoCuenta(t) {
    var m = t.cuenta;
    var debe = m.debe > 0;
    var limpiar = t.estado === 'Limpieza';
    var sinPedir = m.rondas === 0;

    var chip = limpiar ? '<span class="chip limpiar">Para limpiar</span>'
             : debe ? '<span class="chip debe">Falta cobrar</span>'
             : sinPedir ? '<span class="chip espera">Sin pedir</span>'
             : '<span class="chip ok">Todo pago</span>';

    var cab = '<div class="cab-cuenta">' +
        '<span class="desde">Abierta ' + esc(LP.timeAgo(m.sesion.abierta_en)) +
          (sinPedir ? '' : ' · ' + m.rondas + (m.rondas === 1 ? ' ronda' : ' rondas')) +
        '</span>' + chip +
      '</div>' +
      (m.sesion.abierta_por
        ? '<p class="abrio">La abrio ' + esc(m.sesion.abierta_por) + '</p>' : '');

    var rondas = sinPedir ? '' :
      '<ul class="rondas">' + m.pedidos.map(rondaHTML).join('') + '</ul>' +
      '<div class="totales">' +
        '<span class="etq">Total de la mesa' +
          (m.pagado > 0 && debe ? ' · pago ' + money(m.pagado) : '') + '</span>' +
        '<span class="num' + (debe ? ' debe' : '') + '">' +
          money(debe ? m.debe : m.total) + '</span>' +
      '</div>';

    var acciones = '<div class="acciones">' +
        '<button type="button" class="btn btn-primary" data-cerrar="' + esc(m.sesion.id) + '">' +
          (limpiar ? 'Mesa limpia, liberar'
                   : (sinPedir ? 'Se fueron, liberar' : 'Cerrar la mesa')) + '</button>' +
        /* El QR solo donde hay algo que cobrar, y con la mesa puesta: sin el
           parametro, la pantalla de cobro ofrecia los impagos de todo el local. */
        (debe ? '<a class="btn btn-secondary" href="cobrar.html?sesion=' + esc(m.sesion.id) +
                '">Cobrar con QR</a>' : '') +
      '</div>';

    return cab + rondas + acciones;
  }

  function rondaHTML(p, i) {
    var lineas = LP.lineasDe(p);
    var cobra = LP.cobrable(p);
    var salioAlgo = cobra < (Number(p.total) || 0);

    var platos = lineas.length
      ? '<ul class="platos">' + lineas.map(function (l, j) {
          var fuera = LP.lineaSacada(l);
          return '<li' + (fuera ? ' class="fuera"' : '') + '>' +
              '<span class="nom">' + l.qty + '× ' + esc(l.name) + '</span>' +
              (fuera ? '<span class="marca-fuera">Sacado</span>' : '') +
              (fuera
                ? '<span class="porque">' + esc(l.motivo || 'Sin motivo') +
                  (l.por ? ' · lo saco ' + esc(l.por) : '') +
                  (l.devuelto ? ' · ya se devolvio' : '') + '</span>' +
                  (l.devuelto ? '' :
                    '<button type="button" class="reponer" data-reponer="' +
                      esc(p.id) + ':' + j + '">Volver a ponerlo</button>')
                : '') +
            '</li>';
        }).join('') + '</ul>'
      : '<div class="platos">Sin detalle</div>';

    return '<li class="ronda">' +
        '<span class="que">' +
          '<b>Ronda ' + (i + 1) + ' · ' + esc(LP.timeAgo(p.created_at)) + '</b>' +
          platos +
          (puedoSacar && cobra > 0
            ? '<button type="button" class="sacar-btn" data-sacar="' + esc(p.id) + '">' +
              'Sacar un plato</button>'
            : '') +
        '</span>' +
        '<span class="cuanto">' +
          (salioAlgo ? '<s>' + money(p.total) + '</s>' : '') + money(cobra) +
        '</span>' +
      '</li>';
  }

  /* --------------------------------------------------- sacar: los pasos -- */
  function vivasDe(pedido) {
    var v = [];
    LP.lineasDe(pedido).forEach(function (l, i) { if (!LP.lineaSacada(l)) v.push({ l: l, i: i }); });
    return v;
  }

  function verQue(pedido) {
    sacando = pedido;
    vista = 'que';
    hojaBack.hidden = false;
    var vivas = vivasDe(pedido);
    // Un solo plato vivo: no tiene sentido preguntar cual.
    if (vivas.length === 1) { verMotivo(vivas[0].i, vivas[0].l); return; }

    hojaTit.textContent = 'Sacar de la cuenta';
    hojaSub.textContent = pedido.mesa + ' · ' + money(LP.cobrable(pedido));
    hojaCuerpo.innerHTML = '<p class="hoja-et">Que sale?</p>' +
      vivas.map(function (v) {
        return '<button type="button" class="opcion" data-linea="' + v.i + '">' +
            '<span>' + v.l.qty + '× ' + esc(v.l.name) + '</span>' +
            '<span class="plata">' + money(LP.importeDeLinea(v.l)) + '</span>' +
          '</button>';
      }).join('') +
      '<button type="button" class="opcion toda" data-linea="todo">' +
        '<span>Toda la ronda</span>' +
        '<span class="plata">' + money(LP.cobrable(pedido)) + '</span>' +
      '</button>';
  }

  function verMotivo(indice, linea) {
    vista = 'porque';
    hojaBack.hidden = false;
    var todo = indice === 'todo';
    var cuanto = todo ? LP.cobrable(sacando) : LP.importeDeLinea(linea);

    hojaTit.textContent = 'Por que sale?';
    hojaSub.textContent = (todo ? 'Toda la ronda' : linea.qty + '× ' + linea.name) +
      ' · ' + money(cuanto);

    /* Si ya esta pago se dice ANTES de tocar el motivo: no frena nada, pero
       el mozo se entera ahora y no cuando ya lo saco. */
    hojaCuerpo.innerHTML =
      (sacando.pagado
        ? '<div class="banda-pago">Esto ya est&aacute; pagado. Cuando lo saques, ' +
          'la caja tiene que devolverle ' + money(cuanto) + '.</div>'
        : '') +
      LP.MOTIVOS_SACAR.map(function (m) {
        return '<button type="button" class="opcion" data-motivo="' + esc(m) + '" ' +
          'data-indice="' + esc(String(indice)) + '">' + esc(m) + '</button>';
      }).join('');
  }

  /* ------------------------------------------------------------- toques -- */
  svg.addEventListener('click', function (ev) {
    var g = ev.target.closest('[data-mesa]');
    if (g) verMesa(g.dataset.mesa);
  });
  svg.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter' && ev.key !== ' ') return;
    var g = ev.target.closest('[data-mesa]');
    if (!g) return;
    ev.preventDefault();
    verMesa(g.dataset.mesa);
  });

  plantasBar.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-planta]');
    if (!b) return;
    plantaActiva = b.dataset.planta;
    pintarPlantas();
    pintarPlano();
  });

  hojaBack.addEventListener('click', function () {
    /* Con un solo plato vivo, "que sale" se saltea y la flecha tiene que
       volver a la mesa; si no, rebotaba a "por que sale" y el mozo quedaba
       encerrado con la X como unica salida. */
    if (vista === 'porque' && sacando && vivasDe(sacando).length > 1) { verQue(sacando); return; }
    if (mesaAbierta) verMesa(mesaAbierta);
  });
  document.getElementById('hojaX').addEventListener('click', cerrarHoja);
  hoja.addEventListener('click', function (ev) { if (ev.target === hoja) cerrarHoja(); });
  // En captura y antes que el helper, para que el cierre limpie el estado propio.
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && LP.isDialogOpen(hoja)) cerrarHoja();
  }, true);

  /* Todo lo que se toca adentro de la hoja pasa por aca. */
  hojaCuerpo.addEventListener('click', function (ev) {
    var b = ev.target.closest('button');
    if (!b || b.disabled) return;
    var d = b.dataset;

    if (d.sacar) { var p = pedidoPorId(d.sacar); if (p) verQue(p); return; }
    if (d.linea !== undefined) {
      if (d.linea === 'todo') verMotivo('todo', null);
      else verMotivo(Number(d.linea), LP.lineasDe(sacando)[Number(d.linea)]);
      return;
    }
    if (d.motivo) { ejecutarSacar(b, d.motivo, d.indice); return; }
    if (d.reponer) { ejecutarReponer(b, d.reponer); return; }
    if (d.sentar || d.reservar) { ejecutarAbrir(b, d.sentar || d.reservar, !!d.reservar); return; }
    if (d.ocupar) { ejecutarLlegaron(b, d.ocupar); return; }
    if (d.cerrar) { ejecutarCerrar(b, d.cerrar); return; }
  });

  /* --------------------------------------------------------- acciones --- */
  function bloquear(b, texto) {
    b.disabled = true;
    b.dataset.antes = b.textContent;
    b.textContent = texto;
  }
  function soltar(b) {
    b.disabled = false;
    if (b.dataset.antes) b.textContent = b.dataset.antes;
  }
  /* Recarga y, si la hoja no se rehizo (recarga fallida o descartada), el
     boton vuelve a su texto en vez de quedar en "Abriendo..." para siempre. */
  function recargarYSoltar(b) {
    return cargar(true).then(function () {
      if (b && document.body.contains(b) && b.disabled) soltar(b);
    });
  }

  function ejecutarSacar(b, motivo, crudo) {
    if (enVuelo.sacar) return;
    enVuelo.sacar = true;
    var pedido = sacando, todo = crudo === 'todo';
    [].forEach.call(hojaCuerpo.querySelectorAll('button'), function (x) { x.disabled = true; });
    b.textContent = 'Sacando...';

    var accion = todo ? LP.sacarRonda(sb, pedido, motivo, YO)
                      : LP.sacarPlato(sb, pedido, Number(crudo), motivo, YO);
    accion.then(function (r) {
      delete enVuelo.sacar;
      // Con error se vuelve a la cuenta de la mesa, no se cierra la hoja.
      if (!r.ok) { LP.toast(r.motivo, 'err'); vista = 'mesa'; cargar(true); return; }
      LP.toast(r.devolver > 0
        ? 'Listo. Hay que devolverle ' + money(r.devolver) + ' a ' + pedido.mesa +
          ' — lo hace la caja.'
        : 'Listo, lo sacamos de la cuenta de ' + pedido.mesa + '.', 'ok');
      vista = 'mesa';                    // al repintar vuelve a la cuenta de la mesa
      cargar(true);
    });
  }

  function ejecutarReponer(b, clave) {
    var partes = clave.split(':');
    var p = pedidoPorId(partes[0]);
    if (!p) { cargar(true); return; }
    bloquear(b, 'Poniendo...');
    LP.volverAPoner(sb, p, Number(partes[1]), YO).then(function (r) {
      if (!r.ok) LP.toast(r.motivo, 'err');
      else LP.toast('Volvi\u00f3 a la cuenta.', 'ok');
      recargarYSoltar(b);
    });
  }

  function ejecutarAbrir(b, etiqueta, reservar) {
    if (enVuelo[etiqueta]) return;
    enVuelo[etiqueta] = true;
    bloquear(b, reservar ? 'Apartando...' : 'Abriendo...');

    var accion = reservar ? LP.reservarMesa(sb, etiqueta, YO)
                          : LP.abrirMesa(sb, etiqueta, YO);
    accion.then(function (r) {
      delete enVuelo[etiqueta];
      if (!r || !r.ok) {
        soltar(b);
        /* Que otro la haya abierto primero no es una falla: es el indice de
           la base impidiendo dos cuentas en la misma mesa. */
        LP.toast((r && r.motivo) || 'No pudimos abrir la mesa.', 'err');
        cargar(true);
        return;
      }
      LP.toast(reservar ? etiqueta + ' queda apartada.'
                        : etiqueta + ' abierta. Ya puede pedir.', 'ok');
      recargarYSoltar(b);
    });
  }

  function ejecutarLlegaron(b, sesionId) {
    if (enVuelo[sesionId]) return;
    enVuelo[sesionId] = true;
    bloquear(b, 'Sentando...');
    LP.estadoDeMesa(sb, sesionId, 'Ocupada').then(function (ok) {
      delete enVuelo[sesionId];
      if (!ok) { soltar(b); LP.toast('No pudimos sentarlos. Prob\u00e1 de nuevo.', 'err'); return; }
      recargarYSoltar(b);
    });
  }

  function ejecutarCerrar(b, id) {
    if (enVuelo['c' + id]) return;
    var t = mesaAbierta ? mesaPorEtiqueta(mesaAbierta) : null;
    var m = t && t.cuenta;
    if (!m) return;

    /* Cerrar con saldo pendiente es una decision del local -a veces se cobra
       en efectivo y no se marco-, pero no puede pasar de largo sin querer. */
    if (m.debe > 0) {
      var ok = window.confirm('A ' + m.mesa + ' le falta cobrar ' + money(m.debe) +
        '.\n\nSi la cerras igual, la cuenta queda cerrada con ese saldo. Continuar?');
      if (!ok) return;
    }

    enVuelo['c' + id] = true;
    bloquear(b, 'Cerrando...');

    LP.cerrarSesion(sb, id, YO).then(function (hecho) {
      delete enVuelo['c' + id];

      /* La mesa todavia tiene comida en curso. No se cierra a la primera:
         casi siempre es un error, y si no lo es, se confirma y se fuerza. */
      if (hecho && hecho.bloqueado) {
        soltar(b);
        var igual = window.confirm(
          m.mesa + ' todavia tiene ' + hecho.enCurso +
          (hecho.enCurso === 1 ? ' pedido sin terminar' : ' pedidos sin terminar') +
          '.\n\nSi la cerras igual, esos pedidos quedan colgando de una cuenta ' +
          'cerrada. Cerrar de todos modos?');
        if (!igual) return;
        enVuelo['c' + id] = true;
        bloquear(b, 'Cerrando...');
        LP.cerrarSesion(sb, id, YO, true).then(function () {
          delete enVuelo['c' + id];
          LP.toast(m.mesa + ' cerrada.', 'ok');
          cerrarHoja();
          cargar(true);
        });
        return;
      }

      if (!hecho) {
        soltar(b);
        LP.toast('No pudimos cerrarla. Puede que ya la haya cerrado otro.', 'err');
        cargar(true);
        return;
      }
      LP.toast(m.mesa + ' cerrada. El proximo pedido abre una cuenta nueva.', 'ok');
      cerrarHoja();
      cargar(true);
    });
  }

  /* ------------------------------------------------------------ carga -- */
  /* Si llega un pedido de recarga mientras otra esta en vuelo, no se descarta:
     se anota y se hace UNA vuelta mas al terminar. Si no, el plano quedaba con
     datos de antes de la escritura propia hasta el proximo evento. */
  var cargando = false, pendiente = false;
  function cargar(silencioso) {
    if (cargando) { pendiente = true; return Promise.resolve(); }
    if (!sb) {
      estado.innerHTML = '<div class="estado-vacio"><h3>No hay conexion con el sistema</h3></div>';
      return Promise.resolve();
    }
    cargando = true;
    return LP.planoDelSalon(sb).then(function (datos) {
      cargando = false;
      if (datos === null) {
        conn.set(navigator.onLine ? 'retry' : 'off');
        if (!cargado) {
          /* Ojo con tocar esto: si un error de conexion cayera en el camino
             normal, la pantalla pintaria todas las mesas libres, que es el
             peor error posible aca. Por eso planoDelSalon devuelve null. */
          planoCaja.hidden = true;
          estado.innerHTML = '<div class="estado-vacio"><h3>No pudimos cargar las mesas</h3>' +
            '<p>Revisa la conexion del local.</p></div>';
        } else if (!silencioso) {
          LP.toast('No pudimos actualizar. Seguimos intentando.', 'err');
        }
        return;
      }
      conn.set(navigator.onLine ? 'live' : 'off');
      plano = datos;
      cargado = true;
      pintar();
    }).then(function () {
      if (pendiente) { pendiente = false; return cargar(true); }
    });
  }

  /* Realtime sobre pedidos y sesiones: una ronda nueva cambia el total de la
     mesa, y otro empleado puede cerrarla desde su telefono.             */
  var canal = null;
  function suscribir() {
    if (!sb) return;
    var mio = sb.channel('mesas-' + Date.now())
      .on('postgres_changes', { event: '*', schema: 'public', table: LP.TABLE },
          function () { cargar(true); })
      .on('postgres_changes', { event: '*', schema: 'public', table: LP.SESIONES_TABLE },
          function () { cargar(true); });
    canal = mio;
    mio.subscribe(function (st) {
      if (canal !== mio) return;
      if (st === 'SUBSCRIBED') conn.set(navigator.onLine ? 'live' : 'off');
    });
  }

  LP.onCleanup(function () {
    if (canal && sb) { try { sb.removeChannel(canal); } catch (e) {} }
  });

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) cargar(true);
  });

  cargar().then(suscribir);
  // Refresca los "hace X min" sin volver a consultar.
  // Solo la hoja tiene "hace X min": el plano no se rehace cada 30 s (perdia
  // el foco y las transiciones nunca corrian porque los nodos eran nuevos).
  setInterval(function () {
    if (cargado && !document.hidden && mesaAbierta && vista === 'mesa') verMesa(mesaAbierta);
  }, 30000);
});
</script>
</body>
</html>
