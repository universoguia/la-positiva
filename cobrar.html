<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3ece2">
<meta name="description" content="Mostrale el QR de cobro al cliente desde cualquier celular del salón.">
<title>La Positiva - Cobrar con QR</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="La Positiva">
<link rel="preload" href="fonts/jost-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/cormorant-500-italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
<!-- El tema (nombre, color, letra y forma) que se edita en diseno.html.
     SIN defer y a proposito: tiene que escribir las variables ANTES del
     primer pintado, o el color viejo se ve un instante y despues salta.
     Si no hay nada guardado no escribe nada y la app queda como siempre. -->
<script src="tema.js"></script>
<style>
  .wrap{max-width:560px;padding-top:calc(16px + var(--sa-t));padding-bottom:40px}

  /* En la notebook: a quien le cobras, a la izquierda; el QR, el monto y el
     boton de confirmar, a la derecha. Antes era una tira de 560px y habia
     que scrollear para llegar a "Ya pago". En modo pantalla no aplica: ahi
     el QR se lleva todo. */
  @media (min-width:1000px){
    body:not(.zoom) .wrap{max-width:1000px}
    body:not(.zoom) #contenido{
      display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);
      gap:26px;align-items:start;
    }
    body:not(.zoom) #contenido > .picker{grid-column:1;margin-bottom:0}
    body:not(.zoom) #contenido > .tip{grid-column:1}
    body:not(.zoom) #contenido > #zonaQR{grid-column:2;grid-row:1}
    body:not(.zoom) #contenido > .acciones{grid-column:2}
    /* El estado de carga y los avisos ocupan las dos columnas. */
    body:not(.zoom) #contenido > .state{grid-column:1/-1}
  }


  /* --------------------------------------------------------- el QR ----- */
  /* Fondo blanco y margen propio: un QR sin zona de silencio no escanea. */
  .qr-card{
    background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);
    padding:18px;text-align:center;box-shadow:var(--shadow);
  }
  .qr-card img{
    display:block;width:100%;max-width:420px;margin:0 auto;
    aspect-ratio:1/1;object-fit:contain;background:#fff;
  }
  .qr-pie{
    margin-top:14px;padding-top:12px;border-top:1px dashed var(--border);
    color:var(--muted);font-size:15px;
  }
  /* En el celular el QR medido daba 306px de alto y empujaba los botones a
     884px: "Agrandar para el cliente" y "Ya pago" quedaban fuera de pantalla.
     Achicado a 250 sigue escaneando de sobra -y para acercarselo al cliente
     esta el modo pantalla, que no toca esta regla-. */
  @media (max-width:560px){
    .qr-card{padding:14px}
    .qr-card img{max-width:250px}
    .qr-pie{margin-top:10px;padding-top:10px;font-size:14px}
  }

  /* Monto: lo mas grande de la pantalla, como en Mercado Pago. */
  .monto-box{
    background:var(--ink);color:#fff;border-radius:var(--r-lg);
    padding:18px 20px;margin-bottom:14px;text-align:center;
  }
  .monto-box .quien{color:var(--dark-muted);font-size:15px}
  .monto-box .cifra{
    color:var(--gold);font-size:44px;font-weight:600;line-height:1.1;
    margin-top:4px;font-variant-numeric:tabular-nums;
  }
  .monto-box .sin{color:var(--dark-ink);font-size:19px;margin-top:4px}
  @media (max-width:360px){.monto-box .cifra{font-size:36px}}

  .picker{margin-bottom:14px}
  .picker label{display:block;font-size:15px;color:var(--muted-strong);margin-bottom:6px}
  .picker-vacia{margin:0 0 14px;padding:12px 14px;border-radius:var(--r-sm);background:var(--ok-soft);color:var(--ok);font-size:15px;line-height:1.5}

  /* Un toque, no dos: antes habia que abrir un <select> y despues elegir.
     Ahora cada persona/monto es un boton propio, bien grande, para tocar
     una sola vez de pie y con las manos ocupadas. */
  .cobro-opts{display:grid;gap:8px}
  .cobro-opt{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    width:100%;min-height:52px;padding:12px 16px;
    border:2px solid var(--border-strong);border-radius:var(--r-md);
    background:var(--card);color:var(--ink);text-align:left;font-family:inherit;
    font-size:16px;transition:border-color .15s,background-color .15s;
  }
  .cobro-opt .monto{font-weight:600;font-variant-numeric:tabular-nums;flex:none}
  .cobro-opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
  .cobro-opt[aria-checked="true"] .monto{color:var(--accent)}
  .cobro-opt.sin-monto{color:var(--muted-strong)}
  .cobro-opt.sin-monto .monto{font-weight:500;color:var(--muted)}
  /* El elegir-mesa usa los mismos renglones, pero son links. */
  a.cobro-opt{text-decoration:none}
  @media (hover:hover){.cobro-opt:hover{border-color:var(--muted)}}

  /* --------------------------------------------- mesa sin QR todavia --- */
  /* No es una pantalla de error: es un paso del circuito que se resuelve
     desde acá, avisándole a la caja sin caminar hasta el mostrador. */
  .sub-monto{margin:0 0 6px;font-size:17px;color:var(--muted-strong)}
  .sub-monto b{color:var(--ink);font-variant-numeric:tabular-nums}
  .pedido-estado{margin:0 0 14px;font-size:15px;color:var(--warn);line-height:1.5}
  .pedido-estado:empty{display:none}
  .state .btn{margin:6px 4px 0}

  /* Qué mesa es, al lado del código. Con un QR por mesa, mostrar el de otra
     es el error caro: el nombre tiene que verse sin buscarlo. */
  .qr-mesa{
    display:block;color:var(--ink);font-size:17px;font-weight:600;margin-bottom:3px;
  }
  /* Cargar el QR y confirmar que entró la plata son dos momentos. */
  .dos-momentos{
    margin:0 0 8px;padding:10px 12px;border-radius:var(--r-sm);
    background:var(--warn-soft);border:1px solid var(--warn-border);
    color:var(--warn);font-size:14px;line-height:1.5;flex:1 1 100%;
  }

  /* Ticket de pago confirmado: reemplaza el QR una vez cobrado, mismo
     lugar en pantalla, sin foto de comprobante (eso es opcional y lo
     agrega la cajera despues si quiere, no bloquea nada aca). */
  .ticket-card{
    background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);
    padding:28px 22px;text-align:center;box-shadow:var(--shadow);
  }
  .ticket-check{
    width:52px;height:52px;border-radius:50%;background:var(--ok-soft);
    color:var(--ok);display:flex;align-items:center;justify-content:center;
    margin:0 auto 14px;font-size:26px;
  }
  .ticket-card h2{margin:0 0 4px;font-size:20px}
  .ticket-card .sub{color:var(--muted);font-size:14px;margin:0 0 18px}
  .ticket-linea{
    border-top:1px dashed var(--border);margin-top:16px;padding-top:14px;
  }
  .ticket-fila{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:15px}
  .ticket-fila span:first-child{color:var(--muted)}
  .ticket-fila.total{font-size:19px;font-weight:600;color:var(--ink)}

  .tip{
    margin-top:16px;padding:12px 14px;border-radius:var(--r-sm);
    background:var(--warn-soft);border:1px solid var(--warn-border);
    color:var(--warn);font-size:14px;line-height:1.5;
  }
  .tip strong{display:block;margin-bottom:2px}

  /* Modo pantalla: el QR ocupa todo, para acercarle el celular al cliente.
     Hay que ocultar en los dos niveles: #zonaQR cuelga de #contenido, no
     de .wrap, asi que un solo selector dejaba el QR sin ancho. */
  body.zoom .wrap > :not(#contenido){display:none}
  body.zoom #contenido > :not(#zonaQR){display:none}
  body.zoom{background:#fff}
  body.zoom .qr-card{border:none;box-shadow:none;padding:8px}
  /* Acotado por el alto real: monto + "Listo, volver" + margenes (~230px)
     tienen que quedar en pantalla sin scrollear. */
  body.zoom .qr-card img{max-width:min(92vw,calc(100svh - 230px))}
  body.zoom #salirZoom{margin-top:14px}
  body.zoom .monto-box{background:#fff;color:var(--ink);padding:6px}
  body.zoom .monto-box .cifra{color:var(--accent)}
  body.zoom .monto-box .quien{color:var(--muted)}
  body.zoom .qr-pie{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Cobrar con QR</h1>
      <p class="sub" id="subtitulo">Cada mesa tiene su propio QR. Mostrale el de esta mesa y confirm&aacute; cuando pag&oacute;</p>
    </div>
    <div class="head-right">
      <a class="soy" href="./" data-quien hidden></a>
      <a class="back-link" href="./" id="volver">Volver al inicio</a>
    </div>
  </header>

  <div id="contenido">
    <div class="state"><div class="spinner"></div><p>Buscando el QR de la mesa...</p></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<script src="config.js" defer></script>
<script src="app.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  'use strict';
  var esc = LP.esc, money = LP.money;
  /* Cobrar con QR lo hacen el mozo, la caja y la duenia. La cocina no. */
  if (LP.guardaDeSeccion('cobrar.html') === 'no') return;
  /* El cobro con QR, apagado desde el panel tecnico: un local que cobra
     solo en efectivo no lo quiere ni ver. */
  if (!LP.func('f_qr_pago')) {
    LP.toast('El cobro con QR est\u00e1 apagado en este local.', 'err');
    location.replace('./');
    return;
  }

  var sb = LP.client();
  var cont = document.getElementById('contenido');

  var qr = null;
  var sesion = null;    // la fila de la sesion de mesa: el QR cuelga de ella
  var pendientes = [];
  var elegido = null;   // pedido seleccionado, o null = cobro sin monto
  var etiquetas = {};   // id de pedido -> a quien corresponde (nombre o "Comensal N")
  var soy = LP.quienSoy();
  var YO = (soy && soy.nombre) || 'Cobro';
  var MI_ROL = (soy && soy.rol) || '';

  /* AJ-006: quien puede CONFIRMAR un pago desde acá. No es "quien entra a
     esta pantalla" -el mozo entra y tiene que entrar, es el que muestra el
     QR en la mesa-, es quien mira el posnet: la caja y la dueña. Se pregunta
     por caja.html y no por una lista nueva, para que el día que cambie la
     matriz de permisos esto cambie con ella. */
  var PUEDE_CONFIRMAR = LP.puedeEditar('caja.html');

  /* Cuándo avisó el salón que esta cuenta ya se pagó. Devuelve la fecha o
     null. Con "Toda la mesa" mira todas sus rondas. */
  function yaAvisado(p) {
    if (!p) return null;
    var ids = p._ids || [p.id];
    var cuando = null;
    pendientes.forEach(function (x) {
      if (ids.indexOf(x.id) === -1 || !x.pago_avisado_en) return;
      if (!cuando || new Date(x.pago_avisado_en) > new Date(cuando)) cuando = x.pago_avisado_en;
    });
    return cuando;
  }

  /* Las filas reales detrás de lo elegido: "Toda la mesa" es un resumen
     inventado en pantalla, no una fila de la base. */
  function filasDe(p) {
    if (!p) return [];
    var ids = p._ids || [p.id];
    return pendientes.filter(function (x) { return ids.indexOf(x.id) !== -1; });
  }

  /* Si el local desglosa el renglon del cubierto o lo deja incluido en el
     total. Arranca en true -desglosado, como venia- y solo lo apaga el
     ajuste. No cambia NADA de lo que se cobra: cobrable() suma siempre las
     mismas lineas. Lo unico que decide es si al lado de la cifra va la
     aclaracion de que el total incluye el servicio de mesa. */
  var desglosarCubierto = true;
  LP.desgloseDeCubiertos(sb).then(function (v) {
    if (v === desglosarCubierto) return;
    desglosarCubierto = v;
    if (qr) pintar();                  // ya estaba dibujado: se repinta
  });

  /* Con que mesa se abrio. Viene de mesas.html: cobrar.html?sesion=12.
     Sin esto la pantalla mostraba los impagos de todo el local mezclados y
     era facil marcar pagada la mesa equivocada.                         */
  var SESION = new URLSearchParams(location.search).get('sesion') || '';

  /* El boton de volver vuelve a donde vino. Cobrar es un paso adentro de un
     flujo: se entra desde el salon (mesas.html?sesion=) o desde caja. Volver
     siempre a la portada obligaba a rehacer el camino entero. */
  (function () {
    var b = document.getElementById('volver');
    if (!b) return;
    var de = '';
    try {
      if (document.referrer && new URL(document.referrer).origin === location.origin) {
        de = new URL(document.referrer).pathname.split('/').pop();
      }
    } catch (e) {}
    if (de === 'mesas.html' || (!de && SESION)) {
      b.href = 'mesas.html'; b.textContent = 'Volver al salón';
    } else if (de === 'caja.html') {
      b.href = 'caja.html'; b.textContent = 'Volver a caja';
    } else if (de === 'mozo.html') {
      b.href = 'mozo.html'; b.textContent = 'Volver a mis pedidos';
    }
  }());

  /* ------------------------------------------------------------- carga --
     Sin mesa no hay QR. El QR dejo de ser del local y pasa a ser de la
     sesion de mesa, asi que entrar aca sin ?sesion= ya no puede mostrar
     nada: lo primero es elegir a que mesa se le cobra.                  */
  function cargar() {
    if (!sb) { sinConexion(); return; }
    if (!SESION) { elegirMesa(); return; }

    Promise.all([
      LP.qrDeSesion(sb, SESION),
      (function () {
        return sb.from(LP.TABLE).select('*').eq('pagado', false)
          // Lo que se saco de la cuenta no se cobra. Antes esta pantalla era
          // la unica sin este filtro, asi que ofrecia cobrar platos anulados.
          .not('estado', 'in', LP.NO_SE_COBRA_SQL)
          .eq('sesion_id', SESION)
          .order('created_at', { ascending: false }).limit(25)
          .then(function (r) { return r.error ? [] : (r.data || []); },
                function () { return []; });
      })(),
      /* La fila de la sesion: hace falta para el nombre de la mesa aunque no
         quede nada pendiente, y para saber si ya se le pidio el QR a caja. */
      sb.from(LP.SESIONES_TABLE).select('*').eq('id', SESION).maybeSingle()
        .then(function (r) { return r.error ? null : r.data; }, function () { return null; })
    ]).then(function (res) {
      qr = res[0];
      pendientes = res[1];
      sesion = res[2];
      /* Desde una mesa: si hay mas de una ronda, se arma "Toda la mesa" con la
         suma, y viene elegida. Con una sola, esa. Le saca un paso al mozo y
         evita que el cliente pague dos veces con dos QR. */
      if (pendientes.length > 1) {
        var suma = 0;
        var conCubierto = false;
        pendientes.forEach(function (p) {
          suma += LP.cobrable(p);
          if (LP.tieneCubierto(p)) conCubierto = true;
        });
        /* "Toda la mesa" no tiene lineas propias -es la suma de las rondas-,
           asi que se anota aparte si alguna de ellas trae el cubierto. Sin
           esto, al cobrar la mesa entera el total lo incluia y la
           aclaracion no aparecia. */
        pendientes.unshift({ id: 'mesa', mesa: pendientes[0].mesa, lines: [], total: suma,
                             estado: pendientes[0].estado, pagado: false,
                             _conCubierto: conCubierto,
                             _ids: pendientes.map(function (p) { return p.id; }) });
      }
      if (pendientes.length) elegido = pendientes[0];
      pintar();
    });
  }

  /* Elegir la mesa cuando se entro sin ?sesion=: desde la portada, desde caja
     o desde un acceso directo viejo. Antes esta pantalla abria el QR unico
     del local y listo; ahora hay que saber de que mesa hablamos.        */
  function elegirMesa() {
    cont.innerHTML = '<div class="state"><div class="spinner"></div>' +
      '<p>Buscando las mesas abiertas...</p></div>';
    LP.mesasAbiertas(sb).then(function (lista) {
      if (lista === null) { sinConexion(); return; }
      var conCuenta = (lista || []).filter(function (m) { return m.debe > 0; });
      if (!conCuenta.length) {
        cont.innerHTML =
          '<div class="state"><h2>No hay ninguna mesa para cobrar</h2>' +
          '<p>Cuando una mesa tenga algo pendiente, aparece ac\u00e1 para elegirla.</p>' +
          '<a class="btn btn-secondary" href="mesas.html">Ir al sal\u00f3n</a></div>';
        return;
      }
      cont.innerHTML =
        '<div class="picker">' +
          '<span id="mesaLbl">&iquest;Qu&eacute; mesa va a pagar?</span>' +
          '<div class="cobro-opts" id="mesaOpts">' +
            conCuenta.map(function (m) {
              return '<a class="cobro-opt" href="cobrar.html?sesion=' + esc(m.sesion.id) + '">' +
                  '<span>' + esc(m.mesa) +
                    (LP.hayPedidoDeQR(m.sesion) ? ' &middot; pidi&oacute; el QR' : '') + '</span>' +
                  '<span class="monto">' + money(m.debe) + '</span>' +
                '</a>';
            }).join('') +
          '</div>' +
        '</div>' +
        '<p class="tip"><strong>Cada mesa tiene su propio QR</strong>' +
          'El que carga la caja vale para esa mesa y esa visita, no para todo el local.</p>';
    });
  }

  function sinConexion() {
    cont.innerHTML = '<div class="state state-err"><h3>No hay conexi\u00f3n con el sistema</h3>' +
      '<p>No se pudo cargar el QR de la mesa.</p></div>';
  }

  function nombreMesa() {
    if (sesion && sesion.mesa) return sesion.mesa;
    if (pendientes.length && pendientes[0].mesa) return pendientes[0].mesa;
    return 'esta mesa';
  }

  /* Esta mesa todavia no tiene QR. No es una pantalla de error: es un paso
     del circuito, y tiene que poder resolverse desde aca sin caminar hasta
     la caja. De ahi el boton que le avisa a la cajera.                  */
  function pintarSinQR() {
    var yaPidio = LP.hayPedidoDeQR(sesion);
    cont.innerHTML =
      '<div class="state">' +
        '<h2>Todavía no hay QR para ' + esc(nombreMesa()) + '</h2>' +
        '<p>El QR es de cada mesa: la caja le saca una foto al posnet con el ' +
        'monto de <b>esta</b> mesa y lo carga acá. El de otra mesa no sirve.</p>' +
        (pendientes.length
          ? '<p class="sub-monto">Esta mesa debe <b>' + money(deudaDeLaMesa()) + '</b></p>'
          : '') +
        '<p class="pedido-estado" id="pedidoEstado">' +
          (yaPidio
            ? 'Ya se lo pidieron a la caja ' + esc(LP.timeAgo(sesion.qr_pedido_en)) +
              (sesion.qr_pedido_por ? ' (' + esc(sesion.qr_pedido_por) + ')' : '') + '.'
            : '') +
        '</p>' +
        '<button type="button" class="btn btn-primary" id="pedirQR">' +
          (yaPidio ? 'Volver a pedirlo' : 'Pedirle el QR a la caja') + '</button>' +
        '<a class="btn btn-secondary" href="caja.html?sesion=' + esc(SESION) + '#qr">' +
          'Cargarlo yo desde caja</a>' +
      '</div>';
    document.getElementById('pedirQR').addEventListener('click', pedirQR);
  }

  function deudaDeLaMesa() {
    var suma = 0;
    pendientes.forEach(function (p) { if (p.id !== 'mesa') suma += LP.cobrable(p); });
    return suma;
  }

  /* El aviso a la caja. Reusa el mismo push que ya avisa los pagos: no hay
     canal nuevo. Si el push no sale igual queda anotado en la sesion, y la
     caja lo ve en su pantalla; por eso el mensaje de falla no dice que el
     pedido se perdio, dice que el aviso no salio.                       */
  function pedirQR() {
    var b = document.getElementById('pedirQR');
    if (!b || b.disabled) return;
    if (!sesion) { LP.toast('No encontramos la cuenta de esta mesa.', 'err'); return; }
    b.disabled = true;
    var antes = b.textContent;
    b.textContent = 'Avisando a la caja...';

    LP.pedirQRaCaja(sb, sesion, YO).then(function (r) {
      b.disabled = false;
      if (!r.ok) { b.textContent = antes; LP.toast(r.motivo, 'err'); return; }
      sesion = r.sesion;
      b.textContent = 'Volver a pedirlo';
      var est = document.getElementById('pedidoEstado');
      var aviso = r.aviso || {};
      if (aviso.ok) {
        if (est) est.textContent = 'Listo: la caja ya sabe que ' + nombreMesa() + ' necesita el QR.';
        LP.toast('Pedido enviado a la caja.', 'ok');
      } else {
        /* El pedido quedo anotado, lo que no salio es el aviso al celular.
           Se dice tal cual: si la cajera no lo ve, hay que ir. */
        if (est) est.textContent = 'Qued\u00f3 anotado para la caja, pero el aviso al celular no sali\u00f3.';
        LP.toast('Qued\u00f3 anotado, pero el aviso no lleg\u00f3 al celular de la caja.', 'err');
      }
    });
  }

  /* ------------------------------------------------------------ pintar -- */
  function pintar() {
    if (qr === false) { sinConexion(); return; }   // no pudimos consultar: no es 'no hay QR'
    if (!qr) { pintarSinQR(); return; }
    /* Ultimo control antes de poner la imagen en pantalla: si el QR que
       volvio no es el de ESTA mesa, no se muestra. Mostrar el de otra mesa
       es la peor falla posible de esta pantalla y no puede depender de un
       solo filtro en la consulta.                                       */
    if (String(qr.sesion_id) !== String(SESION)) { qr = null; pintarSinQR(); return; }

    /* A quien corresponde cada pedido pendiente. El nombre es opcional al
       pedir, asi que sin el se numera "Comensal 1, 2..." para que dos montos
       iguales en la misma mesa no se confundan entre si. */
    etiquetas = {};
    var contadorComensal = 0;
    pendientes.forEach(function (o) {
      if (o.id === 'mesa') { etiquetas[o.id] = 'Toda la mesa'; return; }
      contadorComensal++;
      etiquetas[o.id] = o.cliente ? o.cliente : ('Comensal ' + contadorComensal);
    });

    function optHTML(o) {
      var activo = !!(elegido && elegido.id === o.id);
      return '<button type="button" class="cobro-opt" role="radio" ' +
        'aria-checked="' + (activo ? 'true' : 'false') + '" data-pedido="' + esc(o.id) + '">' +
        '<span>' + esc(etiquetas[o.id]) + '</span>' +
        '<span class="monto">' + money(LP.cobrable(o)) + '</span>' +
      '</button>';
    }

    var opcionSinMonto = '<button type="button" class="cobro-opt sin-monto" role="radio" ' +
      'aria-checked="' + (!elegido ? 'true' : 'false') + '" data-pedido="">' +
      '<span>Sin monto</span><span class="monto">el cliente escribe</span>' +
    '</button>';

    cont.innerHTML =
      '<div class="picker">' +
        '<span id="pedidoLbl">&iquest;A qui&eacute;n le est&aacute;s cobrando?</span>' +
        (pendientes.length
          ? '<div class="cobro-opts" role="radiogroup" aria-labelledby="pedidoLbl" id="pedidoOpts">' +
              pendientes.map(optHTML).join('') + opcionSinMonto +
            '</div>'
          : '<p class="picker-vacia">Esta mesa no tiene nada pendiente de cobro.' +
            ' Si igual quieren pagar algo, el cliente escribe el monto.</p>') +
      '</div>' +

      '<div id="zonaQR">' +
        '<div class="monto-box">' +
          (elegido
            ? '<div class="quien">' + esc(elegido.mesa) +
              ' &middot; ' + esc(etiquetas[elegido.id] || '') + '</div>' +
              '<div class="cifra">' + money(LP.cobrable(elegido)) + '</div>' +
              /* Si se saco algo, se dice: el mozo tiene que poder explicar
                 por que el QR dice menos que el ticket. */
              (LP.lineasDe(elegido).some(LP.lineaSacada)
                ? '<div class="quien">Sin ' + esc(LP.lineasDe(elegido).filter(LP.lineaSacada)
                    .map(function (l) { return l.qty + '\u00d7 ' + l.name; }).join(', ')) + '</div>'
                : '') +
              /* El comensal esta mirando esta pantalla cuando le acercan el
                 QR: es el momento en que ve el importe final. Si el local
                 eligio no desglosar el cubierto, la aclaracion va aca, al
                 lado de la cifra, y no escondida en ningun lado. */
              (!desglosarCubierto && (elegido._conCubierto || LP.tieneCubierto(elegido))
                ? '<div class="quien">' + esc(LP.NOTA_SERVICIO) + '</div>'
                : '')
            : '<div class="sin">El cliente escribe el monto</div>') +
        '</div>' +
        '<div class="qr-card">' +
          '<img id="qrImg" src="' + esc(qr.imagen_url) + '" ' +
               'alt="Código QR para pagar ' + esc(nombreMesa()) + ' en ' + esc(LP.nombreLocal()) + '">' +
          /* Que mesa es, escrito al lado del codigo. Con un QR por mesa,
             confundirse de pantalla cuesta plata: el mozo tiene que poder
             comprobar de un vistazo que le esta mostrando el de ESTA mesa. */
          '<p class="qr-pie"><b class="qr-mesa">' + esc(nombreMesa()) + '</b>' +
            'Escane&aacute;lo con cualquier billetera o app del banco</p>' +
        '</div>' +
      '</div>' +

      /* En el orden del cobro: mostrar, confirmar, y recien despues las
         otras maneras de mandar el mismo link. Antes la accion de plata
         quedaba al fondo de la pila. */
      '<div class="acciones">' +
        '<button type="button" class="btn btn-primary btn-block" id="zoomBtn">' +
          'Agrandar para el cliente</button>' +
        /* Mostrar el QR y confirmar que entro la plata son dos momentos
           distintos. Se dice aca, justo arriba del boton verde: el QR ya
           esta en pantalla y la tentacion es darlo por cobrado. */
        /* AJ-006. Aca habia UN boton para todos: "Ya pago: confirmar", y
           escribia pagado=true. El mozo, parado en la mesa y sin ver el
           posnet, cerraba la cuenta con su palabra.

           Ahora son dos botones distintos segun el puesto:

             caja y duenia -> confirman de verdad, porque son los que miran
                              el posnet. El cierre sigue viviendo aca.
             el resto      -> avisan. Deja la marca "avisaron que pago" y
                              manda el push a la caja. NO cambia el estado.

           El permiso sale de la misma matriz de la fase 5 que usa el portero
           de caja.html: una sola verdad, no dos listas paralelas.       */
        (elegido
          ? (PUEDE_CONFIRMAR
              ? '<p class="dos-momentos">Confirm&aacute; reci&eacute;n cuando el posnet muestre que ' +
                  'entr&oacute; la plata. Mostrar el QR no es haber cobrado.</p>' +
                '<button type="button" class="btn btn-ok btn-block" id="cobradoBtn">' +
                'Ya pag\u00f3: confirmar ' + money(LP.cobrable(elegido)) + '</button>'
              : '<p class="dos-momentos">El pago lo confirma la caja, que es la que ve el ' +
                  'posnet. Vos avis&aacute;, y ellos cierran la cuenta.</p>' +
                '<button type="button" class="btn btn-primary btn-block" id="avisoPagoBtn">' +
                  (yaAvisado(elegido)
                    ? 'Volver a avisarle a la caja'
                    : 'Avisarle a la caja que ya pag\u00f3') + '</button>' +
                '<p class="dos-momentos" id="avisoPagoEstado" role="status" aria-live="polite">' +
                  (yaAvisado(elegido)
                    ? 'Ya avisaste ' + esc(LP.timeAgo(yaAvisado(elegido))) +
                      '. La caja lo tiene en pantalla.'
                    : '') + '</p>')
          : '') +
        // El link solo existe si el QR lo traia o si caja lo cargo a mano.
        (qr.link_pago
          ? '<button type="button" class="btn btn-secondary btn-block" id="linkBtn">' +
              'Mandar link de pago</button>'
          : '') +
        '<button type="button" class="btn btn-secondary btn-block" id="shareBtn" hidden>' +
          'Compartir el QR</button>' +
        (qr.link_pago
          ? '<a class="btn btn-ghost btn-block" id="linkAbrir" href="' + esc(qr.link_pago) + '" ' +
              'target="_blank" rel="noopener noreferrer">Abrir el link de pago</a>'
          : '') +
      '</div>' +

      '<p class="tip"><strong>Para que escanee rápido</strong>' +
        'Subí el brillo del celular al máximo y no tapes los bordes del código.</p>' +

      '<div class="acciones"><a class="btn btn-ghost btn-block" ' +
        'href="caja.html?sesion=' + esc(SESION) + '#qr">' +
        'Cambiar el QR de ' + esc(nombreMesa()) + '</a></div>';

    var opts = document.getElementById('pedidoOpts');
    if (opts) opts.addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-pedido]');
      if (!b) return;
      var id = b.dataset.pedido;
      elegido = null;
      for (var i = 0; i < pendientes.length; i++) {
        if (String(pendientes[i].id) === String(id)) elegido = pendientes[i];
      }
      pintar();
    });

    document.getElementById('zoomBtn').addEventListener('click', entrarZoom);

    if (navigator.share) {
      var sh = document.getElementById('shareBtn');
      sh.hidden = false;
      sh.addEventListener('click', compartir);
    }

    var lb = document.getElementById('linkBtn');
    if (lb) lb.addEventListener('click', mandarLink);

    var cb = document.getElementById('cobradoBtn');
    if (cb) cb.addEventListener('click', confirmarCobro);

    var ab = document.getElementById('avisoPagoBtn');
    if (ab) ab.addEventListener('click', avisarQuePago);
  }

  /* AJ-006: el paso del medio. Esto NO cobra. Deja anotado en la base que el
     salón avisó -con nombre, puesto y hora- y manda el push a la caja. La
     caja lo ve como un renglón ámbar en la mesa y confirma ella, mirando el
     posnet, que es lo único que cierra la cuenta.

     Se puede tocar de nuevo: no hace daño, sólo refresca la marca y vuelve a
     avisar. Una mesa que espera y una cajera que no vio el primer aviso es
     exactamente el caso donde hay que poder insistir.                    */
  function avisarQuePago() {
    var b = document.getElementById('avisoPagoBtn');
    if (!b || b.disabled || !elegido) return;
    var filas = filasDe(elegido);
    if (!filas.length) { LP.toast('No encontramos esa cuenta.', 'err'); return; }

    b.disabled = true;
    var antes = b.textContent;
    b.textContent = 'Avisando a la caja...';
    var est = document.getElementById('avisoPagoEstado');

    LP.avisarQuePago(sb, filas, YO, MI_ROL).then(function (r) {
      b.disabled = false;
      if (!r.ok) {
        b.textContent = antes;
        if (est) est.textContent = '';
        LP.toast(r.motivo, 'err');
        return;
      }
      // La copia en pantalla se actualiza sola: si no, el boton seguiria
      // diciendo "avisarle" despues de haber avisado.
      var nuevos = {};
      r.pedidos.forEach(function (p) { nuevos[p.id] = p; });
      pendientes = pendientes.map(function (x) { return nuevos[x.id] || x; });
      b.textContent = 'Volver a avisarle a la caja';
      var aviso = r.aviso || {};
      if (aviso.ok) {
        if (est) est.textContent = 'Listo: la caja ya sabe que ' + nombreMesa() + ' pagó. ' +
          'Ellos lo confirman cuando lo vean en el posnet.';
        LP.toast('Aviso enviado a la caja.', 'ok');
      } else {
        /* El aviso quedo anotado; lo que no salio es el push. Se dice tal
           cual: la caja lo ve igual en su pantalla, pero no le sono. */
        if (est) est.textContent = 'Quedó anotado para la caja, pero el aviso al celular no salió. ' +
          'Lo ven igual en su pantalla.';
        LP.toast('Quedó anotado, pero el aviso no llegó al celular de la caja.', 'err');
      }
    });
  }

  /* ---------------------------------------------- ticket de confirmado --
     Cada QR es de un solo pago: un monto y un momento que no se repiten.
     El ticket lo deja bien claro (a quien, cuanto, cuando) en vez de un
     toast que se borra solo. Sin foto de comprobante: eso es aparte y
     opcional, no bloquea el paso a la proxima persona.                  */
  function mostrarTicket(pedido) {
    var etiqueta = etiquetas[pedido.id] || (pedido.id === 'mesa' ? 'Toda la mesa' : 'Este pago');
    var ahora = new Date();
    var hora = ahora.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
    var fecha = ahora.toLocaleDateString('es-AR', { day: 'numeric', month: 'short' });

    cont.innerHTML =
      '<div class="ticket-card">' +
        '<div class="ticket-check">&#10003;</div>' +
        '<h2>Pago confirmado</h2>' +
        '<p class="sub">Ya qued&oacute; registrado en el sistema</p>' +
        '<div class="ticket-linea">' +
          '<div class="ticket-fila"><span>Mesa</span><span>' + esc(pedido.mesa) + '</span></div>' +
          '<div class="ticket-fila"><span>Qui&eacute;n pag&oacute;</span><span>' + esc(etiqueta) + '</span></div>' +
          '<div class="ticket-fila"><span>Cu&aacute;ndo</span><span>' + esc(fecha) + ', ' + esc(hora) + '</span></div>' +
          '<div class="ticket-fila total"><span>Monto</span><span>' + money(LP.cobrable(pedido)) + '</span></div>' +
        '</div>' +
      '</div>' +
      '<div class="acciones"><button type="button" class="btn btn-primary btn-block" id="otraPersonaBtn">' +
        'Cobrar a otra persona</button></div>';

    document.getElementById('otraPersonaBtn').addEventListener('click', cargar);
  }

  /* --------------------------------------------------- modo pantalla --- */
  function entrarZoom() {
    document.body.classList.add('zoom');
    // Se agrega una salida clara y se evita que el celular se apague.
    var salir = document.createElement('button');
    salir.type = 'button';
    salir.className = 'btn btn-secondary btn-block';
    salir.id = 'salirZoom';
    salir.textContent = 'Listo, volver';
    document.getElementById('zonaQR').appendChild(salir);
    salir.addEventListener('click', salirZoom);
    document.addEventListener('keydown', escSalir);
    pedirPantallaDespierta();
  }
  function salirZoom() {
    document.body.classList.remove('zoom');
    var s = document.getElementById('salirZoom');
    if (s) s.remove();
    document.removeEventListener('keydown', escSalir);
    soltarPantalla();
  }
  function escSalir(ev) { if (ev.key === 'Escape') salirZoom(); }

  // Mantiene la pantalla encendida mientras el cliente escanea.
  var wakeLock = null;
  function pedirPantallaDespierta() {
    if (!navigator.wakeLock) return;
    navigator.wakeLock.request('screen').then(function (l) { wakeLock = l; },
      function () { /* el navegador puede negarlo: no es critico */ });
  }
  function soltarPantalla() {
    if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  LP.onCleanup(soltarPantalla);

  /* -------------------------------------------------------- compartir -- */
  function compartir() {
    var btn = document.getElementById('shareBtn');
    btn.disabled = true;
    var texto = elegido
      ? 'Pago de ' + elegido.mesa + ' en ' + LP.nombreLocal() + ': ' + money(LP.cobrable(elegido))
      : 'QR para pagar en ' + LP.nombreLocal();

    fetch(qr.imagen_url).then(function (r) { return r.blob(); }).then(function (blob) {
      var ext = blob.type === 'image/png' ? 'png' : 'jpg';
      var file = new File([blob], 'qr-la-positiva.' + ext, { type: blob.type || 'image/jpeg' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        return navigator.share({ files: [file], title: LP.nombreLocal(), text: texto });
      }
      throw new Error('sin archivos');
    }).catch(function (e) {
      if (e && e.name === 'AbortError') return;          // cancelo el menu: no es falla
      // Sin archivo (CORS, sin senial, WebView viejo): se comparte el link.
      return navigator.share({ title: LP.nombreLocal(), text: texto, url: qr.imagen_url })
        .catch(function (e2) {
          if (e2 && e2.name === 'AbortError') return;
          LP.toast('No se pudo compartir el QR. Us\u00e1 "Agrandar para el cliente".', 'err');
        });
    }).then(function () { btn.disabled = false; });
  }

  /* ------------------------------------------------- link de pago ------ */
  // Sirve para el cliente que esta en otra mesa o en el piso de arriba:
  // en vez de bajar a escanear, recibe el link y paga desde donde esta.
  function mandarLink() {
    var btn = document.getElementById('linkBtn');
    if (!qr || !qr.link_pago || btn.disabled) return;

    var texto = elegido
      ? 'Para pagar ' + money(LP.cobrable(elegido)) + ' de ' + elegido.mesa + ' en ' + LP.nombreLocal()
      : 'Para pagar en ' + LP.nombreLocal();

    if (navigator.share) {
      btn.disabled = true;
      navigator.share({ title: LP.nombreLocal(), text: texto, url: qr.link_pago })
        .catch(function () { /* cancelar no es un error */ })
        .then(function () { btn.disabled = false; });
      return;
    }
    // Sin menu de compartir: se copia al portapapeles.
    copiar(qr.link_pago);
  }

  function copiar(txt) {
    var ok = function () { LP.toast('Link copiado. Pegalo donde quieras mandarlo.', 'ok'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(ok, function () { copiarViejo(txt, ok); });
    } else {
      copiarViejo(txt, ok);
    }
  }

  function copiarViejo(txt, ok) {
    try {
      var ta = document.createElement('textarea');
      ta.value = txt;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var hecho = document.execCommand('copy');
      document.body.removeChild(ta);
      if (hecho) { ok(); return; }
    } catch (e) {}
    LP.toast('No pudimos copiarlo. Usá "Abrir el link de pago".', 'err');
  }

  /* ------------------------------------------------------ confirmar ---- */
  function confirmarCobro() {
    var btn = document.getElementById('cobradoBtn');
    if (!elegido || btn.disabled) return;
    /* Candado de verdad y no solo el boton escondido (AJ-006): si alguien
       llega a esta funcion sin ser caja -otra pantalla, la consola-, no
       escribe. El boton que ve el mozo llama a avisarQuePago(). */
    if (!PUEDE_CONFIRMAR) {
      LP.toast('El pago lo confirma la caja. Avisales y ellos lo cierran.', 'err');
      return;
    }
    var id = elegido.id;
    btn.disabled = true;
    var textoOriginal = btn.textContent;
    btn.textContent = 'Confirmando...';

    /* El .not(...) del final es la otra mitad del filtro de arriba: entre que
       se muestra el QR y el cliente termina de pagar pueden pasar dos minutos,
       y en el medio el mozo puede haber sacado el plato. Filtrar solo la
       consulta que pinta la pantalla no alcanza: hay que filtrar la escritura. */
    sb.from(LP.TABLE).update({ pagado: true,
                               // AJ-006: queda escrito quien cerro y de que puesto.
                               pagado_en: new Date().toISOString(),
                               pagado_por: YO.slice(0, 40),
                               pagado_rol: String(MI_ROL).slice(0, 20),
                               updated_at: new Date().toISOString() })
      .in('id', elegido._ids || [id]).eq('pagado', false)
      .not('estado', 'in', LP.NO_SE_COBRA_SQL)
      .select()
      .then(function (res) {
        if (res.error) {
          LP.toast(LP.humanError(res.error, 'No se pudo confirmar el pago.'), 'err');
          btn.disabled = false; btn.textContent = 'Ya pagó: confirmar ' + money(LP.cobrable(elegido));
          return;
        }
        var recien = res.data && res.data.length;
        if (!recien) {
          /* No pego el update. Puede ser que ya estuviera pago (normal) o que
             lo hayan sacado de la cuenta (hay que decirlo fuerte: si no, el
             mozo cree que cobro y el cliente pago algo que no se le sirvio). */
          sb.from(LP.TABLE).select('estado, pagado').eq('id', (elegido._ids || [id])[0]).maybeSingle()
            .then(function (v) {
              var p = v && v.data;
              if (p && !LP.seCobra(p)) {
                LP.toast('Ese pedido se saco de la cuenta. No lo cobres.', 'err');
              } else {
                LP.toast('Ese pago ya estaba confirmado.', 'ok');
              }
              elegido = null;
              cargar();
            });
          return;
        }
        /* Avisa igual que la caja. Antes esta pantalla marcaba el pago y no
           avisaba a nadie: cobrar con el QR desde el salon dejaba a Jonathan
           sin enterarse. Solo si el pago se confirmo recien, para no volver
           a avisar cuando ya estaba pago.                                */
        res.data.forEach(function (p) { LP.avisarPago(sb, p); });
        mostrarTicket(elegido);
        elegido = null;
      }, function (e) {
        LP.toast(LP.humanError(e, 'No se pudo confirmar el pago.'), 'err');
        btn.disabled = false;
        btn.textContent = textoOriginal;   // antes quedaba en "Confirmando..." para siempre
      });
  }

  cargar();
});
</script>
</body>
</html>
