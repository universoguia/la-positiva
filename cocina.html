<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Positiva — Cocina / Equipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  body{background:var(--ink)}
  .wrap{max-width:1100px;margin:0 auto;padding:22px 20px 60px}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
  header h1{color:#fff;margin:0;font-size:28px}
  header .sub{color:var(--dark-ink);font-size:13px;margin-top:2px}
  .live{display:flex;align-items:center;gap:8px;color:var(--dark-ink);font-size:13px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(47,160,107,.6);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,160,107,.55)}70%{box-shadow:0 0 0 8px rgba(47,160,107,0)}100%{box-shadow:0 0 0 0 rgba(47,160,107,0)}}
  .cols{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  @media(max-width:900px){.cols{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.cols{grid-template-columns:1fr}}
  .col h3{color:var(--dark-ink);font-family:'Jost';font-style:normal;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 10px;padding-left:4px}
  .card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
  .card.new-flash{animation:flash 1.4s ease}
  @keyframes flash{0%{box-shadow:0 0 0 0 rgba(200,150,62,.9)}100%{box-shadow:0 6px 18px rgba(0,0,0,.18)}}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
  .mesa{font-family:'Cormorant Garamond';font-style:italic;font-size:20px}
  .meta{color:var(--muted);font-size:11.5px;margin-top:2px}
  .badge{font-size:10.5px;padding:3px 9px;border-radius:20px;font-weight:500;white-space:nowrap}
  .b-nuevo{background:var(--warn-bg);color:#8a5c14}
  .b-cocinando{background:#fde3c8;color:#a15a12}
  .b-listo{background:var(--ok-bg);color:#1c6b48}
  .b-entregado{background:var(--border);color:var(--muted3)}
  .paybadge{font-size:10px;margin-left:6px;color:var(--muted2)}
  .lines{border-top:1px dashed var(--border);border-bottom:1px dashed var(--border);padding:8px 0;margin:6px 0}
  .lines div{font-size:13px;display:flex;justify-content:space-between;padding:2px 0}
  .total{font-weight:600;text-align:right;font-size:14px;margin-bottom:10px}
  .advance{width:100%;padding:10px;border-radius:10px;background:var(--accent);color:#fff;font-size:13.5px;font-weight:500}
  .advance.done{background:var(--border);color:var(--muted3)}
  .empty{color:var(--muted2);font-size:13px;padding:10px 4px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>La Positiva</h1>
      <div class="sub">Panel de cocina y equipo</div>
    </div>
    <div class="live"><span class="dot"></span> En vivo</div>
  </header>
  <div class="cols" id="cols"></div>
</div>

<script>
const SUPABASE_URL = "https://abjonztvstyieukmrikx.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFiam9uenR2c3R5aWV1a21yaWt4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NzUyNDksImV4cCI6MjEwMzM1MTI0OX0.bGpeGAFtBvy_I-np7N8mBmK59Yk_t60UEboei7QZ4rY";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const TABLE = "la_positiva_pedidos";
const STEPS = ['Nuevo','Cocinando','Listo','Entregado'];
const NEXT = { Nuevo:'Cocinando', Cocinando:'Listo', Listo:'Entregado' };
const NEXT_LABEL = { Nuevo:'Marcar en cocina', Cocinando:'Marcar listo', Listo:'Marcar entregado' };
const fmt = n => '$' + Math.round(n).toLocaleString('es-AR');

let known = new Set();

function timeAgo(ts){
  const min = Math.max(0, Math.round((Date.now() - new Date(ts).getTime())/60000));
  return min <= 0 ? 'recién' : `hace ${min} min`;
}

function card(o, isNew){
  const badgeClass = { Nuevo:'b-nuevo', Cocinando:'b-cocinando', Listo:'b-listo', Entregado:'b-entregado' }[o.estado];
  const next = NEXT[o.estado];
  return `<div class="card ${isNew?'new-flash':''}">
    <div class="card-top">
      <div>
        <div class="mesa">${o.mesa}</div>
        <div class="meta">${o.modo} · ${timeAgo(o.created_at)}${o.cliente ? ' · '+o.cliente : ''}</div>
      </div>
      <div style="text-align:right">
        <span class="badge ${badgeClass}">${o.estado}</span>
        <div class="paybadge">${o.pagado ? '✓ Pagado' : (o.metodo_pago==='Efectivo' ? 'Paga en efectivo' : 'Pago pendiente')}</div>
      </div>
    </div>
    <div class="lines">${o.lines.map(l => `<div><span>${l.qty} × ${l.name}</span></div>`).join('')}</div>
    <div class="total">${fmt(o.total)}</div>
    ${next ? `<button class="advance" onclick="advance(${o.id},'${next}')">${NEXT_LABEL[o.estado]}</button>` : `<button class="advance done" disabled>Completado</button>`}
  </div>`;
}

async function advance(id, next){
  await sb.from(TABLE).update({ estado: next, updated_at: new Date().toISOString() }).eq('id', id);
  load();
}
window.advance = advance;

async function load(){
  const { data, error } = await sb.from(TABLE).select('*').order('created_at', { ascending: false }).limit(60);
  if (error) { console.error(error); return; }
  const groups = { Nuevo:[], Cocinando:[], Listo:[], Entregado:[] };
  data.forEach(o => { (groups[o.estado] || groups.Entregado).push(o); });

  const newIds = new Set(data.map(o=>o.id));
  const freshOnes = data.filter(o => !known.has(o.id));
  known = newIds;

  document.getElementById('cols').innerHTML = STEPS.map(step => `
    <div class="col">
      <h3>${step} (${groups[step].length})</h3>
      ${groups[step].length ? groups[step].map(o => card(o, freshOnes.some(f=>f.id===o.id))).join('') : '<div class="empty">Sin pedidos</div>'}
    </div>`).join('');
}

load();
setInterval(load, 2000);

sb.channel('pedidos-live')
  .on('postgres_changes', { event: '*', schema: 'public', table: TABLE }, () => load())
  .subscribe();
</script>
</body>
</html>
