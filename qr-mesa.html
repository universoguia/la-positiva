<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3ece2">
<meta name="description" content="Genera e imprime el QR de cada mesa de La Positiva.">
<title>La Positiva - QR de las mesas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/jost-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/cormorant-500-italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
<style>
  .wrap{max-width:760px;padding-top:calc(36px + var(--sa-t))}
  .intro{margin-bottom:24px}
  .intro h1{font-size:32px;margin:0 0 6px}
  .intro p{color:var(--muted);margin:0;font-size:16px;line-height:1.55}

  .controles{
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;
    background:var(--card);border:1px solid var(--border);
    border-radius:var(--r-lg);padding:18px 20px;margin-bottom:22px;
  }
  .controles .btn{min-height:var(--tap);padding:0 20px;font-size:15px}
  .controles .cuantas{font-size:14px;color:var(--muted-strong)}

  /* Las piezas apiladas en pantalla, una debajo de la otra, con su boton
     propio para reimprimir una sola cuando se mancha o se despega. */
  .piezas{display:flex;flex-direction:column;gap:22px;align-items:center}
  .sobre{width:100%;max-width:420px}
  .sola{
    display:flex;align-items:center;justify-content:center;
    min-height:var(--tap);width:100%;margin-top:8px;font-size:14px;
    color:var(--muted-strong);text-decoration:underline;cursor:pointer;
    background:none;border:0;font-family:inherit;
  }
  .sola:hover{color:var(--ink)}

  /* --------------------------------------------------------- la pieza --- */
  .pieza{
    background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);
    padding:38px 30px 32px;text-align:center;max-width:420px;margin:0 auto;
  }
  .pieza .marca{width:74px;height:74px;border-radius:14px;margin:0 auto 16px;display:block}
  .pieza h2{font-size:31px;margin:0 0 2px;color:var(--ink)}
  .pieza .mesa{
    font-family:'Jost',sans-serif;font-style:normal;
    font-size:15px;letter-spacing:.16em;text-transform:uppercase;
    font-weight:600;color:var(--accent);margin:0 0 22px;
  }
  .pieza .codigo{
    width:236px;height:236px;margin:0 auto 20px;
    display:flex;align-items:center;justify-content:center;
  }
  .pieza .codigo svg{width:100%;height:100%;display:block}
  .pieza .pedi{font-size:17px;color:var(--ink);margin:0 0 6px;line-height:1.45}
  .pieza .chico{font-size:13px;color:var(--muted);margin:0;line-height:1.5}

  .destino{
    margin:20px auto 0;max-width:420px;padding:12px 14px;
    background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);
    font-size:13px;color:var(--muted);line-height:1.55;word-break:break-all;
  }
  .destino b{color:var(--ink);display:block;margin-bottom:3px;word-break:normal}

  .aviso{
    margin:0 0 20px;padding:13px 16px;border-radius:var(--r-md);
    background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-border);
    font-size:14px;line-height:1.55;
  }
  .aviso[hidden]{display:none}


  /* ------------------------------------------------------- impresion ---
     Solo sale la pieza. Nada de controles, avisos ni navegacion.        */
  @media print{
    @page{margin:14mm}
    body{background:#fff}
    .no-imprimir{display:none !important}
    .wrap{max-width:none;padding:0}
    .piezas{display:block}
    .sobre{max-width:none;margin:0}
    .pieza{
      border:none;box-shadow:none;padding:0;max-width:none;
      break-inside:avoid;page-break-inside:avoid;
    }
    /* Una mesa por hoja: se recorta y se deja sobre la mesa. La ultima no
       lleva salto, si no sale una hoja en blanco al final. */
    .sobre{break-after:page;page-break-after:always}
    .sobre:last-child{break-after:auto;page-break-after:auto}
    .pieza .codigo{width:62mm;height:62mm}

    /* Reimprimir una sola: se esconden las demas mientras dura la impresion. */
    .una-sola .sobre{display:none}
    .una-sola .sobre.elegida{display:block;break-after:auto;page-break-after:auto}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="no-imprimir">
    <div class="intro">
      <h1>QR de las mesas</h1>
      <p>Ya est&aacute;n los c&oacute;digos de todas las mesas del local. Imprim&iacute;,
         recort&aacute; y dej&aacute; uno sobre cada mesa. Cada c&oacute;digo lleva a la
         carta con esa mesa ya cargada.</p>
    </div>

    <div class="aviso" id="avisoLocal" hidden></div>

    <div class="controles">
      <button type="button" class="btn btn-primary" id="imprimir">Imprimir todas</button>
      <span class="cuantas" id="cuantas">Generando los c&oacute;digos...</span>
    </div>
  </div>

  <div class="piezas" id="piezas"></div>

  <div class="destino no-imprimir" id="destino"></div>

  <a class="back-link no-imprimir" href="./">Volver al inicio</a>
</div>

<script src="vendor/qrcode.js" defer></script>
<!-- Supabase hace falta desde que las mesas salen del catalogo del local y no
     de un numero tipeado a mano. Antes esta pantalla no hablaba con la base. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<script src="config.js" defer></script>
<script src="app.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  'use strict';
  var esc = LP.esc;

  var sb = LP.client();
  var caja = document.getElementById('piezas');
  var cuantas = document.getElementById('cuantas');
  var cajaDestino = document.getElementById('destino');
  var avisoLocal = document.getElementById('avisoLocal');

  /* La URL se arma contra el origen donde esta corriendo ESTA pagina. Es a
     proposito: el QR del paquete viejo apuntaba a un dominio que ya no es el
     de la demo, y un QR impreso con la direccion equivocada no se puede
     arreglar despues: hay que reimprimir todas las mesas.               */
  function urlDeMesa(mesa) {
    var base = location.href.replace(/[^/]*$/, '');
    return base + 'pedir.html?mesa=' + encodeURIComponent(mesa);
  }

  // En local el QR sirve para probar, pero no para imprimir: el celular del
  // cliente no llega a localhost. Mejor decirlo antes de gastar papel.
  if (/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) {
    avisoLocal.textContent = 'Estas viendo esto en tu computadora (localhost). ' +
      'El codigo apunta a esta maquina, asi que sirve para probar pero no para ' +
      'imprimir: desde el celular de un cliente no va a abrir. Genera los ' +
      'definitivos desde el sitio publicado.';
    avisoLocal.hidden = false;
  }

  /* Devuelve el <svg> del codigo, o cadena vacia si la libreria no pudo.
     Correccion de errores alta: el QR sigue leyendose con una mancha de grasa
     o un pliegue, que en un bodegon pasa. Tipo 0 = que la libreria elija el
     tamanio minimo que entre.                                            */
  function svgDelCodigo(destino, etiqueta) {
    try {
      var qr = qrcode(0, 'H');
      qr.addData(destino);
      qr.make();
      var html = qr.createSvgTag({ cellSize: 6, margin: 0, scalable: true });
      var tmp = document.createElement('div');
      tmp.innerHTML = html;
      var svg = tmp.querySelector('svg');
      if (svg) {
        svg.setAttribute('role', 'img');
        svg.setAttribute('aria-label', 'Codigo QR de la ' + etiqueta);
        // El negro de la marca, no un negro puro cualquiera.
        var paths = svg.querySelectorAll('path, rect');
        for (var i = 0; i < paths.length; i++) {
          if (paths[i].getAttribute('fill') === '#000000') {
            paths[i].setAttribute('fill', '#14100e');
          }
        }
      }
      return tmp.innerHTML;
    } catch (e) {
      LP.humanError(e);
      return '';
    }
  }

  function piezaHTML(numero) {
    var etiqueta = 'Mesa ' + numero;
    var codigo = svgDelCodigo(urlDeMesa(numero), etiqueta);
    return '<div class="sobre" data-mesa="' + esc(numero) + '">' +
        '<div class="pieza">' +
          '<img class="marca" src="icons/icon-192.png" alt="" width="74" height="74">' +
          '<h2>La Positiva</h2>' +
          '<p class="mesa">' + esc(etiqueta) + '</p>' +
          '<div class="codigo">' + codigo + '</div>' +
          '<p class="pedi">Escanea para ver la carta y pedir</p>' +
          '<p class="chico">Desde tu celular, sin instalar nada.</p>' +
        '</div>' +
        '<button type="button" class="sola no-imprimir" data-sola="' + esc(numero) + '">' +
          'Imprimir solo la ' + esc(etiqueta.toLowerCase()) + '</button>' +
      '</div>';
  }

  function pintar(numeros) {
    if (!numeros.length) {
      caja.innerHTML = '';
      cuantas.textContent = '';
      cajaDestino.innerHTML = '<b>No hay mesas cargadas</b>' +
        'Todavia no estan cargadas las mesas del local, asi que no hay codigos que generar.';
      return;
    }
    caja.innerHTML = numeros.map(piezaHTML).join('');
    cuantas.textContent = numeros.length === 1
      ? 'Hay 1 mesa cargada'
      : 'Hay ' + numeros.length + ' mesas cargadas, una por hoja';
    cajaDestino.innerHTML = '<b>A donde llevan los codigos</b>' +
      esc(urlDeMesa('N')) + ' , cambiando la N por el numero de cada mesa.';
  }

  document.getElementById('imprimir').addEventListener('click', function () {
    document.body.classList.remove('una-sola');
    window.print();
  });

  /* Reimprimir una sola. Se marca cual y se saca la marca despues de imprimir,
     asi la pantalla vuelve a mostrar todas.                              */
  caja.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-sola]');
    if (!b) return;
    var sobre = b.closest('.sobre');
    var previa = caja.querySelector('.sobre.elegida');
    if (previa) previa.classList.remove('elegida');
    sobre.classList.add('elegida');
    document.body.classList.add('una-sola');
    window.print();
  });

  window.addEventListener('afterprint', function () {
    document.body.classList.remove('una-sola');
    var elegida = caja.querySelector('.sobre.elegida');
    if (elegida) elegida.classList.remove('elegida');
  });

  /* Las mesas salen del catalogo del local, no de un numero tipeado a mano:
     antes se podia imprimir el QR de una mesa que no existe, y ese codigo
     abria una carta que despues no aparecia en ningun panel.             */
  cuantas.textContent = 'Buscando las mesas del local...';
  LP.mesasDelLocal(sb).then(function (mesas) {
    if (mesas === null) {
      cuantas.textContent = '';
      cajaDestino.innerHTML = '<b>No pudimos leer las mesas</b>' +
        'Revisa la conexion del local y volve a entrar.';
      return;
    }
    pintar(mesas.map(function (m) { return String(m.numero); }));
  });
});
</script>
</body>
</html>
