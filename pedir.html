<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Sin maximum-scale: el usuario tiene que poder hacer zoom. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3ece2">
<meta name="description" content="Carta de La Positiva para pedir desde la mesa.">
<title>La Positiva - Pedir en la mesa</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/jost-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/cormorant-500-italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
<style>
  .container{padding-bottom:calc(112px + var(--sa-b))}

  /* --------------------------------------------------------- cabecera -- */
  header.top{
    position:sticky;top:0;z-index:30;
    background:rgba(243,236,226,.96);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
    padding:10px max(14px,var(--sa-l)) 8px max(14px,var(--sa-r));
    padding-top:calc(10px + var(--sa-t));
  }
  .brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand h1{margin:0;font-size:24px}
  .mesa-pill{
    background:var(--ink);color:var(--gold);
    font-size:13px;font-weight:500;padding:6px 12px;
    border-radius:var(--r-pill);letter-spacing:.04em;white-space:nowrap;
  }

  .search{position:relative;margin-top:10px}
  .search input{
    width:100%;min-height:var(--tap);
    padding:10px 44px 10px 14px;
    border-radius:var(--r-pill);border:1px solid var(--border-strong);
    background:var(--card);color:var(--ink);
  }
  .search input::placeholder{color:var(--muted-soft)}
  .search .clear{
    position:absolute;right:2px;top:50%;transform:translateY(-50%);
    width:var(--tap);height:var(--tap);border-radius:50%;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:18px;color:var(--muted);
  }
  .search .clear:hover{color:var(--ink)}

  /* Barra de categorias: pista visual de scroll con degradado en el borde. */
  .cats-shell{position:relative;margin-top:10px}
  .cats-shell::after{
    content:'';position:absolute;right:0;top:0;bottom:0;width:34px;
    background:linear-gradient(90deg,rgba(243,236,226,0),rgba(243,236,226,.98));
    pointer-events:none;opacity:1;transition:opacity .2s;
  }
  .cats-shell.at-end::after{opacity:0}
  .cats{
    display:flex;gap:8px;overflow-x:auto;padding:2px 30px 4px 0;
    scroll-snap-type:x proximity;scrollbar-width:thin;
    -webkit-overflow-scrolling:touch;
  }
  .cats::-webkit-scrollbar{height:4px}
  .cats::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px}
  .cat-btn{
    flex:none;scroll-snap-align:start;
    min-height:var(--tap);padding:8px 15px;
    border-radius:var(--r-pill);border:1px solid var(--border-strong);
    background:var(--card);color:var(--muted-strong);
    font-size:15px;white-space:nowrap;
    transition:background-color .18s,color .18s,border-color .18s;
  }
  .cat-btn:hover{background:#fff;border-color:var(--muted)}
  .cat-btn[aria-pressed="true"]{
    background:var(--accent);color:#fff;border-color:var(--accent);font-weight:500;
  }

  /* En pantallas chicas el header se compacta para no comerse la carta. */
  @media (max-width:360px),(max-height:600px){
    header.top{padding-top:calc(8px + var(--sa-t));padding-bottom:6px}
    .brand h1{font-size:21px}
    .search{margin-top:8px}
    .cats-shell{margin-top:8px}
  }

  /* ------------------------------------------------------------- carta -- */
  main{padding:14px max(14px,var(--sa-l)) 8px max(14px,var(--sa-r))}
  .catlabel{
    margin:14px 2px 12px;color:var(--muted-strong);
    font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;
  }
  .menu-grid{display:grid;gap:16px}

  /* Ficha grande: foto, nombre, precio y UNA accion evidente.
     Reemplaza la fila compacta anterior de 72px de alto. */
  .dish{
    background:var(--card);border:1px solid var(--border);
    border-radius:var(--r-lg);overflow:hidden;
    display:flex;flex-direction:column;
  }
  .dish-media{
    position:relative;width:100%;aspect-ratio:4/3;
    background:var(--border);overflow:hidden;
  }
  .dish-media img{width:100%;height:100%;object-fit:cover;display:block}
  /* Fallback visible cuando la imagen no carga: nunca un hueco invisible. */
  .dish-media.is-broken img{display:none}
  .dish-media.is-broken::after{
    content:attr(data-ini);
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:var(--accent-soft);color:var(--accent);
    font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:64px;
  }
  .dish-tag{
    position:absolute;top:10px;left:10px;
    background:var(--ink);color:var(--gold);
    font-size:13px;font-weight:500;padding:5px 11px;border-radius:var(--r-pill);
  }

  .dish-body{padding:14px 16px 16px;display:flex;flex-direction:column;flex:1}
  .dish-name{font-size:19px;font-weight:500;line-height:1.25}
  .dish-note{color:var(--muted);font-size:15px;margin-top:4px}
  .dish-cat{color:var(--muted-soft);font-size:14px;margin-top:4px}
  .dish-price{
    color:var(--accent);font-weight:600;font-size:25px;
    margin-top:8px;font-variant-numeric:tabular-nums;
  }
  .dish-actions{margin-top:14px}

  /* Un solo boton, ancho completo y bien alto. Nada de 30px. */
  .btn-add{
    display:flex;align-items:center;justify-content:center;
    width:100%;min-height:52px;padding:12px 18px;
    border-radius:var(--r-sm);background:var(--accent);color:#fff;
    font-size:17px;font-weight:500;
    transition:background-color .18s;
  }
  .btn-add:hover{background:var(--accent-dark)}
  .btn-add:active{transform:translateY(1px)}

  /* Cuando ya hay unidades, el boton se convierte en el contador. */
  .qty-row{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:var(--accent-soft);border:1px solid var(--accent);
    border-radius:var(--r-sm);padding:5px;min-height:52px;
  }
  .qty-row .icon-btn{
    width:46px;height:46px;min-width:46px;
    background:#fff;border-color:var(--accent);color:var(--accent);
    font-size:24px;font-weight:600;
  }
  .qty-row .icon-btn:hover{background:var(--accent);color:#fff}
  .qty-val{
    flex:1;text-align:center;font-weight:600;font-size:19px;
    color:var(--accent);font-variant-numeric:tabular-nums;
  }

  /* Escritorio: la ficha no se estira, se ponen mas por fila. */
  @media (min-width:700px){
    .container{max-width:960px}
    .menu-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media (min-width:1080px){
    .container{max-width:1180px}
    .menu-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  }

  /* ------------------------------------------------- volver a pedir ---- */
  .repeat-box{
    background:var(--card);border:1px solid var(--border-strong);
    border-radius:var(--r-lg);padding:16px;margin-bottom:4px;
  }
  .repeat-box h2{font-size:20px;margin:0 0 4px}
  .repeat-box p{margin:0 0 12px;color:var(--muted);font-size:15px}
  .repeat-box .btn{margin-bottom:6px}

  /* ------------------------------------------------------ barra carrito -- */
  .cartbar{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    padding:10px max(14px,var(--sa-l)) calc(10px + var(--sa-b)) max(14px,var(--sa-r));
    pointer-events:none;
  }
  .cartbar-btn{
    display:flex;width:100%;max-width:560px;margin:0 auto;
    align-items:center;justify-content:space-between;gap:12px;
    min-height:60px;padding:12px 20px;
    background:var(--ink);color:#fff;border-radius:var(--r-md);
    box-shadow:var(--shadow-lg);pointer-events:auto;
    font-size:17px;transition:background-color .18s;
  }
  .cartbar-btn:hover{background:#241c18}
  .cartbar-btn .total{color:var(--gold);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
  @media (min-width:700px){.cartbar-btn{max-width:600px}}

  .track-chip{
    position:fixed;z-index:39;left:0;right:0;
    bottom:calc(78px + var(--sa-b));
    display:flex;justify-content:center;padding:0 14px;pointer-events:none;
  }
  .track-chip button{
    pointer-events:auto;min-height:var(--tap);
    background:var(--ok);color:#fff;border-radius:var(--r-pill);
    padding:10px 18px;font-size:15px;font-weight:500;box-shadow:var(--shadow);
  }

  /* ---------------------------------------------------------- carrito -- */
  .line{
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:14px 0;border-bottom:1px solid var(--border);
  }
  .line-name{font-size:17px;min-width:0}
  .line-sub{color:var(--muted);font-size:15px;margin-top:2px}
  .line-right{display:flex;align-items:center;gap:10px;flex:none}
  .line-total{font-weight:600;min-width:88px;text-align:right;font-variant-numeric:tabular-nums;font-size:17px}
  @media (max-width:420px){
    .line{flex-wrap:wrap}
    .line-right{width:100%;justify-content:flex-end}
  }
  .totals{
    margin-top:18px;padding-top:14px;border-top:1px dashed var(--border-strong);
    display:flex;justify-content:space-between;align-items:baseline;
  }
  .totals .lbl{font-size:17px;color:var(--muted-strong)}
  .totals .val{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}

  /* --------------------------------------------------------- checkout -- */
  /* Un total enorme y una sola accion, al estilo de las apps de pago. */
  .pay-total{
    background:var(--ink);color:#fff;border-radius:var(--r-lg);
    padding:18px 20px;text-align:center;margin-bottom:18px;
  }
  .pay-total .lbl{color:var(--dark-muted);font-size:15px}
  .pay-total .val{
    color:var(--gold);font-size:42px;font-weight:600;line-height:1.1;
    margin-top:2px;font-variant-numeric:tabular-nums;
  }
  @media (max-width:360px){.pay-total .val{font-size:34px}}

  fieldset{border:none;padding:0;margin:0;min-width:0}
  legend{padding:0;font-size:17px;font-weight:500;margin-bottom:10px}

  .pay-opts{display:grid;gap:10px}
  .pay-opts label{
    display:flex;align-items:center;gap:12px;
    min-height:60px;padding:12px 16px;
    border:2px solid var(--border-strong);background:var(--card);
    border-radius:var(--r-md);cursor:pointer;
    transition:border-color .18s,background-color .18s;
  }
  .pay-opts label:hover{background:#fff}
  .pay-opts input{position:absolute;opacity:0;width:1px;height:1px}
  .pay-opts label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
  .pay-opts input:focus-visible ~ .pay-txt{outline:3px solid var(--accent);outline-offset:4px;border-radius:4px}
  /* Circulo de seleccion: el estado no depende solo del color de fondo. */
  .pay-dot{
    width:24px;height:24px;flex:none;border-radius:50%;
    border:2px solid var(--border-strong);background:#fff;position:relative;
  }
  .pay-opts label:has(input:checked) .pay-dot{border-color:var(--accent)}
  .pay-opts label:has(input:checked) .pay-dot::after{
    content:'';position:absolute;inset:4px;border-radius:50%;background:var(--accent);
  }
  .pay-txt{min-width:0}
  .pay-txt strong{display:block;font-size:17px;font-weight:500}
  .pay-txt span{display:block;color:var(--muted);font-size:14px;margin-top:1px}

  .demo-note{
    margin-top:14px;padding:12px 14px;border-radius:var(--r-sm);
    background:var(--warn-soft);border:1px solid #e8d3a8;
    color:var(--warn);font-size:14px;line-height:1.45;
  }
  .field{margin-top:14px}
  .field label{display:block;font-size:16px;color:var(--muted-strong);margin-bottom:6px}
  .field input{
    width:100%;min-height:var(--tap);padding:12px;
    border-radius:var(--r-sm);border:1px solid var(--border-strong);
    background:#fff;color:var(--ink);
  }
  .field input[aria-invalid="true"]{border-color:var(--err);background:var(--err-bg)}
  .field-row{display:flex;gap:10px}
  .field-row > *{flex:1;min-width:0}
  .field-err{color:var(--err-ink);font-size:14px;margin-top:5px}
  .field-err:empty{display:none}

  /* -------------------------------------------------------- seguimiento -- */
  .status-screen{text-align:center;padding:12px 4px}
  .check{
    width:76px;height:76px;border-radius:50%;background:var(--ok-bg);color:var(--ok);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 16px;font-size:38px;
  }
  .order-no{color:var(--muted-strong);font-size:16px;margin-top:6px}
  .qr-aviso{
    margin-top:16px;background:var(--accent-soft);border:1px solid var(--accent);
    border-radius:var(--r-md);padding:14px 16px;color:var(--accent);
    font-size:16px;line-height:1.5;text-align:left;
  }
  .qr-aviso strong{display:block;margin-bottom:2px}
  .track{
    margin-top:20px;text-align:left;background:var(--card);
    border:1px solid var(--border);border-radius:var(--r-md);padding:14px 16px;
  }
  .track-step{
    display:flex;align-items:center;gap:12px;
    padding:11px 0;color:var(--muted);font-size:17px;
  }
  .track-dot{width:13px;height:13px;border-radius:50%;background:var(--border-strong);flex:none}
  .track-step.done{color:var(--ink)}
  .track-step.done .track-dot{background:var(--ok)}
  .track-step.current{color:var(--accent);font-weight:600}
  .track-step.current .track-dot{background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  /* El estado no depende solo del color: se acompana con texto. */
  .track-step .track-mark{margin-left:auto;font-size:14px;font-weight:500}

  .offline-bar{
    position:fixed;left:0;right:0;top:0;z-index:90;
    background:var(--err);color:#fff;text-align:center;
    padding:calc(8px + var(--sa-t)) 12px 8px;font-size:15px;
  }
</style>
</head>
<body>
<a class="skip-link" href="#menuList">Ir a la carta</a>

<div class="offline-bar" id="offlineBar" hidden>Sin conexion. Revisa el wifi o los datos.</div>

<div class="container">
  <header class="top">
    <div class="brand">
      <h1>La Positiva</h1>
      <span class="mesa-pill" id="mesaPill">Mesa 7</span>
    </div>

    <div class="search">
      <label class="visually-hidden" for="searchInput">Buscar un plato</label>
      <input id="searchInput" type="search" inputmode="search" autocomplete="off"
             placeholder="Buscar un plato..." aria-describedby="searchHelp">
      <button type="button" class="clear" id="searchClear" hidden aria-label="Borrar la busqueda">&#10005;</button>
    </div>
    <p id="searchHelp" class="visually-hidden">Los resultados se actualizan mientras escribis.</p>

    <div class="cats-shell" id="catsShell">
      <div class="cats" id="cats" role="group" aria-label="Categorias de la carta"></div>
    </div>
  </header>

  <main id="menuList" tabindex="-1"></main>
  <p class="visually-hidden" id="cartLive" role="status" aria-live="polite"></p>
</div>

<div class="cartbar" id="cartbar" hidden>
  <button type="button" class="cartbar-btn" id="cartbarBtn">
    <span id="cartCount">0 items</span>
    <span class="total" id="cartTotal">$0</span>
  </button>
</div>

<div class="track-chip" id="trackChip" hidden>
  <button type="button" id="trackChipBtn">Ver el estado de mi pedido</button>
</div>

<!-- ------------------------------------------------------------ carrito -- -->
<div class="sheet" id="cartSheet" role="dialog" aria-modal="true" aria-labelledby="cartTitle" hidden>
  <div class="sheet-panel">
    <div class="sheet-head">
      <h2 id="cartTitle">Tu pedido</h2>
      <button type="button" class="close-x" data-close="cartSheet" aria-label="Cerrar el pedido">&#10005;</button>
    </div>
    <div id="cartLines"></div>
    <div class="totals"><span class="lbl">Total</span><span class="val" id="cartSheetTotal">$0</span></div>
    <button type="button" class="btn btn-primary btn-block" id="goCheckoutBtn" style="margin-top:18px;min-height:56px;font-size:18px">
      Continuar
    </button>
  </div>
</div>

<!-- ----------------------------------------------------------- checkout -- -->
<div class="sheet" id="checkoutSheet" role="dialog" aria-modal="true" aria-labelledby="checkoutTitle" hidden>
  <div class="sheet-panel">
    <div class="sheet-head">
      <h2 id="checkoutTitle">Como pagas</h2>
      <button type="button" class="close-x" data-close="checkoutSheet" aria-label="Cerrar el checkout">&#10005;</button>
    </div>

    <form id="checkoutForm" novalidate>
      <div class="pay-total">
        <div class="lbl">Total a pagar</div>
        <div class="val" id="checkoutTotal">$0</div>
      </div>

      <fieldset>
        <legend class="visually-hidden">Elegi como pagar</legend>
        <div class="pay-opts">
          <label>
            <input type="radio" name="pago" value="QR" checked>
            <span class="pay-dot" aria-hidden="true"></span>
            <span class="pay-txt"><strong>Con QR desde tu celular</strong>
              <span>Te acercamos el codigo. Pagas con la billetera que uses.</span></span>
          </label>
          <label>
            <input type="radio" name="pago" value="Efectivo">
            <span class="pay-dot" aria-hidden="true"></span>
            <span class="pay-txt"><strong>Efectivo al mozo</strong>
              <span>Pagas cuando te traen el pedido.</span></span>
          </label>
          <label>
            <input type="radio" name="pago" value="Tarjeta">
            <span class="pay-dot" aria-hidden="true"></span>
            <span class="pay-txt"><strong>Tarjeta</strong>
              <span>Simulado en esta demostracion.</span></span>
          </label>
        </div>
      </fieldset>

      <div id="payFields"></div>

      <div class="field">
        <label for="clienteNombre">Tu nombre (opcional)</label>
        <input id="clienteNombre" name="nombre" type="text" autocomplete="given-name"
               maxlength="40" placeholder="Para llamarte cuando este listo">
      </div>

      <p class="field-err" id="formErr" role="alert"></p>
      <button type="submit" class="btn btn-primary btn-block" id="payBtn"
              style="margin-top:18px;min-height:58px;font-size:18px">Enviar pedido</button>
      <button type="button" class="btn btn-ghost btn-block" id="backToCart" style="margin-top:8px">Volver al pedido</button>
    </form>
  </div>
</div>

<!-- -------------------------------------------------------- seguimiento -- -->
<div class="sheet" id="statusSheet" role="dialog" aria-modal="true" aria-labelledby="statusTitle" hidden>
  <div class="sheet-panel">
    <div class="sheet-head">
      <h2 id="statusTitle" class="visually-hidden">Estado de tu pedido</h2>
      <span aria-hidden="true"></span>
      <button type="button" class="close-x" data-close="statusSheet" aria-label="Cerrar el seguimiento">&#10005;</button>
    </div>
    <div class="status-screen" id="statusScreen"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<script src="menu-data.js" defer></script>
<script src="app.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  'use strict';
  var esc = LP.esc, money = LP.money;
  var sb = LP.client();

  var params = new URLSearchParams(location.search);
  // La mesa viene de la URL: se limita y se escapa antes de mostrarla.
  var MESA = (params.get('mesa') || '7').replace(/[^\w\s-]/g, '').slice(0, 12) || '7';
  document.getElementById('mesaPill').textContent = 'Mesa ' + MESA;

  var CATS = [];
  for (var i = 0; i < MENU.length; i++) {
    if (CATS.indexOf(MENU[i].cat) === -1) CATS.push(MENU[i].cat);
  }

  var cart = Object.create(null);   // id -> {item, qty}
  var activeCat = CATS[0];
  var query = '';

  var elCats = document.getElementById('cats');
  var elCatsShell = document.getElementById('catsShell');
  var elMenu = document.getElementById('menuList');
  var elLive = document.getElementById('cartLive');
  var elSearch = document.getElementById('searchInput');
  var elSearchClear = document.getElementById('searchClear');

  var cartSheet = document.getElementById('cartSheet');
  var checkoutSheet = document.getElementById('checkoutSheet');
  var statusSheet = document.getElementById('statusSheet');

  /* ------------------------------------------------------- categorias -- */
  function renderCats() {
    var html = '';
    for (var i = 0; i < CATS.length; i++) {
      var c = CATS[i];
      html += '<button type="button" class="cat-btn" data-cat="' + esc(c) + '" aria-pressed="' +
              (c === activeCat && !query ? 'true' : 'false') + '">' + esc(c) + '</button>';
    }
    elCats.innerHTML = html;
    scrollActiveCatIntoView();
  }

  function scrollActiveCatIntoView() {
    var active = elCats.querySelector('.cat-btn[aria-pressed="true"]');
    if (!active) return;
    var left = active.offsetLeft - (elCats.clientWidth - active.offsetWidth) / 2;
    try { elCats.scrollTo({ left: Math.max(0, left), behavior: 'smooth' }); }
    catch (e) { elCats.scrollLeft = Math.max(0, left); }
  }

  elCats.addEventListener('click', function (ev) {
    var btn = ev.target.closest('.cat-btn');
    if (!btn) return;
    activeCat = btn.dataset.cat;
    if (query) { query = ''; elSearch.value = ''; elSearchClear.hidden = true; }
    renderCats();
    renderMenu();
  });

  function updateScrollHint() {
    var atEnd = elCats.scrollLeft + elCats.clientWidth >= elCats.scrollWidth - 4;
    elCatsShell.classList.toggle('at-end', atEnd);
  }
  elCats.addEventListener('scroll', updateScrollHint, { passive: true });
  window.addEventListener('resize', updateScrollHint);

  /* ---------------------------------------------------------- busqueda -- */
  var searchTimer = null;
  elSearch.addEventListener('input', function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      query = elSearch.value.trim().toLowerCase();
      elSearchClear.hidden = !query;
      renderCats();
      renderMenu();
    }, 160);
  });
  elSearchClear.addEventListener('click', function () {
    elSearch.value = ''; query = ''; elSearchClear.hidden = true;
    renderCats(); renderMenu(); elSearch.focus();
  });

  /* ------------------------------------------------------------ carta -- */
  function visibleItems() {
    if (!query) return MENU.filter(function (d) { return d.cat === activeCat; });
    return MENU.filter(function (d) {
      return (d.name + ' ' + (d.note || '') + ' ' + d.cat).toLowerCase().indexOf(query) !== -1;
    });
  }

  function dishHTML(d) {
    var q = cart[d.id] ? cart[d.id].qty : 0;
    var ini = esc((d.name || '?').trim().charAt(0).toUpperCase());
    var actions = q > 0
      ? '<div class="qty-row">' +
          '<button type="button" class="icon-btn" data-act="dec" data-id="' + esc(d.id) + '" ' +
            'aria-label="Quitar uno de ' + esc(d.name) + '">&#8722;</button>' +
          '<span class="qty-val" aria-hidden="true">' + q + '</span>' +
          '<button type="button" class="icon-btn" data-act="inc" data-id="' + esc(d.id) + '" ' +
            'aria-label="Agregar otro ' + esc(d.name) + '. Ahora hay ' + q + '">&#43;</button>' +
        '</div>'
      : '<button type="button" class="btn-add" data-act="inc" data-id="' + esc(d.id) + '" ' +
          'aria-label="Agregar ' + esc(d.name) + ' al pedido">Agregar</button>';

    return '<article class="dish">' +
      '<div class="dish-media" data-ini="' + ini + '">' +
        '<img src="' + LP.IMG_BASE + esc(d.photo) + '" alt="" width="800" height="600" ' +
             'loading="lazy" decoding="async">' +
        (d.tag ? '<span class="dish-tag">' + esc(d.tag) + '</span>' : '') +
      '</div>' +
      '<div class="dish-body">' +
        '<div class="dish-name">' + esc(d.name) + '</div>' +
        (d.note ? '<div class="dish-note">' + esc(d.note) + '</div>' : '') +
        (query ? '<div class="dish-cat">' + esc(d.cat) + '</div>' : '') +
        '<div class="dish-price">' + money(d.price) + '</div>' +
        '<div class="dish-actions">' + actions + '</div>' +
      '</div>' +
    '</article>';
  }

  function renderMenu() {
    var items = visibleItems();
    if (!items.length) {
      elMenu.innerHTML = '<div class="state"><h3>No encontramos ese plato</h3>' +
        '<p>Proba con otra palabra o elegi una categoria.</p></div>';
      return;
    }
    var head = query
      ? '<p class="catlabel">' + items.length + (items.length === 1 ? ' resultado' : ' resultados') + '</p>'
      : '<p class="catlabel">' + esc(activeCat) + '</p>';
    elMenu.innerHTML = repeatBoxHTML() + head +
      '<div class="menu-grid">' + items.map(dishHTML).join('') + '</div>';
  }

  // Fallback de imagen. "error" no burbujea: se escucha en fase de captura.
  elMenu.addEventListener('error', function (ev) {
    var img = ev.target;
    if (img && img.tagName === 'IMG' && img.parentNode) {
      img.parentNode.classList.add('is-broken');
    }
  }, true);

  elMenu.addEventListener('click', function (ev) {
    var rep = ev.target.closest('[data-repeat]');
    if (rep) { repetirPedido(); return; }
    var btn = ev.target.closest('[data-act]');
    if (!btn) return;
    changeQty(btn.dataset.id, btn.dataset.act === 'inc' ? 1 : -1);
  });

  /* --------------------------------------------------- volver a pedir -- */
  var LAST_KEY = 'lp_ultimo_pedido';
  var ultimo = null;
  try { ultimo = JSON.parse(localStorage.getItem(LAST_KEY) || 'null'); } catch (e) {}

  function repeatBoxHTML() {
    // Solo arriba de todo, sin busqueda activa y si no hay nada en el carrito.
    if (!ultimo || !ultimo.length || query || cartCount()) return '';
    var resumen = ultimo.slice(0, 3).map(function (l) { return l.qty + ' x ' + l.name; }).join(', ');
    if (ultimo.length > 3) resumen += ' y ' + (ultimo.length - 3) + ' mas';
    return '<div class="repeat-box">' +
      '<h2 class="serif">Lo de la ultima vez</h2>' +
      '<p>' + esc(resumen) + '</p>' +
      '<button type="button" class="btn btn-primary btn-block" data-repeat="1">' +
        'Volver a pedir lo mismo</button>' +
    '</div>';
  }

  function repetirPedido() {
    if (!ultimo) return;
    var puestos = 0;
    ultimo.forEach(function (l) {
      for (var i = 0; i < MENU.length; i++) {
        if (MENU[i].id === l.id) {
          cart[l.id] = { item: MENU[i], qty: Math.max(1, Math.min(99, l.qty)) };
          puestos++;
          break;
        }
      }
    });
    renderMenu(); renderCartBar();
    if (puestos) {
      elLive.textContent = 'Repetimos tu pedido anterior.';
      LP.toast('Listo, pusimos lo de la ultima vez.', 'ok');
      renderCartLines();
      LP.openDialog(cartSheet);
    } else {
      LP.toast('Esos platos ya no estan en la carta.', 'err');
    }
  }

  /* ----------------------------------------------------------- carrito -- */
  function changeQty(id, delta) {
    var item = null;
    for (var i = 0; i < MENU.length; i++) if (MENU[i].id === id) { item = MENU[i]; break; }
    if (!item) return;
    var cur = cart[id] ? cart[id].qty : 0;
    var next = Math.max(0, Math.min(99, cur + delta));
    var eraVacio = cartCount() === 0;
    if (next === 0) delete cart[id]; else cart[id] = { item: item, qty: next };

    // Si el carrito pasa de vacio a lleno (o al reves) cambia el bloque de
    // "volver a pedir", asi que hay que repintar la lista entera.
    if (eraVacio !== (cartCount() === 0)) renderMenu();
    else repintarFicha(id, next);

    renderCartBar();
    if (LP.isDialogOpen(cartSheet)) renderCartLines();
    elLive.textContent = next === 0
      ? item.name + ' quitado del pedido.'
      : next + ' x ' + item.name + ' en el pedido.';
  }

  // Repinta solo la ficha tocada: evita perder el scroll de la carta.
  function repintarFicha(id, qty) {
    // Busqueda directa: CSS.escape esta pensado para identificadores, no para
    // el interior de un selector de atributo entrecomillado, y ahi escapa de mas.
    var btn = null;
    var todos = elMenu.querySelectorAll('[data-act][data-id]');
    for (var k = 0; k < todos.length; k++) {
      if (todos[k].dataset.id === id) { btn = todos[k]; break; }
    }
    if (!btn) { renderMenu(); return; }
    var art = btn.closest('.dish');
    if (!art) { renderMenu(); return; }
    var item = null;
    for (var i = 0; i < MENU.length; i++) if (MENU[i].id === id) { item = MENU[i]; break; }
    if (!item) { renderMenu(); return; }
    var cont = art.querySelector('.dish-actions');
    cont.innerHTML = qty > 0
      ? '<div class="qty-row">' +
          '<button type="button" class="icon-btn" data-act="dec" data-id="' + esc(id) + '" ' +
            'aria-label="Quitar uno de ' + esc(item.name) + '">&#8722;</button>' +
          '<span class="qty-val" aria-hidden="true">' + qty + '</span>' +
          '<button type="button" class="icon-btn" data-act="inc" data-id="' + esc(id) + '" ' +
            'aria-label="Agregar otro ' + esc(item.name) + '. Ahora hay ' + qty + '">&#43;</button>' +
        '</div>'
      : '<button type="button" class="btn-add" data-act="inc" data-id="' + esc(id) + '" ' +
          'aria-label="Agregar ' + esc(item.name) + ' al pedido">Agregar</button>';
  }

  function cartValues() { return Object.keys(cart).map(function (k) { return cart[k]; }); }
  function cartTotal() { return cartValues().reduce(function (s, l) { return s + l.item.price * l.qty; }, 0); }
  function cartCount() { return cartValues().reduce(function (s, l) { return s + l.qty; }, 0); }

  var elCartbar = document.getElementById('cartbar');
  function renderCartBar() {
    var n = cartCount();
    elCartbar.hidden = n === 0;
    document.getElementById('cartCount').textContent = n + (n === 1 ? ' item' : ' items');
    document.getElementById('cartTotal').textContent = money(cartTotal());
    document.getElementById('cartbarBtn').setAttribute(
      'aria-label', 'Ver tu pedido: ' + n + (n === 1 ? ' item' : ' items') + ', total ' + money(cartTotal())
    );
  }

  function renderCartLines() {
    var vals = cartValues();
    var html = vals.map(function (l) {
      return '<div class="line">' +
        '<div class="line-name">' + esc(l.item.name) +
          '<div class="line-sub">' + money(l.item.price) + ' c/u</div></div>' +
        '<div class="line-right">' +
          '<button type="button" class="icon-btn" data-act="dec" data-id="' + esc(l.item.id) + '" ' +
            'aria-label="Quitar uno de ' + esc(l.item.name) + '">&#8722;</button>' +
          '<span class="qty-val" aria-hidden="true" style="min-width:26px;font-size:17px">' + l.qty + '</span>' +
          '<button type="button" class="icon-btn" data-act="inc" data-id="' + esc(l.item.id) + '" ' +
            'aria-label="Agregar otro ' + esc(l.item.name) + '">&#43;</button>' +
          '<span class="line-total">' + money(l.item.price * l.qty) + '</span>' +
        '</div></div>';
    }).join('');
    document.getElementById('cartLines').innerHTML =
      html || '<div class="state"><p>Todavia no agregaste nada.</p></div>';
    document.getElementById('cartSheetTotal').textContent = money(cartTotal());
    document.getElementById('goCheckoutBtn').disabled = vals.length === 0;
  }

  document.getElementById('cartLines').addEventListener('click', function (ev) {
    var btn = ev.target.closest('[data-act]');
    if (!btn) return;
    changeQty(btn.dataset.id, btn.dataset.act === 'inc' ? 1 : -1);
  });

  document.getElementById('cartbarBtn').addEventListener('click', function () {
    renderCartLines();
    LP.openDialog(cartSheet);
  });

  Array.prototype.forEach.call(document.querySelectorAll('[data-close]'), function (btn) {
    btn.addEventListener('click', function () {
      LP.closeDialog(document.getElementById(btn.dataset.close));
      if (btn.dataset.close === 'statusSheet') updateTrackChip();
    });
  });

  document.getElementById('goCheckoutBtn').addEventListener('click', function () {
    if (!cartCount()) return;
    LP.closeDialog(cartSheet);
    document.getElementById('checkoutTotal').textContent = money(cartTotal());
    renderPayFields();
    LP.openDialog(checkoutSheet);
  });

  document.getElementById('backToCart').addEventListener('click', function () {
    LP.closeDialog(checkoutSheet);
    renderCartLines();
    LP.openDialog(cartSheet);
  });

  /* ---------------------------------------------------------- checkout -- */
  function selectedMetodo() {
    var el = document.querySelector('input[name="pago"]:checked');
    return el ? el.value : 'QR';
  }

  function renderPayFields() {
    var metodo = selectedMetodo();
    var el = document.getElementById('payFields');
    var btn = document.getElementById('payBtn');

    if (metodo === 'Tarjeta') {
      el.innerHTML =
        '<p class="demo-note"><strong>Pago simulado para esta demostracion.</strong> ' +
        'No se procesa ningun cobro real y los datos no se guardan ni se envian a ningun lado. ' +
        'Podes usar la tarjeta de prueba 4242 4242 4242 4242.</p>' +
        '<div class="field">' +
          '<label for="cardNum">Numero de tarjeta de prueba</label>' +
          '<input id="cardNum" type="text" inputmode="numeric" autocomplete="off" ' +
                 'maxlength="19" placeholder="4242 4242 4242 4242" aria-describedby="cardNumErr">' +
          '<p class="field-err" id="cardNumErr"></p>' +
        '</div>' +
        '<div class="field-row">' +
          '<div class="field"><label for="cardExp">Vencimiento</label>' +
            '<input id="cardExp" type="text" inputmode="numeric" autocomplete="off" ' +
                   'maxlength="5" placeholder="MM/AA" aria-describedby="cardExpErr">' +
            '<p class="field-err" id="cardExpErr"></p></div>' +
          '<div class="field"><label for="cardCvv">CVV</label>' +
            '<input id="cardCvv" type="text" inputmode="numeric" autocomplete="off" ' +
                   'maxlength="4" placeholder="123" aria-describedby="cardCvvErr">' +
            '<p class="field-err" id="cardCvvErr"></p></div>' +
        '</div>';
      btn.textContent = 'Pagar ' + money(cartTotal());
      wireCardMasks();
    } else if (metodo === 'QR') {
      el.innerHTML = '<p class="demo-note">Cuando mandes el pedido, alguien del salon te acerca ' +
        'el codigo QR para que lo escanees con tu billetera. Podes pagar desde cualquier app o banco.</p>';
      btn.textContent = 'Enviar pedido y pagar con QR';
    } else {
      el.innerHTML = '<p class="demo-note">Vas a pagar en efectivo cuando te acerquen el pedido. ' +
        'Igual lo mandamos a la cocina ahora.</p>';
      btn.textContent = 'Enviar pedido a cocina';
    }
  }

  function wireCardMasks() {
    var num = document.getElementById('cardNum');
    var exp = document.getElementById('cardExp');
    var cvv = document.getElementById('cardCvv');
    num.addEventListener('input', function () {
      var v = num.value.replace(/\D/g, '').slice(0, 16);
      num.value = v.replace(/(.{4})/g, '$1 ').trim();
    });
    exp.addEventListener('input', function () {
      var v = exp.value.replace(/\D/g, '').slice(0, 4);
      exp.value = v.length > 2 ? v.slice(0, 2) + '/' + v.slice(2) : v;
    });
    cvv.addEventListener('input', function () {
      cvv.value = cvv.value.replace(/\D/g, '').slice(0, 4);
    });
  }

  Array.prototype.forEach.call(document.querySelectorAll('input[name="pago"]'), function (r) {
    r.addEventListener('change', renderPayFields);
  });

  function setFieldError(id, msg) {
    var input = document.getElementById(id);
    var err = document.getElementById(id + 'Err');
    if (!input || !err) return;
    err.textContent = msg || '';
    if (msg) input.setAttribute('aria-invalid', 'true');
    else input.removeAttribute('aria-invalid');
  }

  function validateCheckout() {
    document.getElementById('formErr').textContent = '';
    if (!cartCount()) {
      document.getElementById('formErr').textContent = 'Tu pedido esta vacio.';
      return false;
    }
    if (selectedMetodo() !== 'Tarjeta') return true;

    var ok = true, firstBad = null;
    var num = document.getElementById('cardNum').value.replace(/\s/g, '');
    var exp = document.getElementById('cardExp').value;
    var cvv = document.getElementById('cardCvv').value;

    if (!/^\d{13,16}$/.test(num)) {
      setFieldError('cardNum', 'Ingresa un numero de prueba de 13 a 16 digitos.');
      ok = false; firstBad = firstBad || 'cardNum';
    } else setFieldError('cardNum', '');

    var m = exp.match(/^(\d{2})\/(\d{2})$/);
    if (!m || +m[1] < 1 || +m[1] > 12) {
      setFieldError('cardExp', 'Usa el formato MM/AA.');
      ok = false; firstBad = firstBad || 'cardExp';
    } else setFieldError('cardExp', '');

    if (!/^\d{3,4}$/.test(cvv)) {
      setFieldError('cardCvv', 'El CVV tiene 3 o 4 digitos.');
      ok = false; firstBad = firstBad || 'cardCvv';
    } else setFieldError('cardCvv', '');

    if (!ok && firstBad) document.getElementById(firstBad).focus();
    return ok;
  }

  /* ------------------------------------------------------------- envio -- */
  var submitting = false;

  document.getElementById('checkoutForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (submitting) return;                 // impide el doble envio
    if (!validateCheckout()) return;
    enviarPedido();
  });

  function enviarPedido() {
    var metodo = selectedMetodo();
    var btn = document.getElementById('payBtn');
    submitting = true;
    btn.disabled = true;
    btn.textContent = metodo === 'Tarjeta' ? 'Procesando pago...' : 'Enviando...';

    // Solo viajan nombre, lineas y total. Los datos de tarjeta NUNCA salen del navegador.
    var lines = cartValues().map(function (l) {
      return { name: l.item.name, qty: l.qty, price: l.item.price };
    });
    var paraRepetir = cartValues().map(function (l) {
      return { id: l.item.id, name: l.item.name, qty: l.qty };
    });
    var payload = {
      mesa: 'Mesa ' + MESA,
      modo: 'Salon',
      cliente: document.getElementById('clienteNombre').value.trim().slice(0, 40) || null,
      lines: lines,
      total: cartTotal(),
      estado: 'Nuevo',
      pagado: metodo === 'Tarjeta',      // QR y efectivo se cobran despues
      metodo_pago: metodo
    };

    var delay = metodo === 'Tarjeta' ? 1200 : 0;   // simula la pasarela
    setTimeout(function () {
      if (!sb) { fallo(null); return; }
      sb.from(LP.TABLE).insert(payload).select().single().then(function (res) {
        if (res.error || !res.data) { fallo(res.error); return; }
        submitting = false;
        btn.disabled = false;
        LP.closeDialog(checkoutSheet);

        ultimo = paraRepetir;
        try { localStorage.setItem(LAST_KEY, JSON.stringify(paraRepetir)); } catch (e) {}

        Object.keys(cart).forEach(function (k) { delete cart[k]; });
        renderMenu(); renderCartBar();
        setActiveOrder(res.data.id);
        lastEstado = null;
        showStatus(res.data);
        startPolling();
      }, function (e) { fallo(e); });
    }, delay);

    function fallo(err) {
      submitting = false;
      btn.disabled = false;
      renderPayFields();
      var box = document.getElementById('formErr');
      box.textContent = LP.humanError(err, 'No pudimos enviar el pedido. Proba de nuevo.');
      box.scrollIntoView({ block: 'nearest' });
    }
  }

  /* ------------------------------------------------------- seguimiento -- */
  var STEPS = ['Nuevo', 'Cocinando', 'Listo', 'Entregado'];
  var STEP_LABEL = {
    Nuevo: 'Recibido',
    Cocinando: 'En la cocina',
    Listo: 'Listo para servir',
    Entregado: 'Entregado'
  };
  var ORDER_KEY = 'lp_pedido_activo';
  var currentOrderId = null;
  var lastEstado = null;
  var pollTimer = null;

  function setActiveOrder(id) {
    currentOrderId = id;
    try { localStorage.setItem(ORDER_KEY, String(id)); } catch (e) {}
    updateTrackChip();
  }
  function clearActiveOrder() {
    currentOrderId = null;
    try { localStorage.removeItem(ORDER_KEY); } catch (e) {}
    updateTrackChip();
  }
  function updateTrackChip() {
    document.getElementById('trackChip').hidden = !currentOrderId || LP.isDialogOpen(statusSheet);
  }

  function showStatus(order) {
    renderStatus(order);
    LP.openDialog(statusSheet);
    updateTrackChip();
  }

  function renderStatus(order) {
    if (lastEstado === order.estado) return;   // no repinta si nada cambio
    lastEstado = order.estado;
    var idx = STEPS.indexOf(order.estado);
    if (idx < 0) idx = 0;

    var steps = STEPS.map(function (s, i) {
      var cls = i < idx ? 'done' : (i === idx ? 'current' : '');
      var mark = i < idx ? 'Listo' : (i === idx ? 'Ahora' : '');
      return '<div class="track-step ' + cls + '">' +
        '<span class="track-dot" aria-hidden="true"></span>' +
        '<span>' + esc(STEP_LABEL[s]) + '</span>' +
        (mark ? '<span class="track-mark">' + mark + '</span>' : '') +
      '</div>';
    }).join('');

    var pago = order.pagado ? 'Pagado'
             : (order.metodo_pago === 'QR' ? 'Pagas con QR' : 'Paga en efectivo');
    var avisoQR = (!order.pagado && order.metodo_pago === 'QR')
      ? '<div class="qr-aviso"><strong>Te acercamos el QR</strong>' +
        'Alguien del salon va a pasar con el codigo para que lo escanees con tu billetera.</div>'
      : '';

    document.getElementById('statusScreen').innerHTML =
      '<div class="check" aria-hidden="true">&#10003;</div>' +
      '<h3 class="serif" style="margin:0;font-size:28px">Pedido enviado</h3>' +
      '<p class="order-no">Pedido #' + esc(order.id) + ' &middot; ' + esc(order.mesa) +
        ' &middot; ' + esc(pago) + '</p>' +
      avisoQR +
      '<div class="track">' + steps + '</div>' +
      '<button type="button" class="btn btn-secondary btn-block" id="keepBrowsing" style="margin-top:18px">' +
        'Seguir mirando la carta</button>';

    document.getElementById('keepBrowsing').addEventListener('click', function () {
      LP.closeDialog(statusSheet);
      updateTrackChip();
    });
  }

  document.getElementById('trackChipBtn').addEventListener('click', function () {
    if (!currentOrderId) return;
    fetchOrder(currentOrderId).then(function (o) {
      if (o) { lastEstado = null; showStatus(o); startPolling(); }
      else { LP.toast('Ese pedido ya no esta disponible.', 'err'); clearActiveOrder(); }
    });
  });

  function fetchOrder(id) {
    if (!sb) return Promise.resolve(null);
    return sb.from(LP.TABLE).select('*').eq('id', id).maybeSingle().then(function (res) {
      if (res.error) { LP.humanError(res.error); return null; }
      return res.data;
    }, function (e) { LP.humanError(e); return null; });
  }

  // Encadenado con setTimeout: nunca se solapan dos consultas.
  function startPolling() {
    stopPolling();
    var tick = function () {
      if (!currentOrderId || !LP.isDialogOpen(statusSheet)) { stopPolling(); return; }
      fetchOrder(currentOrderId).then(function (o) {
        if (o) {
          renderStatus(o);
          if (o.estado === 'Entregado') { stopPolling(); return; }
        }
        pollTimer = setTimeout(tick, 5000);
      });
    };
    pollTimer = setTimeout(tick, 5000);
  }
  function stopPolling() {
    if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
  }
  LP.onCleanup(stopPolling);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stopPolling();
    else if (currentOrderId && LP.isDialogOpen(statusSheet)) startPolling();
  });

  /* ----------------------------------------------------------- offline -- */
  var offBar = document.getElementById('offlineBar');
  function syncOnline() { offBar.hidden = navigator.onLine; }
  window.addEventListener('online', syncOnline);
  window.addEventListener('offline', syncOnline);
  syncOnline();

  /* ------------------------------------------------------------ inicio -- */
  renderCats();
  renderMenu();
  renderCartBar();
  updateScrollHint();

  var saved = null;
  try { saved = localStorage.getItem(ORDER_KEY); } catch (e) {}
  if (saved && sb) {
    fetchOrder(saved).then(function (o) {
      if (o && o.estado !== 'Entregado') { currentOrderId = o.id; updateTrackChip(); }
      else clearActiveOrder();
    });
  }

  if (!sb) {
    LP.toast('No pudimos conectar con el sistema de pedidos. Avisale al mozo.', 'err', 8000);
  }
});
</script>
</body>
</html>
